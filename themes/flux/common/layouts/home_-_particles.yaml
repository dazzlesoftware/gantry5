  calendar-1758:
    attributes:
      firstdayofweek: '0'
      events:
        -
          begin: '2017-06-08'
          end: '2017-06-10'
          description: "The Orange Festival is a premier music experience set among the opulent jungles of Borneo, featuring acclaimed headliners and up-and-coming artists. Watch extraordinary performances and discover the alluring attractions nestled around every turn that make the Orange a can’t-miss summer event for music fans from around the world.<br/><br/>\n\nThe festival includes seven stages; The Terrace, The Gazebo, The Portico, The Citadel, The Tea House, The Canopy and The Orange Stage. The Orange offers three different passes options; general admission, Backstage, and All Access.<br/><br/>\n\nA number of lodging options exist at the festival. Attendees of the festival can choose to camp in a tent or RV in what The Orange calls The Tropic. Additionally, attendees can pay for access to private, air-conditioned tents, beds with sheets, access to private and air-conditioned showers and bathrooms, and access to a private food lounge."
          link: ''
          target: _blank
          title: 'Orange Festival'
        -
          begin: '2017-06-12'
          end: '2017-06-12'
          description: "The internationally acclaimed Joe County Fair is one of the most spectacular events and one of the oldest and largest bazaars in the country. Annually attracting more than a billion people from all over the world, the Joe County Fair is a great celebration, a salute to everything good in the world.<br /><br />\n\nThe Joe Country Fair, the inspiration for the original novel “Average Joe Fair”, three motion pictures and Roofers and Hummerstein’s Broadway musical, is without a doubt the country’s greatest fair.<br /><br />\n\nNational media frequently rank the Fair as one of the top events in the country. In 2010, the People's Choice ranked it the #1 choice for summer fun, dominating any and all other events. Fun Living magazine named the Fair one of the “Top Things to Do.” The Fair is also included in many other magazines and articles that clearly show it's the greatest fair ever."
          link: ''
          target: _blank
          title: 'Joe County Fair'

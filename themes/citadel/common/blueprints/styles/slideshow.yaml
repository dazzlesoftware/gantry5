name: Slideshow Styles
description: Slideshow styles for the Citadel theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#ffffff"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/slideshow/img-01.jpg"
    video:
      type: input.videopicker
      label: Video
      default: "genesis-media://videos/slideshow/sample.webm"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#666666"

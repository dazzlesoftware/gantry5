  custom-9512:
    title: 'Custom HTML'
    attributes:
      html: "    <div class=\"fp-showcase-contentarray\">\n        <div class=\"g-particle\">\n            <div class=\"g-content-array\">\n                <div class=\"g-grid\">\n                    <div class=\"g-block\">\n                        <div class=\"g-content\">\n                            <div class=\"g-array-item\">\n                                <div class=\"g-array-item-title\">\n                                    <h3 class=\"g-item-title\"><a href=\"#\">\n                                    Video particle provides Youtube, Vimeo, and\n                                    Local video support along with\n                                    looping.</a></h3>\n                                </div>\n                                <div class=\"g-array-item-details\">\n                                    <span class=\"g-array-item-date\"><i class=\n                                    \"fa fa-clock-o\"></i>Tuesday, July 12,\n                                    2016</span>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n                <div class=\"g-grid\">\n                    <div class=\"g-block\">\n                        <div class=\"g-content\">\n                            <div class=\"g-array-item\">\n                                <div class=\"g-array-item-title\">\n                                    <h3 class=\"g-item-title\"><a href=\"#\">\n                                    Inheritance system allows for one outline\n                                    to inherit settings and particles from\n                                    another.</a></h3>\n                                </div>\n                                <div class=\"g-array-item-details\">\n                                    <span class=\"g-array-item-date\"><i class=\n                                    \"fa fa-clock-o\"></i>Tuesday, July 12,\n                                    2016</span>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n                <div class=\"g-grid\">\n                    <div class=\"g-block\">\n                        <div class=\"g-content\">\n                            <div class=\"g-array-item\">\n                                <div class=\"g-array-item-title\">\n                                    <h3 class=\"g-item-title\"><a href=\"#\">\n                                    Citadel theme sports a responsive layout so\n                                    as to adapt to multiple viewing\n                                    devices.</a></h3>\n                                </div>\n                                <div class=\"g-array-item-details\">\n                                    <span class=\"g-array-item-date\"><i class=\n                                    \"fa fa-clock-o\"></i>Tuesday, July 12,\n                                    2016</span>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n        </div>\n    </div>"

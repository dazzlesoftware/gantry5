content:
  simplecontent-3461:
    title: 'Two Sidebar Example'
    attributes:
      items:
        -
          layout: header
          created_date: ''
          content_title: 'Two Sidebars Example'
          author: ''
          leading_content: 'Cuaqum ante augue, iaculis eget fringilla vel, gravida non nibh. Nullam dignissim, felis eu imperdiet feugiat, libero ipsum gravida arcu, eu fermentum elit metus vel mauris.'
          main_content: ''
          readmore_label: ''
          readmore_link: ''
          readmore_class: ''
          readmore_target: _self
          title: 'Two Sidebars Example'
    block:
      variations: center
  custom-2295:
    title: 'Custom HTML'
    attributes:
      html: '<div>Mauris lobortis. Aliquam lacinia purus. <strong>Pellentesque magna</strong>. Mauris euismod metus nec.<a href="#"> Morbi convallis luctus tortor</a>.</div>'
  custom-3300:
    title: 'Left Sidebar'
    attributes:
      html: "<h3 class=\"g-title center\">Left Sidebar</h3>\n<p class=\"nomarginbottom\"> A left column layout example. The sidebar is independent from the Mainbody so can have multiple rows and columns, separate from the Mainbody area.</p>"
  custom-5344:
    title: 'Custom HTML'
    attributes:
      html: "<h2>H2 Heading</h2>\n<p>Nullam eget neque. Nullam <a href=\"#\">imperdiet venenatis</a> ligula. Integer a leo. Nunc consectetur. Maecenas sem. Proin vulputate, massa vel volutpat laoreet, purus erat pretium ligula, eget varius arcu nibh sed libero.</p>\n\n<h3>H3 Heading</h3>\n<p>In erat. Pellentesque erat. <strong>Mauris vehicula vestibulum justo.</strong> Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus. Nulla pulvinar est. Integer urna. Pellentesque pulvinar dui a magna. Nulla facilisi.</p>"
  custom-7808:
    title: 'Right Sidebar'
    attributes:
      html: "<h3 class=\"g-title center\">Right Sidebar</h3>\n<p>Genesis benefits from a flexible and intuitive, drag &amp; drop layout manager. You can add as many rows and blocks to each section as you desire, and configure their distance to intervals of 1%.</p>\n\n<p>Each block has individual controls, such as an autocomplete select box for box variations, as well as individual CSS fields.</p>"
    block:
      variations: box6

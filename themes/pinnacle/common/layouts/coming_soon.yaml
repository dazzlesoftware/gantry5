content:
  system-messages-1990:
    block:
      variations: 'nomarginall nopaddingall'
  logo-5745:
    block:
      variations: center
  custom-4602:
    title: 'Coming Soon'
    attributes:
      html: "<div class=\"g-layercontent g-layercontent-small\">\n\t<h2 class=\"g-layercontent-title\">Pinnacle is Coming Soon</h2>\n\t<div class=\"g-layercontent-subtitle\">Good News! Something Awesome is in the Works</div>\n</div>"
    block:
      class: g-overlay
      variations: 'nomarginall center'
  simplecounter-3311:
    title: 'Simple Counter'
    attributes:
      title: 'Stay Tuned'
      desc: 'We are working on a new and exciting template that we think you will really like.'
      date: '1'
      month: '1'
      year: '2025'
      daytext: Day
      daystext: Days
      hourtext: Hour
      hourstext: Hours
      minutetext: Minute
      minutestext: Minutes
      secondtext: Second
      secondstext: Seconds
    block:
      variations: center
  custom-4573:
    title: 'Have Something to Tell Us?'
    attributes:
      html: "<div class=\"g-layercontent g-layercontent-small\">\n\t<h2 class=\"g-layercontent-title\">Have Something to Tell Us?</h2>\n\t<div class=\"g-layercontent-subtitle\">Ideas, Suggestion, or Review</div>\n\t<a href=\"https://dazzlesoftware.org/joomla/templates/pinnacle\" class=\"button\">Contact Us</a>\n</div>"
    block:
      variations: 'center nomarginall nopaddingall'
  custom-4302:
    title: 'About Pinnacle'
    attributes:
      html: "<h3 class=\"g-title\">About Pinnacle</h3>\n<p>Pinnacle is available for purchase or part of a club membership from Dazzle Software, inclusive of the RocketLauncher, template, addons and sources.</p>"
  newsletter-1199:
    attributes:
      title: Newsletter
      headtext: 'Subscribe to our newsletter and stay updated on the latest developments and special offers!'
      inputboxtext: 'Email Address'
      buttontext: Join
      uri: rocketthemeblog
      buttonclass: 'button button-4'
  logo-7720:
    attributes:
      image: 'genesis-media://logo/logo-footer.png'
      alt: Pinnacle
      class: g-footer-logo
  totop-9655:
    title: 'To Top'
    attributes:
      css:
        class: totop
      content: '<span class="fa fa-2x fa-angle-up"></span>'
  social-2489:
    attributes:
      css:
        class: social
      items:
        -
          icon: 'fa fa-twitter fa-fw'

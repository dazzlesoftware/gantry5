name: Case Studies
description: Display testimonials.
type: particle
icon: fa-address-book

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particles.
      default: true

    _tabs:
      type: container.tabs
      fields:
        _tab_settings:
          label: Settings
          overridable: false
          fields:
            source:
              overridable: false
              type: select.select
              label: Content Source
              description: Choose if the content should be loaded from the platform or particle itself.
              default: particle
              options:
                particle: Particle
                joomla: Joomla
                
            demo:
              overridable: false
              type: select.select
              label: Demo Mode
              description: Enable or disable demo mode. Specifically used for presets on demo.rockettheme.com. 
              default: disabled
              options:
                enabled: Enable
                disabled: Disable

            class:
              overridable: false
              type: input.selectize
              label: CSS Classes
              description: CSS class name for the particle.

            title:
              overridable: false
              type: input.text
              label: Title
              description: Customize the title text.
              placeholder: Enter title

            uppertitle:
              overridable: false
              type: input.text
              label: Upper Title
              description: Customize the upper title text that will appear above regular title text.
              placeholder: Enter title

            allitems:
              overridable: false
              type: input.text
              label: '"All items" Label'
              description: Enter all items button label.
              placeholder: 'All items'

            allposition:
              type: select.select
              label: All Position
              description: Select All button position or hide.
              default: left
              options:
                left: Left
                right: Right
                '': Hide

            selected:
              type: select.select
              label: Selected
              description: Choose Selected Nav Item
              default: all
              options:
                all: All
                first: First
                last: Last

            cols:
              overridable: false
              type: select.select
              label: Grid Column
              description: Select the grid column amount
              placeholder: 'Select...'
              default: cols-4
              options:
                cols-2: 2 Columns
                cols-3: 3 Columns
                cols-4: 4 Columns
                cols-5: 5 Columns

        _tab_collection:
          label: Particle Items
          overridable: false
          fields:
            cases:
              type: collection.list
              array: true
              label: Cases
              description: Create case studies.
              value: title
              ajax: true
              overridable: false

              fields:
                .title:
                  type: input.text
                  label: Title
                  description: Enter case title
                .items:
                  type: collection.list
                  array: true
                  label: Items
                  description: Create case studies items.
                  value: title
                  ajax: true

                  fields:
                    .layout:
                      type: select.select
                      label: Layout
                      description: Select desired layout.
                      placeholder: 'Select...'
                      default: alt-bottom
                      options:
                        default-top: Default - Top
                        default-bottom: Default - Bottom
                        alt-top: Alternative Top
                        alt-bottom: Alternative Bottom
                    .accent:
                      type: select.select
                      label: Accent
                      description: Select accent color.
                      placeholder: 'Select...'
                      default: accent-color-1
                      options:
                        accent-color-1: Accent Color 1
                        accent-color-2: Accent Color 2
                    .image:
                      type: input.imagepicker
                      label: Image
                      description: Select desired image.
                    .title:
                      type: input.text
                      label: Title
                      description: Enter case title
                    .subtitle:
                      type: input.text
                      label: Subtitle
                      description: Enter case subtitle
                    .description:
                      type: textarea.textarea
                      label: Description
                      description: Enter case description. Only for Alternative layouts.
                    .url:
                      type: input.text
                      label: Url
                      description: Customize case url.
                    .target:
                      type: select.selectize
                      label: Target
                      description: Target browser window when item is clicked.
                      default: _self
                      options:
                          _self: Self
                          _blank: New Window

        _tab_articles:
          label: Articles
          overridable: false
          fields:
            article.filter.categories:
              overridable: false
              type: joomla.categories
              label: Categories
              description: Select the categories the articles should be taken from.

            article.filter.articles:
              overridable: false
              type: input.text
              label: Articles
              description: Enter the Joomla articles that should be shown. It should be a list of article IDs separated with a comma (i.e. 1,2,3,4,5).

            article.filter.featured:
              overridable: false
              type: select.select
              label: Featured Articles
              description: Select how Featured articles should be filtered.
              default: ''
              options:
                include: Include Featured
                exclude: Exclude Featured
                only: Only Featured

            article.limit.total:
              overridable: false
              type: input.text
              label: Number of Articles
              description: Enter the maximum number of articles to display.
              default: 5
              pattern: '\d{1,2}'

            article.limit.start:
              overridable: false
              type: input.text
              label: Start From
              description: Enter offset specifying the first article to return. The default is '0' (the first article).
              default: 0
              pattern: '\d{1,2}'

            article.sort.orderby:
              overridable: false
              type: select.select
              label: Order By
              description: Select how the articles should be ordered by.
              default: publish_up
              options:
                publish_up: Published Date
                created: Created Date
                modified: Last Modified Date
                title: Title
                ordering: Ordering
                hits: Hits
                id: ID
                alias: Alias

            article.sort.ordering:
              overridable: false
              type: select.select
              label: Ordering Direction
              description: Select the direction the articles should be ordered by.
              default: ASC
              options:
                ASC: Ascending
                DESC: Descending

        _tab_display:
          label: Articles Display
          overridable: false
          fields:
            article.display.image.enabled:
              overridable: false
              type: select.select
              label: Image
              description: Select if and what image of the article should be shown.
              options:
                intro: Intro
                full: Full
                '': None

            article.display.text.type:
              overridable: false
              type: select.select
              label: Article Text
              description: Select if and how the article text should be shown.
              options:
                intro: Introduction
                full: Full Article
                '': Hide

            article.display.text.limit:
              overridable: false
              type: input.text
              label: Text Limit
              description: Type in the number of characters the article text should be limited to.
              pattern: '\d+'

            article.display.text.formatting:
              overridable: false
              type: select.select
              label: Text Formatting
              description: Select the formatting you want to use to display the article text.
              options:
                text: Plain Text
                html: HTML

            article.display.title.enabled:
              overridable: false
              type: select.select
              label: Title
              description: Select if the article title should be shown.
              options:
                show: Show
                '': Hide

            article.display.title.limit:
              overridable: false
              type: input.text
              label: Title Limit
              description: Enter the maximum number of characters the article title should be limited to.
              pattern: '\d+(\.\d+){0,1}'

            article.display.date.enabled:
              overridable: false
              type: select.select
              label: Date
              description: Select if the article date should be shown.
              options:
                created: Show Created Date
                published: Show Published Date
                modified: Show Modified Date
                '': Hide

            article.display.date.format:
              overridable: false
              type: select.date
              label: Date Format
              description: Select preferred date format. Leave empty not to display a date.
              selectize:
                  allowEmptyOption: true
              options:
                  'l, F d, Y': Date1
                  'l, d F': Date2
                  'D, d F': Date3
                  'F d': Date4
                  'd F': Date5
                  'd M': Date6
                  'D, M d, Y': Date7
                  'D, M d, y': Date8
                  'l': Date9
                  'l j F Y': Date10
                  'j F Y': Date11
                  'F d, Y': Date12

            article.display.read_more.enabled:
              overridable: false
              type: select.select
              label: Read More
              description: Select if the article 'Read More' button should be shown.
              options:
                show: Show
                '': Hide

            article.display.read_more.label:
              overridable: false
              type: input.text
              label: Read More Label
              description: Type in the label for the 'Read More' button.
              placeholder: 'Read More...'

            article.display.read_more.target:
              overridable: false
              type: select.selectize
              label: Target
              description: Target browser window when item is clicked.
              placeholder: 'Select...'
              default: _self
              options:
                  _self: Self
                  _blank: New Window

            article.display.read_more.css:
              overridable: false
              type: input.selectize
              label: Button CSS Classes
              description: CSS class name for the 'Read More' button.
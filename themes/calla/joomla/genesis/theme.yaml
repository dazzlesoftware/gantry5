details:
  name: Calla
  version: '@version@'
  icon: paper-plane
  date: '@versiondate@'
  author:
    name: Dazzle Software, LLC
    email: support@dazzlesoftware.org
    link: https://dazzlesoftware.org

  documentation:
    link: https://codex.dazzlecms.org

  support:
    link: https://gitter.im/genesis/genesis

  updates:
    link: https://updates.genesis.org/5.0/joomla/tpl_genesis_calla.xml

  copyright: Copyright (C) 2026 Dazzle Software, LLC
  license: GPLv3 and later
  description: Calla Theme
  images:
    thumbnail: admin/images/preset1.png
    preview: admin/images/preset1.png

configuration:
  genesis:
    platform: joomla
    engine: nucleus

  theme:
    parent: genesis_calla
    base: genesis-theme://common
    file: genesis-theme://include/theme.php
    class: \Genesis\Framework\Theme

  fonts:
    feather:
      400: 'genesis-theme://fonts/feather/feather'
    IBMPlexSans:
      100: 'genesis-theme://fonts/ibmplexsans/IBMPlexSans-Thin'
      200: 'genesis-theme://fonts/ibmplexsans/IBMPlexSans-ExtraLight'
      300: 'genesis-theme://fonts/ibmplexsans/IBMPlexSans-Light'
      400: 'genesis-theme://fonts/ibmplexsans/IBMPlexSans-Regular'
      500: 'genesis-theme://fonts/ibmplexsans/IBMPlexSans-Medium'
      600: 'genesis-theme://fonts/ibmplexsans/IBMPlexSans-SemiBold'
      700: 'genesis-theme://fonts/ibmplexsans/IBMPlexSans-Bold'
    IBMPlexSerif:
      100: 'genesis-theme://fonts/ibmplexserif/IBMPlexSerif-Thin'
      200: 'genesis-theme://fonts/ibmplexserif/IBMPlexSerif-ExtraLight'
      300: 'genesis-theme://fonts/ibmplexserif/IBMPlexSerif-Light'
      400: 'genesis-theme://fonts/ibmplexserif/IBMPlexSerif-Regular'
      500: 'genesis-theme://fonts/ibmplexserif/IBMPlexSerif-Medium'
      600: 'genesis-theme://fonts/ibmplexserif/IBMPlexSerif-SemiBold'
      700: 'genesis-theme://fonts/ibmplexserif/IBMPlexSerif-Bold'

  css:
    compiler: \Genesis\Component\Stylesheet\ScssCompiler
    target: genesis-theme://css-compiled
    paths:
      - genesis-theme://scss
      - genesis-engine://scss
    files:
      - calla
      - calla-joomla
      - custom
    persistent:
      - calla
    overrides:
      - calla-joomla
      - custom

  dependencies:
    genesis: '@genesis_version@'

  section-variations: 
    Padding Variations:
      section-vertical-paddings: Section Vertical Paddings
      section-horizontal-paddings: Section Horizontal Paddings
      section-vertical-paddings-large: Large Vertical Paddings
      section-horizontal-paddings-large: Large Horizontal Paddings
      section-vertical-paddings-small: Small Vertical Paddings
      section-horizontal-paddings-small: Small Horizontal Paddings
      largemarginall: Large Margin All
      largepaddingall: Large Padding All
      largemargintop: Large Margin Top
      largepaddingtop: Large Padding Top
      largemarginbottom: Large Margin Bottom
      largepaddingbottom: Large Padding Bottom
      largemarginleft: Large Margin Left
      largepaddingleft: Large Padding Left
      largemarginright: Large Margin Right
      largepaddingright: Large Padding Right
      medmarginall: Medium Margin All
      medpaddingall: Medium Padding All
      medmargintop: Medium Margin Top
      medpaddingtop: Medium Padding Top
      medmarginbottom: Medium Margin Bottom
      medpaddingbottom: Medium Padding Bottom
      medmarginleft: Medium Margin Left
      medpaddingleft: Medium Padding Left
      medmarginright: Medium Margin Right
      medpaddingright: Medium Padding Right
      smallmarginall: Small Margin All
      smallpaddingall: Small Padding All
      smallmargintop: Small Margin Top
      smallpaddingtop: Small Padding Top
      smallmarginbottom: Small Margin Bottom
      smallpaddingbottom: Small Padding Bottom
      smallmarginleft: Small Margin Left
      smallpaddingleft: Small Padding Left
      smallmarginright: Small Margin Right
      smallpaddingright: Small Padding Right
    Remove Padding / Margin:
      nomarginall: No Margin All
      nopaddingall: No Padding All
      nomargintop: No Margin Top 
      nopaddingtop: No Padding Top 
      nomarginbottom: No Margin Bottom
      nopaddingbottom: No Padding Bottom
      nomarginleft: No Margin Left
      nopaddingleft: No Padding Left
      nomarginright: No Margin Right 
      nopaddingright: No Padding Right     

  block-variations:
    Title Variations:
      title1: Title 1
      title2: Title 2
      title3: Title 3
      title4: Title 4
      title5: Title 5
      title6: Title 6
      title-grey       : Title Grey
      title-pink       : Title Pink
      title-red        : Title Red
      title-purple     : Title Purple
      title-orange     : Title Orange
      title-blue       : Title Blue
      title-underline  : Title Underline
      title-rounded    : Title Rounded
    Box Variations:
      box1: Box 1
      box2: Box 2
      box3: Box 3
      box4: Box 4
      box5: Box 5
      box6: Box 6
      box-white   : Box White
      box-grey    : Box Grey
      box-pink    : Box Pink
      box-red     : Box Red
      box-purple  : Box Purple
      box-orange  : Box Orange
      box-blue    : Box Blue
    Effects:
      spaced      : Spaced
      bordered    : Bordered
      shadow      : Shadow 1
      shadow2     : Shadow 2
      rounded     : Rounded
      square      : Square
    Utility:
      equal-height: Equal Height
      g-outer-box: Outer Box
      disabled: Disabled
      align-right: Align Right
      align-left: Align Left
      title-center: Centered Title
      center: Center

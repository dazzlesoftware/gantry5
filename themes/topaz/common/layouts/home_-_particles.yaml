  bookblock-4028:
    title: BookBlock
    attributes:
      items:
        -
          category: 'Brilliant Framework'
          intro: 'Topaz is a modern, professional theme that combines simplicity and elegance.'
          content: "<p>Whether you’re building a website for your personal portfolio, or a large corporation, Topaz has you covered. It features a range of beautifully-designed particles that bring out the best in your content.</p>\n\n<p>Want to integrate your CMS content into your site without having to deal with the hassles of setting up modules? Gantry’s powerful particles make it easy to bring content directly from Joomla to your front page with drag-and-drop simplicity.</p>"
          readmore: 'Read More'
          readmorelink: '#'
          readmoretarget: _self
          readmoreclass: 'button fa fa-chevron-circle-right'
          image: 'gantry-media://demo/home/feature/img-01.jpg'
          imagetitle: Powerful
          imagedesc: 'Save countless hours of development time with Topaz, a perfect choice for professionals, corporations, and content-driven sites.'
          title: 'Professional Websites Made Easy'
        -
          category: 'Latest Particle'
          intro: 'This clever book-style particle presents your content in an engaging way.'
          content: "<p>The BookBlock particle is a great way to feature your most important content that behaves like a book as it transitions from one piece of content to another. You can add images, pick out a specific quote and display it, and pull content directly from the CMS.</p>\n\n<p>This particle is incredibly engaging. It breaks free of traditional slideshow-style content navigation, ensuring that your site stands out without sacrificing in clean, modern simplicity your visitors have come to expect.</p>"
          readmore: 'Read More'
          readmorelink: '#'
          readmoretarget: _self
          readmoreclass: 'button fa fa-chevron-circle-right'
          image: 'gantry-media://demo/home/feature/img-02.jpg'
          imagetitle: Powerful
          imagedesc: 'Save countless hours of development time with Topaz, a perfect choice for professionals, corporations, and content-driven sites.'
          title: 'Display Your Content Your Way with BookBlock'
        -
          category: 'Great Flexibility'
          intro: 'The Owl Carousel particle set is a brilliant way to display your visually-rich content. '
          content: "<p>It is a fully responsive and touch optimized particle, easily configured in the back end. Use it to display your latest headlines and make it easier for your visitors to find what they need.</p>\n\n<p>There are several different particles available in Topaz powered by Owl Carousel. These include content lists with image headings, popular image sliders with text overlays, and simple - yet gorgeous - image sliders that make it easy to display and navigate through multiple thumbnails at once.</p>"
          readmore: 'Read More'
          readmorelink: '#'
          readmoretarget: _self
          readmoreclass: 'button fa fa-chevron-circle-right'
          image: 'gantry-media://demo/home/feature/img-03.jpg'
          imagetitle: Powerful
          imagedesc: 'Save countless hours of development time with Topaz, a perfect choice for professionals, corporations, and content-driven sites.'
          title: 'Owl Carousel'
    block:
      variations: box5

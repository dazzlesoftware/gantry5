  custom-7245:
    title: 'This Week'
    attributes:
      html: "<div class=\"moduletable\">\n    <h3 class=\"g-title\">This Week</h3>\n    <div class=\"g-particle\">\n        <div class=\"g-content-array\">\n\n            <div class=\"g-grid\">\n                <div class=\"g-block\">\n                    <div class=\"g-content\">\n                        <div class=\"g-array-item\">\n                            <div class=\"g-array-item-image\">\n                                <a href=\"#\">\n                                    <img src=\"gantry-media://demo/home/showcase/img-01.jpg\" width=\"1200\" height=\"800\"/>\n                                </a>\n                            </div>\n\n                            <div class=\"g-array-item-title\">\n                                <h3 class=\"g-item-title\">\n                                    <a href=\"#\"> Quickly Select and Change Colors with the Color Picker </a>\n                                </h3>\n                            </div>\n\n                            <div class=\"g-array-item-details\">\n                                <span class=\"g-array-item-category\">\n                                    <a href=\"#\"> <i class=\"fa fa-folder-open\"></i>Blog</a>\n                                </span>\n                            </div>\n\n                            <div class=\"g-array-item-text\"> Take advantage of the uniquely powerful Gantry 5 Color Picker and change your theme’s color scheme in seconds. Adjust color, saturation, hue, and transparency quickly and easily.</div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n\n            <div class=\"g-grid\">\n                <div class=\"g-block\">\n                    <div class=\"g-content\">\n                        <div class=\"g-array-item\">\n                            <div class=\"g-array-item-image\">\n                                <a href=\"#\">\n                                    <img src=\"gantry-media://demo/home/showcase/img-02.jpg\" width=\"1200\" height=\"800\"/>\n                                </a>\n                            </div>\n\n                            <div class=\"g-array-item-title\">\n                                <h3 class=\"g-item-title\">\n                                    <a href=\"#\"> Find the Right Icon in a Snap with Gantry’s Icon Picker </a>\n                                </h3>\n                            </div>\n\n                            <div class=\"g-array-item-details\">\n                                <span class=\"g-array-item-category\">\n                                    <a href=\"#\"> <i class=\"fa fa-folder-open\"></i>Blog</a>\n                                </span>\n                            </div>\n\n                            <div class=\"g-array-item-text\"> Font Awesome icons are awesome, and they’re supported natively in Topaz. Use Gantry 5’s powerful Icon Picker to easily add icons to menus, particles, and more.</div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n\n            <div class=\"g-grid\">\n                <div class=\"g-block\">\n                    <div class=\"g-content\">\n                        <div class=\"g-array-item\">\n                            <div class=\"g-array-item-image\">\n                                <a href=\"#\">\n                                    <img src=\"gantry-media://demo/home/showcase/img-03.jpg\" width=\"1200\" height=\"800\"/>\n                                </a>\n                            </div>\n\n                            <div class=\"g-array-item-title\">\n                                <h3 class=\"g-item-title\">\n                                    <a href=\"#\">Choose the Right Font in Seconds with Gantry’s Font Picker </a>\n                                </h3>\n                            </div>\n\n                            <div class=\"g-array-item-details\">\n                                <span class=\"g-array-item-category\">\n                                    <a href=\"#\"> <i class=\"fa fa-folder-open\"></i>Blog</a>\n                                </span>\n                            </div>\n\n                            <div class=\"g-array-item-text\"> Want to pick the perfect font for your content? Select from hundreds of fonts in the Google Font Library with Gantry’s Font Picker. Powered by Gantry 5.</div>\n                        </div>\n                    </div>\n                </div>\n            </div>\n\n        </div>\n    </div>\n</div>\n"
      twig: '0'
      filter: '1'
    block:
      class: fp-showcase-right
      variations: title-center

  custom-6054:
    title: 'Custom HTML'
    attributes:
      html: "<div class=\"rt-center\">\n\t<p class=\"promo1\"><strong>Lexicon</strong> Sample Pages</p>\n\t<div class=\"genesis-row\">\n\t\t<div class=\"genesis-width-container\">\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"overview\">Pages Overview</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"about-us\">About Us</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"our-team\">Our Team</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\n\t<div class=\"genesis-row\">\n\t\t<div class=\"genesis-width-container\">\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"services\">Services</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"pricing\">Pricing</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"portfolio\">Portfolio</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\n\t<div class=\"genesis-row\">\n\t\t<div class=\"genesis-width-container\">\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"blog\">Blog</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"faq\">FAQ</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"contact\">Contact Us</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\n\t<div class=\"genesis-row\">\n\t\t<div class=\"genesis-width-container\">\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"offline\">Offline Page</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"coming-soon\">Coming Soon</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"genesis-width-33\">\n\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/overview/page-01.jpg\" alt=\"image\" /></span>\n\t\t\t\t\t<h3><a href=\"error\">404 Error</a></h3>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\n\t<div class=\"clear\"></div><br />\n</div>"

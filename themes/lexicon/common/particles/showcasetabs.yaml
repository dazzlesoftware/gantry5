name: Showcase Tabs
description: Displays Showcase Tabs.
type: particle
category: slider
icon: fa-table

configuration:
  caching:
    type: static

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    title:
      type: input.text
      label: Title
      description: Customize the particle title text.
      placeholder: Enter title

    layout:
      type: select.select
      label: Layout
      description: Customize the particle layout
      default: layout-left
      options:
        layout-left: Left
        layout-right: Right
        layout-top: Top
        layout-bottom: Bottom

    items:
      type: collection.list
      array: true
      label: Content Tabs Items
      description: Content Tabs item to display.
      value: title
      ajax: true

      fields:
        .thumb:
          type: input.imagepicker
          label: Thumb Image
          description: Select desired thumb.  
        .image:
          type: input.imagepicker
          label: Image
          description: Select desired image.
        .alt:
          type: input.text
          label: Image Alt
          description: Enter image alt.   
        .content:
          type: textarea.textarea
          label: Tab Content
          description: Customize the tab content.
          placeholder: Enter your custom content here.  
        .linklabel:
          type: input.text
          label: Read More Text
          description: Specify the read more text.
          placeholder: 'Read More'
        .link:
          type: input.text
          label: Read More Link
          description: Specify the Read More link address. 
        .buttontarget:
          type: select.selectize
          label: Target
          description: Target browser window when item is clicked.
          placeholder: 'Select...'
          default: _self
          options:
              _self: Self
              _blank: New Window
        .buttonclass:
          type: input.text
          label: Button Class
          description: Input the button class.
          default: 'button'          
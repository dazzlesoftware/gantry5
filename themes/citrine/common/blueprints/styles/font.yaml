name: Font Families
description: Font families for the Citrine theme
type: core

form:
  fields:

    family-default:
      type: input.fonts
      label: Body Font
      default: 'domine, sans-serif, Tahoma, Geneva, Arial'
    family-title:
      type: input.fonts
      label: Title Font
      default: 'quando, sans-serif, Tahoma, Geneva, Arial'
    family-promo:
      type: input.fonts
      label: Promo Font
      default: 'nexa'
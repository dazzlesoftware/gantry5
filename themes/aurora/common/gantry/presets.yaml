      background: '#ffffff'
      text-color: '#666666'
    above:
      background: '#ffffff'
      text-color: '#666666'
    feature:
      background: '#ffffff'
      text-color: '#666666'
    showcase:
      background: '#ffffff'
      text-color: '#666666'
    utility:
      background: '#ffffff'
      text-color: '#666666'
    main:
      background: '#ffffff'
      text-color: '#666666'
    expanded:
      background: '#ffffff'
      text-color: '#666666'
    extension:
      background: '#ffffff'
      text-color: '#666666'
    bottom:
      background: '#0d0d0d'
      text-color: '#ffffff'
    footer:
      background: '#eaf6f4'
      text-color: '#50818b'
    copyright:
      background: '#eaf6f4'
      text-color: '#50818b'
    offcanvas:
      background: '#ff4b64'
      text-color: '#ffffff'
      toggle-color: '#ffffff'
    breakpoints:
      large-desktop-container: 75rem
      desktop-container: 60rem
      tablet-container: 51rem
      large-mobile-container: 30rem
      mobile-menu-breakpoint: 51rem

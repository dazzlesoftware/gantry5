name: Slideshow Styles
description: Slideshow styles for the Aurora theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#0d0d0d"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "gantry-media://backgrounds/slideshow/img-01.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"

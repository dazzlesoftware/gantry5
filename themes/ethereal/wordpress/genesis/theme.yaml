admin:
  styles:
    core:
      - base
      - accent
      - font
    section:
      - top
      - header
      - slideshow
      - showcase
      - feature
      - main
      - extension
      - bottom
      - footer
      - copyright
      - offcanvas
    configuration:
      - breakpoints

chrome:
  genesis:
    before_widget: '<div id="%1$s" class="widget %2$s">'
    after_widget: '</div>'
    before_title: '<h3 class="widgettitle g-title">'
    after_title: '</h3>'

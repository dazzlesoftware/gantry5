name: Showcase Styles
description: Showcase styles for the Altairis theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#121212"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#888888"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/showcase/img-01.jpg"

name: FixedSide Styles
description: FixedSide styles for the Altairis theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#0d0d0d"  
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"
    width:
      type: input.text
      label: Panel Width
      description: Set FixedSide width size in rem, em, px, or percentage unit values
      default: "5rem"
      pattern: '\d+(\.\d+){0,1}(rem|em|ex|ch|vw|vh|vmin|vmax|%|px|cm|mm|in|pt|pc)'     
    position:
      type: select.selectize
      label: FixedSide Position
      description: Select the FixedSide position.
      default: g-fixedside-right
      options:
        g-fixedside-right: Right
        g-fixedside-left: Left

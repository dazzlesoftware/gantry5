name: Promo Content
description: Display promo content items.
type: particle
category: content
icon: fa-television

configuration:
  caching:
    type: static

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particles.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    title:
      type: input.text
      label: Title
      description: Customize the title text.
      placeholder: Enter title

    promostyle:
      type: select.select
      label: Promo Style
      description: Select the promo title style.
      placeholder: 'Select...'
      default: standard
      options:
        standard: Standard
        promo: Promo
        superpromo: Super Promo
        subpromo: Sub Promo

    subpromo:
      type: input.text
      label: Subpromo Text
      description: Customize the subpromo text.
      placeholder: Enter Subpromo Text

    promo:
      type: input.text
      label: Promo Text
      description: Customize the promo text.
      placeholder: Enter promo text

    desc:
      type: textarea.textarea
      label: Description
      description: Customize the description.
      placeholder: Enter short description

    readmore:
      type: input.text
      label: Readmore Text
      description: Specify the readmore text.
      placeholder: Enter readmore text

    readmoreclass:
      type: input.selectize
      label: Readmore Classes
      description: CSS class name for the readmore button.

    link:
      type: input.text
      label: Link
      description: Specify the readmore link address.

    linktarget:
      type: select.selectize
      label: Link Target
      description: Target browser window when item is clicked.
      placeholder: 'Select...'
      default: _self
      options:
          _self: Self
          _blank: New Window

    linkstyle:
      type: select.select
      label: Readmore Style
      description: Select the readmore style.
      placeholder: 'Select...'
      default: block
      options:
        block: Block
        inline: Inline
        aside: Aside

    tags:
      type: collection.list
      array: true
      label: Tags
      description: Create tags for your content.
      value: title
      ajax: true

      fields:
        .icon:
          type: input.icon
          label: Icon
        .text:
          type: input.text
          label: Text
        .link:
          type: input.text
          label: Link
        .taglinktarget:
          type: select.selectize
          label: Link Target
          description: Target browser window when item is clicked.
          placeholder: 'Select...'
          default: _self
          options:
              _self: Self
              _blank: New Window

    altLinkText:
      type: input.text
      label: Alt Button Label
      description: Specify the alt button label.

    altLink:
      type: input.text
      label: Alt Button Link
      description: Specify the button link.

    altLinkTarget:
      type: select.selectize
      label: Alt Button Target
      description: Target browser window when item is clicked.
      placeholder: 'Select...'
      default: _self
      options:
          _self: Self
          _blank: New Window

    altLinkClass:
      type: input.selectize
      label: Alt Button Classes
      description: CSS class names for the alt button.

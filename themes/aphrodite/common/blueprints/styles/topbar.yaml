name: Top Bar Styles
description: Colors for the compact bar above navigation.
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: '#111111'
    text-color:
      type: input.colorpicker
      label: Text
      default: '#666666'
    hover-color:
      type: input.colorpicker
      label: Link Hover
      default: '#ff406c'

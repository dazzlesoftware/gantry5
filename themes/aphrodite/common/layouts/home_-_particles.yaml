content:
  aphroditehero-1001:
    title: 'Aphrodite Hero'
    attributes:
      eyebrow: 'Bootstrap 5 + Gantry 5'
      title: 'Create without limits'
      text: 'Aphrodite combines a modern Bootstrap frontend with Gantry’s flexible layout and content tools.'
      primary_label: 'Discover Aphrodite'
      primary_link: '#g-features'
      secondary_label: 'View Content'
      secondary_link: '#g-mainbar'
  aphroditefeatures-1002:
    title: 'Aphrodite Features'
    attributes:
      title: 'A modern foundation for every platform'
      intro: 'Purpose-built components with responsive Bootstrap behavior and Gantry configuration.'
      items:
        -
          icon: 'fab fa-bootstrap'
          title: 'Bootstrap Native'
          text: 'Utilities, components, responsive columns and the Bootstrap JavaScript bundle are available throughout the theme.'
        -
          icon: 'fas fa-layer-group'
          title: 'Gantry Flexible'
          text: 'Build outlines and arrange particles visually while Aphrodite controls the frontend presentation.'
        -
          icon: 'fas fa-mobile-alt'
          title: 'Responsive First'
          text: 'Navigation, hero content, cards and publishing views adapt cleanly from phones to large displays.'

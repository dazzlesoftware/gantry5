name: Bootstrap Test Suite
description: Visual test page for Bootstrap 5 components and utilities.
type: particle
icon: fab fa-bootstrap

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      default: true
    title:
      type: input.text
      label: Page Title
      default: Bootstrap 5 Test Suite
    intro:
      type: textarea.textarea
      label: Introduction
      default: Use this page to verify Aphrodite's Bootstrap components, JavaScript, spacing, colors, and responsive behavior.

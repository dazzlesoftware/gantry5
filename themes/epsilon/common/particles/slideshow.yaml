name: Slideshow
description: Display Slideshow.
type: particle
icon: fa-sliders

configuration:
  caching:
    type: static

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    animateIn:
      type: select.select
      label: In Animation
      description: Customize the In Animation from animate css class.
      default: fadeIn
      options:
        default: default
        bounce: bounce
        flash: flash
        pulse: pulse
        rubberBand: rubberBand
        shake: shake
        swing: swing
        tada: tada
        wobble: wobble
        jello: jello
        bounceIn: bounceIn
        bounceInDown: bounceInDown
        bounceInLeft: bounceInLeft
        bounceInRight: bounceInRight
        bounceInUp: bounceInUp
        bounceOut: bounceOut
        bounceOutDown: bounceOutDown
        bounceOutLeft: bounceOutLeft
        bounceOutRight: bounceOutRight
        bounceOutUp: bounceOutUp
        fadeIn: fadeIn
        fadeInDown: fadeInDown
        fadeInDownBig: fadeInDownBig
        fadeInLeft: fadeInLeft
        fadeInLeftBig: fadeInLeftBig
        fadeInRight: fadeInRight
        fadeInRightBig: fadeInRightBig
        fadeInUp: fadeInUp
        fadeInUpBig: fadeInUpBig
        fadeOut: fadeOut
        fadeOutDown: fadeOutDown
        fadeOutDownBig: fadeOutDownBig
        fadeOutLeft: fadeOutLeft
        fadeOutLeftBig: fadeOutLeftBig
        fadeOutRight: fadeOutRight
        fadeOutRightBig: fadeOutRightBig
        fadeOutUp: fadeOutUp
        fadeOutUpBig: fadeOutUpBig
        flip: flip
        flipInX: flipInX
        flipInY: flipInY
        flipOutX: flipOutX
        flipOutY: flipOutY
        lightSpeedIn: lightSpeedIn
        lightSpeedOut: lightSpeedOut
        rotateIn: rotateIn
        rotateInDownLeft: rotateInDownLeft
        rotateInDownRight: rotateInDownRight
        rotateInUpLeft: rotateInUpLeft
        rotateInUpRight: rotateInUpRight
        rotateOut: rotateOut
        rotateOutDownLeft: rotateOutDownLeft
        rotateOutDownRight: rotateOutDownRight
        rotateOutUpLeft: rotateOutUpLeft
        rotateOutUpRight: rotateOutUpRight
        slideInUp: slideInUp
        slideInDown: slideInDown
        slideInLeft: slideInLeft
        slideInRight: slideInRight
        slideOutUp: slideOutUp
        slideOutDown: slideOutDown
        slideOutLeft: slideOutLeft
        slideOutRight: slideOutRight
        zoomIn: zoomIn
        zoomInDown: zoomInDown
        zoomInLeft: zoomInLeft
        zoomInRight: zoomInRight
        zoomInUp: zoomInUp
        zoomOut: zoomOut
        zoomOutDown: zoomOutDown
        zoomOutLeft: zoomOutLeft
        zoomOutRight: zoomOutRight
        zoomOutUp: zoomOutUp
        hinge: hinge
        rollIn: rollIn
        rollOut: rollOut

    animateOut:
      type: select.select
      label: Out Animation
      description: Customize the Out Animation from animate css class.
      default: fadeOut
      options:
        default: default
        bounce: bounce
        flash: flash
        pulse: pulse
        rubberBand: rubberBand
        shake: shake
        swing: swing
        tada: tada
        wobble: wobble
        jello: jello
        bounceIn: bounceIn
        bounceInDown: bounceInDown
        bounceInLeft: bounceInLeft
        bounceInRight: bounceInRight
        bounceInUp: bounceInUp
        bounceOut: bounceOut
        bounceOutDown: bounceOutDown
        bounceOutLeft: bounceOutLeft
        bounceOutRight: bounceOutRight
        bounceOutUp: bounceOutUp
        fadeIn: fadeIn
        fadeInDown: fadeInDown
        fadeInDownBig: fadeInDownBig
        fadeInLeft: fadeInLeft
        fadeInLeftBig: fadeInLeftBig
        fadeInRight: fadeInRight
        fadeInRightBig: fadeInRightBig
        fadeInUp: fadeInUp
        fadeInUpBig: fadeInUpBig
        fadeOut: fadeOut
        fadeOutDown: fadeOutDown
        fadeOutDownBig: fadeOutDownBig
        fadeOutLeft: fadeOutLeft
        fadeOutLeftBig: fadeOutLeftBig
        fadeOutRight: fadeOutRight
        fadeOutRightBig: fadeOutRightBig
        fadeOutUp: fadeOutUp
        fadeOutUpBig: fadeOutUpBig
        flip: flip
        flipInX: flipInX
        flipInY: flipInY
        flipOutX: flipOutX
        flipOutY: flipOutY
        lightSpeedIn: lightSpeedIn
        lightSpeedOut: lightSpeedOut
        rotateIn: rotateIn
        rotateInDownLeft: rotateInDownLeft
        rotateInDownRight: rotateInDownRight
        rotateInUpLeft: rotateInUpLeft
        rotateInUpRight: rotateInUpRight
        rotateOut: rotateOut
        rotateOutDownLeft: rotateOutDownLeft
        rotateOutDownRight: rotateOutDownRight
        rotateOutUpLeft: rotateOutUpLeft
        rotateOutUpRight: rotateOutUpRight
        slideInUp: slideInUp
        slideInDown: slideInDown
        slideInLeft: slideInLeft
        slideInRight: slideInRight
        slideOutUp: slideOutUp
        slideOutDown: slideOutDown
        slideOutLeft: slideOutLeft
        slideOutRight: slideOutRight
        zoomIn: zoomIn
        zoomInDown: zoomInDown
        zoomInLeft: zoomInLeft
        zoomInRight: zoomInRight
        zoomInUp: zoomInUp
        zoomOut: zoomOut
        zoomOutDown: zoomOutDown
        zoomOutLeft: zoomOutLeft
        zoomOutRight: zoomOutRight
        zoomOutUp: zoomOutUp
        hinge: hinge
        rollIn: rollIn
        rollOut: rollOut

    contentanimation:
      type: select.select
      label: Content Animation
      description: Customize the Content Animation from animate css class.
      default: none
      options:
        none: none
        rubberBand: rubberBand
        shake: shake
        swing: swing
        tada: tada
        wobble: wobble
        jello: jello
        bounceIn: bounceIn
        bounceInDown: bounceInDown
        bounceInLeft: bounceInLeft
        bounceInRight: bounceInRight
        bounceInUp: bounceInUp
        fadeIn: fadeIn
        fadeInDown: fadeInDown
        fadeInDownBig: fadeInDownBig
        fadeInLeft: fadeInLeft
        fadeInLeftBig: fadeInLeftBig
        fadeInRight: fadeInRight
        fadeInRightBig: fadeInRightBig
        fadeInUp: fadeInUp
        fadeInUpBig: fadeInUpBig
        flip: flip
        flipInX: flipInX
        flipInY: flipInY
        lightSpeedIn: lightSpeedIn
        rotateIn: rotateIn
        rotateInDownLeft: rotateInDownLeft
        rotateInDownRight: rotateInDownRight
        rotateInUpLeft: rotateInUpLeft
        rotateInUpRight: rotateInUpRight
        slideInUp: slideInUp
        slideInDown: slideInDown
        slideInLeft: slideInLeft
        slideInRight: slideInRight
        zoomIn: zoomIn
        zoomInDown: zoomInDown
        zoomInLeft: zoomInLeft
        zoomInRight: zoomInRight
        rollIn: rollIn

    nav:
      type: select.select
      label: Prev / Next
      description: Enable or disable the Prev / Next navigation.
      default: enabled
      options:
        enabled: Enabled
        disabled: Disabled

    dots:
      type: select.select
      label: Dots
      description: Enable or disable the Dots navigation.
      default: enabled
      options:
        enabled: Enabled
        disabled: Disabled

    loop:
      type: select.select
      label: Loop
      description: Enable or disable the Inifnity loop. Duplicate last and first items to get loop illusion.
      default: enabled
      options:
        enabled: Enabled
        disabled: Disabled

    autoplay:
      type: select.select
      label: Autoplay
      description: Enable or disable the Autoplay.
      default: disabled
      options:
        enabled: Enabled
        disabled: Disabled

    autoplaySpeed:
      type: input.text
      label: Autoplay Speed
      description: Set the speed of the Autoplay, in milliseconds.
      placeholder: 5000

    pauseOnHover:
      type: select.select
      label: Pause on Hover
      description: Pause the slideshow when hovering over it, then resume when no longer hovering.
      default: enabled
      options:
        enabled: Enabled
        disabled: Disabled    

    items:
      type: collection.list
      array: true
      label: Slider Items
      description: Create each slideshow item to display.
      value: name
      ajax: true

      fields:
        .bgimage:
          type: input.imagepicker
          label: Background Image
          description: Select desired background image. 
        .image:
          type: input.imagepicker
          label: Content Image
          description: Select desired content image.
        .imageclass:
          type: input.selectize
          label: Image Class
          description: CSS class for content image.   
        .position:
          type: select.select
          label: Position
          description: Position of image.
          default: right
          options:
            right: Right
            left: Left
            top: Top
            bottom: Bottom
        .textalign:
          type: select.select
          label: Text Align
          description: Alignment of text.
          default: left
          options:
            left: Left
            right: Right
            center: Center
        .title:
          type: input.text
          label: Title
          description: Enter the title
        .desc:
          type: textarea.textarea
          label: Description
          description: Customize the description.
          placeholder: Enter short description                             
        .linktitle:
          type: select.select
          label: Link Title
          description: Enable or disable linked title.
          default: disabled
          options:
            enabled: Enabled
            disabled: Disabled
        .link:
          type: input.text
          label: Link
          description: Input the item link.
        .linktext:
          type: input.text
          label: Link Text
          description: Input the text for the item link.
          placeholder: 'Read More'
        .buttontarget:
          type: select.selectize
          label: Target
          description: Target browser window when item is clicked.
          placeholder: 'Select...'
          default: _self
          options:
              _self: Self
              _blank: New Window
        .buttonclass:
          type: input.text
          label: Button Class
          description: Input the button class.
          default: 'button'

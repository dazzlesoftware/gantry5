          title: ''
          desc: "<span class=\"rt-testimonial-item\">\t<span class=\"icon-quote-left\"></span> A custom Joomla installation package that installs a near equivalent of the demo onto your server. <span class=\"icon-quote-right\"></span>\t<span class=\"rt-arrow-bottom\"></span></span><span class=\"rt-testimonial-img\">\t<svg class=\"rt-hexagon-svg\" width=\"150px\" height=\"150px\" viewBox = \"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" version=\"1.1\">\t    <g>\t       <clipPath id=\"rt-hexagon-mask-2\">\t          <polygon points=\"99.9999999999999,196 16.8615612366939,148 16.8615612366939,52 100,4 183.138438763306,52 183.138438763306,148\" />\t       </clipPath>\t    </g> \t    <a xlink:href=\"#\">\t     <image clip-path=\"url(#rt-hexagon-mask-2)\" height=\"100%\" width=\"100%\" xlink:href=\"templates/genesis_epsilon/images/home/expandedbottom/img1.jpg\" />\t    </a>\t</svg> </span><span class=\"rt-testimonial-author\">Daniel Lee</span><span class=\"rt-testimonial-position\">CEO of Praxis</span>"
          link: ''
          linklabel: ''
          target: _self
          buttonclass: readon
          name: 'Item 2'
        -
          image: ''
          title: ''
          desc: "<span class=\"rt-testimonial-item\">\t<span class=\"icon-quote-left\"></span>   Choose from six preset<span class=\"hidden-tablet\"> style variation</span>s, with configurable options for text, link, accent, and background<span class=\"hidden-tablet\"> color</span>s. <span class=\"icon-quote-right\"></span>\t<span class=\"rt-arrow-bottom\"></span></span><span class=\"rt-testimonial-img\">\t<svg class=\"rt-hexagon-svg\" width=\"150px\" height=\"150px\" viewBox = \"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" version=\"1.1\">\t    <g>\t       <clipPath id=\"rt-hexagon-mask-3\">\t          <polygon points=\"99.9999999999999,196 16.8615612366939,148 16.8615612366939,52 100,4 183.138438763306,52 183.138438763306,148\" />\t       </clipPath>\t    </g> \t    <a xlink:href=\"#\">\t     <image clip-path=\"url(#rt-hexagon-mask-3)\" height=\"100%\" width=\"100%\" xlink:href=\"templates/genesis_epsilon/images/home/expandedbottom/img1.jpg\" />\t    </a>\t</svg> </span><span class=\"rt-testimonial-author\">Troy Michie</span><span class=\"rt-testimonial-position\">CEO of Stratos</span>"
          link: ''
          linklabel: ''
          target: _self
          buttonclass: readon
          name: 'Item 3'
        -
          image: ''
          title: ''
          desc: "<span class=\"rt-testimonial-item\">\t<span class=\"icon-quote-left\"></span>  There are eight stylistic suffixes, to provide individual<span class=\"hidden-tablet\"> module</span> styling, as well as <span class=\"hidden-tablet\">several </span>structural suffixes. <span class=\"icon-quote-right\"></span>\t<span class=\"rt-arrow-bottom\"></span></span><span class=\"rt-testimonial-img\">\t<svg class=\"rt-hexagon-svg\" width=\"150px\" height=\"150px\" viewBox = \"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" version=\"1.1\">\t    <g>\t       <clipPath id=\"rt-hexagon-mask-4\">\t          <polygon points=\"99.9999999999999,196 16.8615612366939,148 16.8615612366939,52 100,4 183.138438763306,52 183.138438763306,148\" />\t       </clipPath>\t    </g> \t    <a xlink:href=\"#\">\t     <image clip-path=\"url(#rt-hexagon-mask-4)\" height=\"100%\" width=\"100%\" xlink:href=\"templates/genesis_epsilon/images/home/expandedbottom/img1.jpg\" />\t    </a>\t</svg> </span><span class=\"rt-testimonial-author\">Levi Durey</span><span class=\"rt-testimonial-position\">CEO of Hadron</span>"
          link: ''

content:
  slideshow-8821:
    attributes:
      class: hexagon
      animateIn: fadeIn
      animateOut: fadeOut
      contentanimation: flipInX
      nav: disabled
      dots: enabled
      loop: enabled
      autoplay: disabled
      autoplaySpeed: ''
      pauseOnHover: enabled
      items:
        -
          bgimage: 'genesis-media://home/showcase/bg1.png'
          image: 'genesis-media://home/showcase/img1.png'
          contentanimation: flipInX
          imageclass: ''
          position: right
          textalign: left
          title: 'A Modern Approach to Design.'
          desc: 'Epsilon is a modern, sectioned based design, with a diverse infusion of background textures and patterns. These enrich and differentiate your site whilst maintaining an overall conservative approach, for flexible site application.'
          linktitle: disabled
          link: '#'
          linktext: 'Read More'
          buttontarget: _self
          buttonclass: readon
          name: 'Item 1'
        -
          bgimage: 'genesis-media://home/showcase/bg2.png'
          image: 'genesis-media://home/showcase/img2.png'
          imageclass: ''
          position: left
          textalign: right
          title: 'Background Slideshow'
          desc: 'Epsilon provides for full width, custom, transitional background images, in the slideshow position, a full width container, specifically designed for the Slideshow particle. It also has separate options for per panel background and content images.'
          linktitle: disabled
          link: '#'
          linktext: 'Read More'
          buttontarget: _self
          buttonclass: readon
          name: 'Item 2'
        -
          bgimage: 'genesis-media://home/showcase/bg3.png'
          image: 'genesis-media://home/showcase/img3.png'
          imageclass: center
          position: bottom
          textalign: center
          title: 'Custom Animation'
          desc: 'Animation provides an extended layout of visual flair as well as smooth interaction for your visitors, to facilitate the seamless experience of using your site. Our Slideshow particle benefits from a custom array of up to 16 animation types.'
          linktitle: disabled
          link: '#'
          linktext: 'Read More'
          buttontarget: _self
          buttonclass: readon
          name: 'Item 3'
    block:
      variations: 'nomarginall nopaddingall'
  custom-8262:
    title: 'Custom HTML'
    attributes:
      title: ''
      titletag: ''
      html: "<div class=\"fp-content-tabs-header\">\_</div>"
      twig: '0'
      filter: '0'
  contenttabs-4244:
    title: 'Content Tabs'
    attributes:
      minheight: 600px
      animation: right
      items:
        -
          content: "<div class=\"rt-center\">\t\n<div class=\"rt-width-80\">\t\t<h2>Particles Integration</h2>\t\t<p>Particles are powerful content block that provide for flexible content display through its assortment of pre-built layout types, which are easy to modify, as well as a custom, intuitive administrative console.</p>\t</div></div>"
          cols: '25'
          icons:
            -
              icon: 'fa fa-th-large'
              link: '#'
              linktarget: _self
              title: Slideshow
              subtext: 'A showcase or slideshow layout mode for displaying image and/or text based content.'
              name: 'Item 1'
            -
              icon: 'fa fa-globe'
              link: '#'
              linktarget: _self
              title: 'Strips Slider'
              subtext: 'A horizontal centric grid based content rotator, for the display of multiple image/text content blocks.'
              name: 'Item 2'
            -
              icon: 'fa fa-briefcase'
              link: '#'
              linktarget: _self
              title: 'Content Tabs'
              subtext: 'Custom content items in a tabbed format, whether top, bottom, left or right, for flexible content display.'
              name: 'Item 3'
            -
              icon: 'fa fa-crop'
              link: '#'
              linktarget: _self
              title: Mosaic
              subtext: 'A dynamic content grid layout type, to display sortable and animated image and/or text content blocks.'
              name: 'Item 4'
          title: 'Particles <span class="hidden-tablet"> Integration</span>'
        -
          content: "<div class=\"rt-center\">\t\n<div class=\"rt-width-80\">\t\t\n<h2>Multiple Menu Options</h2>\t\t\n<p>Navigation is a fundamental pillar of any website as well as the template, and Epsilon offers several configurable options to best suit your navigational preferences, for both desktop and mobile device types.</p>\t\n</div></div>"
          cols: '25'
          icons:
            -
              icon: 'fa fa-sitemap'
              link: '#'
              linktarget: _self
              title: Dropdown
              subtext: 'CSS based menu system with multiple columns and other advanced per menu items options.'
              name: 'Item 1'
            -
              icon: 'fa fa-level-down'
              link: '#'
              linktarget: _self
              title: SplitMenu
              subtext: 'A static menu that displays parent items in the header and child items in the sidebar, as configurable.'
              name: 'Item 2'
            -
              icon: 'fa fa-th-list'
              link: '#'
              linktarget: _self
              title: Panel
              subtext: 'A mobile responsive menu that displays all items in a column structure, slidable from the side via a toggle.'
              name: 'Item 3'
            -
              icon: 'fa fa-mobile-phone'
              link: '#'
              linktarget: _self
              title: Extended
              subtext: 'Extended menu provides options for menu items columns along and additional child elements.'
              name: 'Item 4'
          title: '<span class="hidden-tablet">Multiple </span>Menu Systems'
        -
          content: "<div class=\"rt-center\">\t\n<div class=\"rt-width-80\">\t\t<h2>Free GPL Template Framework</h2>\t\t\n<p>Genesis is a powerful core framework, that sits at the heart of Epsilon, providing the foundation for the major, standarized features and functions, such as the rich and intuitive, custom template manager interface.</p>\t\n</div></div>"
          cols: '25'
          icons:
            -
              icon: 'fa fa-th'
              link: '#'
              linktarget: _self
              title: Grids
              subtext: 'Genesis allows for module positions to be split into configuration grids on a per menu item basis.'
              name: 'Item 1'
            -
              icon: 'fa fa-cut'
              link: '#'
              linktarget: _self
              title: 'SCSS CSS'
              subtext: 'The SCSS compiler is built into Genesis, an extended CSS language that allows for easier development.'
              name: 'Item 2'
            -
              icon: 'fa fa-link'
              link: '#'
              linktarget: _self
              title: Outlines
              subtext: 'Custom module layouts and positions, as well as per-page template outlines are available.'
              name: 'Item 3'
            -
              icon: 'fa fa-save'
              link: '#'
              linktarget: _self
              title: Options
              subtext: 'A custom administrative interface in the template manager allows for swift configuration.'
              name: 'Item 4'
          title: 'Genesis Framework'
        -
          content: "<div class=\"rt-center\">\t\n<div class=\"rt-width-80\">\t\t<h2>Diverse Element Styling</h2>\t\t<p>The template has a rich assortment of styled elements, ranging from custom typography to configurable preset style variations, and a flexible selection of stylistic and structural module class suffixes.</p>\t</div></div>"
          cols: '25'
          icons:
            -
              icon: 'fa fa-tasks'
              link: '#'
              linktarget: _self
              title: Presets
              subtext: 'A selection of six, diverse preset style variations, with numerous available customization options.'
              name: 'Item 1'
            -
              icon: 'fa fa-cogs'
              link: '#'
              linktarget: _self
              title: 'Module Style'
              subtext: 'Choose from eight compoundable module class suffixes to adjust title and/or full module styling.'
              name: 'Item 2'
            -
              icon: 'fa fa-edit'
              link: '#'
              linktarget: _self
              title: 'Module Layout'
              subtext: 'An array of structural suffixes are available to individually adjust padding, margins and font formats.'
              name: 'Item 3'
            -
              icon: 'fa fa-font'
              link: '#'
              linktarget: _self
              title: Typography
              subtext: 'A diverse inventory of typography from Bootstrap as well as FontAwesome, to enrich content.'
              name: 'Item 4'
          title: '<span class="hidden-tablet">Styling and </span>Typography'

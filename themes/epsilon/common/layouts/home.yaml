          desc: "<span class=\"rt-testimonial-item\">\t<span class=\"icon-quote-left\"></span>  A beautiful and rich selection of typography, based on Bootstrap, to emphasise <span class=\"hidden-tablet\">and embellish </span>content. <span class=\"icon-quote-right\"></span>\t<span class=\"rt-arrow-bottom\"></span></span><span class=\"rt-testimonial-img\">\t<svg class=\"rt-hexagon-svg\" width=\"150px\" height=\"150px\" viewBox = \"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" version=\"1.1\">\t    <g>\t       <clipPath id=\"rt-hexagon-mask-1\">\t          <polygon points=\"99.9999999999999,196 16.8615612366939,148 16.8615612366939,52 100,4 183.138438763306,52 183.138438763306,148\" />\t       </clipPath>\t    </g> \t    <a xlink:href=\"#\">\t     <image clip-path=\"url(#rt-hexagon-mask-1)\" height=\"100%\" width=\"100%\" xlink:href=\"templates/genesis_epsilon/images/home/expandedbottom/img1.jpg\" />\t    </a>\t</svg> </span><span class=\"rt-testimonial-author\">Leo Parry</span><span class=\"rt-testimonial-position\">CEO of Hexeris</span>"
          link: ''
          linklabel: ''
          target: _self
          buttonclass: readon
          name: 'Item 1'
        -

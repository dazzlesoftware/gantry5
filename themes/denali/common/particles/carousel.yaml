name: Carousel
description: Display images in a carousel form.
type: particle
category: slider
icon: fa-window-close

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true

    _tabs:
      type: container.tabs
      fields:
        _tab_settings:
          label: Settings
          overridable: false
          fields:
            source:
              type: select.select
              label: Content Source
              description: Choose if the content should be loaded from the Joomla articles or particle itself.
              default: particle
              options:
                particle: Particle
                joomla: Joomla

            demo:
              type: select.select
              label: Demo Mode
              description: Enable or disable demo mode. If enabled preset number will be synced with set number. 
              default: disabled
              options:
                enabled: Enable
                disabled: Disable

            class:
              type: input.selectize
              label: CSS Classes
              description: CSS class name for the particle.

            title:
              type: input.text
              label: Title
              description: Customize the title text.
              placeholder: Enter title

            nav:
              type: select.select
              label: Prev / Next
              description: Enable or disable the Prev / Next navigation.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable

            loop:
              type: select.select
              label: Loop
              description: Enable or disable the Inifnity loop. Duplicate last and first items to get loop illusion. This option <strong>won't work</strong> in Showcase mode.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable

            autoplay:
              type: select.select
              label: Autoplay
              description: Enable or disable the Autoplay.
              default: disabled
              options:
                enabled: Enable
                disabled: Disable

            autoplaySpeed:
              type: input.text
              label: Autoplay Speed
              description: Set the speed of the Autoplay, in milliseconds.
              placeholder: 5000

            pauseOnHover:
              type: select.select
              label: Pause on Hover
              description: Pause the slideshow when hovering over slider, then resume when no longer hovering.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable

            center:
              type: select.select
              label: Center
              description: Center the main item.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable
                
        _tab_collection:
          label: Particle Items
          overridable: false
          fields:
            items:
              type: collection.list
              array: true
              label: Items
              description: Carousel items.
              value: name
              ajax: true

              fields:
                .image:
                  type: input.imagepicker
                  label: Image
                  description: Select desired image.
                .alt:
                  type: input.text
                  label: Image Alt
                  description: Customize the alt attribute.
                  placeholder: Enter alt attribute
                .title:
                  type: input.text
                  label: Title
                  description: Customize the image title.
                  placeholder: Enter title
                .caption:
                  type: textarea.textarea
                  label: Caption
                  description: Customize the image caption.
                  placeholder: Enter caption text.
                .linkto:
                  type: select.select
                  label: Link To
                  description: Choose to display image or open a custom link.
                  default: image
                  options:
                    image: Lightcase Image
                    link: Link
                .link:
                  type: input.text
                  label: Link
        _tab_articles:
          label: Articles
          overridable: false
          fields:
            article.filter.categories:
              type: joomla.categories
              label: Categories
              description: Select the categories the articles should be taken from.
              overridable: false

            article.filter.articles:
              type: input.text
              label: Articles
              description: Enter the Joomla articles that should be shown. It should be a list of article IDs separated with a comma (i.e. 1,2,3,4,5).
              overridable: false

            article.filter.featured:
              type: select.select
              label: Featured Articles
              description: Select how Featured articles should be filtered.
              default: ''
              options:
                include: Include Featured
                exclude: Exclude Featured
                only: Only Featured
              overridable: false

            article.limit.total:
              type: input.text
              label: Number of Articles
              description: Enter the maximum number of articles to display.
              default: 5
              pattern: '\d{1,2}'
              overridable: false

            article.limit.start:
              type: input.text
              label: Start From
              description: Enter offset specifying the first article to return. The default is '0' (the first article).
              default: 0
              pattern: '\d{1,2}'
              overridable: false

            article.sort.orderby:
              type: select.select
              label: Order By
              description: Select how the articles should be ordered by.
              default: publish_up
              options:
                publish_up: Published Date
                created: Created Date
                modified: Last Modified Date
                title: Title
                ordering: Ordering
                hits: Hits
                id: ID
                alias: Alias
              overridable: false

            article.sort.ordering:
              type: select.select
              label: Ordering Direction
              description: Select the direction the articles should be ordered by.
              default: ASC
              options:
                ASC: Ascending
                DESC: Descending
              overridable: false

            article.linkto:
                type: select.select
                label: Link To
                description: Choose to display image or open a custom link.
                default: image
                options:
                  image: Lightcase Image
                  link: Link
        _tab_display:
          label: Articles Display
          overridable: false
          fields:
            article.display.image.enabled:
              type: select.select
              label: Image
              description: Select if and what image of the article should be shown.
              options:
                intro: Intro
                full: Full
                '': None

            article.display.title.enabled:
              type: select.select
              label: Title
              description: Select if the article title should be shown.
              options:
                show: Show
                '': Hide

            article.display.title.limit:
              type: input.text
              label: Title Limit
              description: Enter the maximum number of characters the article title should be limited to.
              pattern: '\d+(\.\d+){0,1}'
name: Font Families
description: Font families for the Aetheria theme
type: core

form:
  fields:

    family-default:
      type: input.fonts
      label: Body Font
      default: 'asap, Helvetica, Tahoma, Geneva, Arial, sans-serif'
    family-title:
      type: input.fonts
      label: Title Font
      default: 'poly, Helvetica, Tahoma, Geneva, Arial, sans-serif'
    family-promo:
      type: input.fonts
      label: Promo Font
      default: 'aguafinascript, Helvetica, Tahoma, Geneva, Arial, sans-serif'
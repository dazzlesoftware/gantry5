details:
  name: Verbatim
  version: '@version@'
  icon: paper-plane
  date: '@versiondate@'
  author:
    name: Dazzle Software, LLC
    email: support@dazzlesoftware.org
    link: https://dazzlesoftware.org

  documentation:
    link: https://codex.dazzlecms.org

  support:
    link: https://gitter.im/genesis/genesis

  updates:
    link: http://updates.rockettheme.com/themes/verbatim.yaml

  copyright: Copyright (C) 2026 Dazzle Software, LLC
  license: GPLv3 and later
  description: Verbatim Theme
  images:
    thumbnail: screenshot.png
    preview: screenshot.png

configuration:
  genesis:
    platform: wordpress
    engine: nucleus

  theme:
    parent: wp_verbatim
    base: genesis-theme://common
    file: 'genesis-theme://includes/theme.php'
    class: '\Genesis\Framework\Theme'
    textdomain: genesis_verbatim

  fonts:
    merriweather:
      400: 'genesis-theme://fonts/merriweather/merriweather-regular-webfont'
      700: 'genesis-theme://fonts/merriweather/merriweather-bold-webfont'
    merriweather-italic:
      400: 'genesis-theme://fonts/merriweather-italic/merriweather-italic-webfont'
      700: 'genesis-theme://fonts/merriweather-italic/merriweather-bolditalic-webfont'

  css:
    compiler: \Genesis\Component\Stylesheet\ScssCompiler
    target: genesis-theme://css-compiled
    paths:
      - genesis-theme://scss
      - genesis-engine://scss
    files:
      - verbatim
      - verbatim-wordpress
      - custom
    persistent:
      - verbatim
    overrides:
      - verbatim-wordpress
      - custom

  section-variations: 
    Padding Variations:
      section-vertical-paddings: Section Vertical Paddings
      section-horizontal-paddings: Section Horizontal Paddings
      section-vertical-paddings-large: Large Vertical Paddings

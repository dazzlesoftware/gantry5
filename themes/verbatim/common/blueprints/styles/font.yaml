name: Font Families
description: Font families for the Verbatim theme
type: core

form:
  fields:

    family-default:
      type: input.fonts
      label: Default Font
      default: 'merriweather, Verdana, Helvetica, Arial, sans-serif'
    family-italic:
      type: input.fonts
      label: Italic Font
      default: 'merriweather-italic, Verdana, Helvetica, Arial, sans-serif'
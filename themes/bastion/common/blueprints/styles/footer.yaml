name: Footer Styles
description: Footer styles for the Bastion theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#111111"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/footer/img-01.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"

details:
  name: Hydrogen
  version: '@version@'
  icon: paper-plane
  date: '@versiondate@'
  author:
    name: Dazzle Software, LLC
    email: support@dazzlesoftware.org
    link: https://dazzlesoftware.org

  documentation:
    link: https://codex.dazzlecms.org

  support:
    link: https://gitter.im/genesis/genesis

  updates:
    link: http://updates.rockettheme.com/themes/hydrogen.yaml

  copyright: Copyright (C) 2026 Dazzle Software, LLC
  license: GPLv3 and later
  description: Hydrogen Theme
  images:
    thumbnail: admin/images/preset1.png
    preview: admin/images/preset1.png

configuration:
  genesis:
    platform: wordpress
    engine: nucleus

  theme:
    parent: hydrogen
    base: genesis-theme://common
    file: genesis-theme://includes/theme.php
    class: \Genesis\Framework\Theme
    textdomain: genesis_hydrogen

  fonts:
    roboto:
      400: 'genesis-theme://fonts/roboto_regular_macroman/Roboto-Regular-webfont'
      500: 'genesis-theme://fonts/roboto_medium_macroman/Roboto-Medium-webfont'
      700: 'genesis-theme://fonts/roboto_bold_macroman/Roboto-Bold-webfont'

  css:
    compiler: \Genesis\Component\Stylesheet\ScssCompiler
    paths:
      - genesis-theme://scss
      - genesis-engine://scss
    files:
      - hydrogen
      - hydrogen-wordpress
      - custom
    persistent:
      - hydrogen
    overrides:
      - hydrogen-wordpress
      - custom

  dependencies:
    genesis: '@genesis_version@'

  block-variations:
    Box Variations:
      box1: Box 1
      box2: Box 2
      box3: Box 3
      box4: Box 4
    Effects:
      shadow: Shadow 1
      shadow2: Shadow 2
      rounded: Rounded
      square: Square
    Utility:
      disabled: Disabled
      align-right: Align Right
      align-left: Align Left
      center: Center
      full-width: Full Width
      equal-height: Equal Height
      nomarginall: No Margin
      nopaddingall: No Padding

chrome:
  genesis:
    before_widget: <div id="%1$s" class="widget %2$s">
    after_widget: </div>
    before_title: <h2 class="widgettitle">
    after_title: </h2>

admin:
  styles:
    section:
      - header
      - showcase
      - subfeature
    core:
      - base
  content:
    general:
      - wpautop
    blog:
      - content
      - heading
      - featured-image
      - title
      - meta-date
      - meta-author
      - meta-comments
      - meta-categories
      - meta-tags
      - read-more
    single:
      - featured-image
      - title
      - meta-date
      - meta-author
      - meta-comments
      - meta-categories
      - meta-tags
    page:
      - featured-image
      - title
      - meta-date
      - meta-author
    archive:
      - content
      - heading
      - featured-image
      - title
      - meta-date
      - meta-author
      - meta-comments
      - meta-categories
      - meta-tags
      - read-more

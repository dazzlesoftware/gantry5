  custom-8473:
    title: 'Sample Sitemap'
    attributes:
      html: "<h2 class=\"g-title\">Sample Sitemap</h2>\n\n<div class=\"row g-grid\">\n\t<div class=\"col g-block\">\n\t\t<ul class=\"nomarginall noliststyle\">\n\t\t\t<li><a href=\"index.php\">Home</a></li>\n\t\t\t<li><a href=\"index.php?option=com_content&view=article&id=1&Itemid=105\">Features</a></li>\n\t\t\t<li><a href=\"index.php?option=com_content&view=article&id=2&Itemid=106\">Typography</a></li>\n\t\t\t<li><a href=\"index.php?option=com_content&view=article&id=2&Itemid=106\">Particles</a></li>\n\t\t\t<li><a href=\"index.php?option=com_content&view=article&id=3&Itemid=107\">Variations</a></li>\n\t\t</ul>\n\t</div>\n\t<div class=\"col g-block\">\n\t\t<ul class=\"nomarginall noliststyle\">\n\t\t\t<li><a href=\"index.php?option=com_content&view=article&id=2&Itemid=106\">Buttons</a></li>\n\t\t\t<li><a href=\"index.php?option=com_content&view=article&id=4&Itemid=111\">Pages</a></li>\n\t\t\t<li><a href=\"https://dazzlesoftware.org/docs/joomla/templates/nectarion\">Guide</a></li>\n\t\t\t<li><a href=\"https://dazzlesoftware.org/forum/joomla-template-nectarion\">Support</a></li>\n\t\t\t<li><a href=\"https://dazzlesoftware.org/joomla/templates/nectarion\">Download</a></li>\n\t\t</ul>\t\t\n\t</div>\t\n</div>"

    attributes:
      class: ''
      title: ''
      description: ''
      nav: enabled
      autoplay: disabled
      autoplaySpeed: ''
      pauseOnHover: disabled
      label: 'Side Notes'
      items:
        -
          image: ''
          desc: "<div class=\"g-infolist g-1cols\">\n\t<p><span>Genesis benefits from an extensive, and ever expanding, catalog of online and free documentation<span class=\"hidden-tablet\"> covering basic to more advanced topics</span>.</span></p>\n\t<div class=\"g-infolist-item g-infolist-with-img\">\n\t\t<div class=\"g-infolist-item-img g-block col-3 hidden-phone left\"><img alt=\"Genesis is packed full of rich features\" src=\"genesis-media://demo/home/mainleft/img-01.jpg\"></div>\n\t\t<div class=\"g-infolist-item-text g-block\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Genesis is packed full of rich features</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item g-infolist-with-img\">\n\t\t<div class=\"g-infolist-item-img g-block col-3 hidden-phone left\"><img alt=\"Learn how to setup and use Genesis\" src=\"genesis-media://demo/home/mainleft/img-02.jpg\"></div>\n\t\t<div class=\"g-infolist-item-text g-block\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Learn how to setup and use Genesis</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item g-infolist-with-img\">\n\t\t<div class=\"g-infolist-item-img g-block col-3 hidden-phone left\"><img alt=\"Genesis help guides for various topics\" src=\"genesis-media://demo/home/mainleft/img-03.jpg\"></div>\n\t\t<div class=\"g-infolist-item-text g-block\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Genesis help guides for various topics</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div>"
          link: ''
          name: 'Item 1'
        -
          image: ''
          desc: "<div class=\"g-infolist g-1cols\">\n\t<p><span>Genesis is built with several modern web technologies, such as the twig PHP templating engine and YAML<span class=\"hidden-tablet\"> for human readable configuration files</span>.</span></p>\n\t<div class=\"g-infolist-item g-infolist-with-img\">\n\t\t<div class=\"g-infolist-item-img g-block col-3 hidden-phone left\"><img alt=\"Dynamic CSS with integrated SCSS\" src=\"genesis-media://demo/home/mainleft/img-02.jpg\"></div>\n\t\t<div class=\"g-infolist-item-text g-block\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Dynamic CSS with integrated SCSS</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item g-infolist-with-img\">\n\t\t<div class=\"g-infolist-item-img g-block col-3 hidden-phone left\"><img alt=\"Twig templating engine for PHP\" src=\"genesis-media://demo/home/mainleft/img-03.jpg\"></div>\n\t\t<div class=\"g-infolist-item-text g-block\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Twig templating engine for PHP</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item g-infolist-with-img\">\n\t\t<div class=\"g-infolist-item-img g-block col-3 hidden-phone left\"><img alt=\"YAML files for theme configuration\" src=\"genesis-media://demo/home/mainleft/img-01.jpg\"></div>\n\t\t<div class=\"g-infolist-item-text g-block\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">YAML files for theme configuration</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div>"
          link: ''
          name: 'Item 2'
    block:
      id: mainleft-headlines
      variations: 'box3 nopaddingall'
  contenttabs-3161:
    title: 'Content Tabs'
    attributes:
      animation: fade
      items:
        -
          linklabel: ''
          link: ''
          content: "<div class=\"g-infolist g-1cols\">\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<div class=\"g-title-hero\">\n\t\t\t\t\t<a href=\"#\">The new and powerful Genesis Framework</a>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"g-infolist-tags\">\n\t\t\t\t<span class=\"g-small\">Drag and Drop Functionality</span>\n\t\t\t</div>\n\t\t\t<div class=\"g-infolist-item-desc\">\n\t\t\t\t<div class=\"g-large\">\n\t\t\t\t\tGenesis is an advanced, versatile and multi-platform template framework, perfectly designed for the modern web.\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Flexible and Easy Layout Manager</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Menu Editor with Icon Options</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div>"
          title: 'Promoted News'
        -
          linklabel: ''
          link: ''
          content: "<div class=\"g-infolist g-1cols\">\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<div class=\"g-title-hero\">\n\t\t\t\t\t<a href=\"#\">A built-in and versatile dropdown menu system</a>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"g-infolist-tags\">\n\t\t\t\t<span class=\"g-small\">Drag and Drop Functionality</span>\n\t\t\t</div>\n\t\t\t<div class=\"g-infolist-item-desc\">\n\t\t\t\t<div class=\"g-large\">\n\t\t\t\t\tGenesis benefits from an integrated menu system, with intuitive mobile support, and extensive controls.\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Column Number and Width Controls</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Alignment and Ordering Functionality</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div>"
          title: 'Other News'
        -
          linklabel: ''
          link: ''
          content: "<div class=\"g-infolist g-1cols\">\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<div class=\"g-title-hero\">\n\t\t\t\t\t<a href=\"#\">The powerhouse behind content creation</a>\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t\t<div class=\"g-infolist-tags\">\n\t\t\t\t<span class=\"g-small\">Template Specific Styling</span>\n\t\t\t</div>\n\t\t\t<div class=\"g-infolist-item-desc\">\n\t\t\t\t<div class=\"g-large\">\n\t\t\t\t\tGenesis is a powerful content application, with multiple options and an intuitive administrative interface.\n\t\t\t\t</div>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Content Particles and Menu Editor</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n\t<div class=\"g-infolist-item\">\n\t\t<div class=\"g-infolist-item-text\">\n\t\t\t<div class=\"g-infolist-item-title\">\n\t\t\t\t<a href=\"#\">Multiple Layouts and Associated Themes</a>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div>"
          title: Rumors
    block:
      id: mainright-tabs
      variations: nopaddingall

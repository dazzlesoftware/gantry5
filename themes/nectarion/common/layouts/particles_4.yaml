      - begin: '2017-06-08'
        end: '2017-06-10'
        description: 'The Orange Festival is a premier music experience set among the opulent jungles of Borneo, featuring
          acclaimed headliners and up-and-coming artists. Watch extraordinary performances and discover the alluring attractions
          nestled around every turn that make the Orange a can’t-miss summer event for music fans from around the world.<br/><br/>


          The festival includes seven stages; The Terrace, The Gazebo, The Portico, The Citadel, The Tea House, The Canopy
          and The Orange Stage. The Orange offers three different passes options; general admission, Backstage, and All Access.<br/><br/>


          A number of lodging options exist at the festival. Attendees of the festival can choose to camp in a tent or RV
          in what The Orange calls The Tropic. Additionally, attendees can pay for access to private, air-conditioned tents,
          beds with sheets, access to private and air-conditioned showers and bathrooms, and access to a private food lounge.'

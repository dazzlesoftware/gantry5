name: Font Families
description: Font families for the Myriad theme
type: core

form:
  fields:

    family-default:
      type: input.fonts
      label: Default Font
      default: 'lora, Verdana, Helvetica, Arial, sans-serif'
    family-alt:
      type: input.fonts
      label: Alternative Font
      default: 'lato, Verdana, Helvetica, Arial, sans-serif'
    family-alt2:
      type: input.fonts
      label: Alternative2 Font
      default: 'latoblack, Verdana, Helvetica, Arial, sans-serif'
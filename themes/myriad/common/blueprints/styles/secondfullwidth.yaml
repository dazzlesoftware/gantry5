name: Second Fullwidth Colors
description: Second Fullwidth colors for the Myriad theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#3a353c"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/secondfullwidth/preset1/bg.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"

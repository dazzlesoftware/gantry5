    title: 'Simple Counter'
    attributes:
      title: ''
      desc: "<h2 class=\"title\">Our Website is Coming Soon</h2>\n\nMyriad supports a simple coming soon or offline style page with a time counter. It has been specifically styled to match the template. This feature can be enabled and the page customized in the Layout manager.  Please visit <a href=\"https://dazzlesoftware.org/docs/joomla/templates/myriad/comingsoon.md\">this tutorial</a> for more information."
      date: '1'
      month: '1'
      year: '2025'
      daytext: Day
      daystext: Days
      hourtext: Hour
      hourstext: Hours
      minutetext: Minutes
      minutestext: Minutes
      secondtext: Second
      secondstext: Seconds
    block:
      variations: center

  custom-4776:
    title: 'Custom HTML'
    attributes:
      html: "<h2 class=\"rt-authorized-form-title\">Authorized Login</h2>\n\n<p class=\"rt-authorized-login-message\">\nThis feature hides your Joomla site behind the Coming Soon page with its Countdown timer. You can still access the frontend of the site by logging in as an administrator below. You can customize this message in the Myriad theme language file.\t\t\t\t\t\t\t</p>"
    block:
      class: 'nomarginbottom nopaddingbottom nopaddingtop nomargintop'
      variations: center

preset1:
  image: 'gantry-admin://images/preset1.png'
  description: 'Preset 1'
  colors:
    - '#0085f6'
    - '#34a1fc'
  styles:    
    base:
      background: '#ffffff'
      text-color: '#686868'
    accent:
      color-1: '#0085f6'
      color-2: '#34a1fc'
    font:
      family-default: 'lora, Verdana, Helvetica, Arial, sans-serif'
      family-alt: 'lato, Verdana, Helvetica, Arial, sans-serif'
      family-alt2: 'latoblack, Verdana, Helvetica, Arial, sans-serif'
    top:
      background: '#111111'
      text-color: '#ffffff'
    navigation:
      background: '#0085f6'
      text-color: '#ffffff' 
    header:
      background: '#ffffff'
      text-color: '#686868' 
    slideshow:
      background: '#090d0f'
      text-color: '#ffffff' 
      overlay-opacity: '0.5'
    showcase:
      background: '#504b52'
      text-color: '#bfc3c5'      
    fullstrip:
      background: '#ffffff'
      text-color: '#686868'
    firstfullwidth:
      background: '#ffffff'
      text-color: '#686868'
    feature:
      background: '#3a353c'
      text-color: '#9d9a9e'
    utility:
      background: '#3a353c'
      text-color: '#9d9a9e'
    secondfullwidth:
      background: '#3a353c'
      background-image: 'gantry-media://backgrounds/secondfullwidth/preset1/bg.jpg'
      text-color: '#ffffff'
    maintop:
      background: '#ffffff'
      text-color: '#686868'
    main:
      background: '#ffffff'
      text-color: '#686868'
    extension:
      background: '#ffffff'
      background-image: 'gantry-media://backgrounds/extension/preset1/bg.jpg'
      text-color: '#090d0f'
    bottom:
      background: '#090d0f'
      text-color: '#686868'
    footer:
      background: '#090d0f'
      text-color: '#686868'
    copyright:
      background: '#090d0f'
      text-color: '#686868'
    offcanvas:
      background: '#efefef'
      text-color: '#0085f6'
      toggle-color: '#0085f6'


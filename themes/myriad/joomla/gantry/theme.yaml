details:
  name: Myriad
  version: '2.5.0'
  icon: paper-plane
  date: 'December 14, 2021'
  author:
    name: Dazzle Software, LLC
    email: support@dazzlesoftware.org
    link: https://dazzlesoftware.org

  documentation:
    link: http://docs.gantry.org/gantry5

  support:
    link: https://gitter.im/gantry/gantry5

  updates:
    link: http://updates.rockettheme.com/themes/myriad.yaml

  copyright: Copyright (C) 2026 Dazzle Software, LLC
  license: GPLv2
  description: Myriad Theme
  images:
    thumbnail: admin/images/preset1.png
    preview: admin/images/preset1.png

configuration:
  gantry:
    platform: joomla
    engine: nucleus

  theme:
    parent: g5_myriad
    base: gantry-theme://common
    file: gantry-theme://include/theme.php
    class: \Gantry\Framework\Theme

  fonts:
    lora:
      700: 'gantry-theme://fonts/lora/lora-bold-webfont'
      700italic: 'gantry-theme://fonts/lora/lora-bolditalic-webfont'
      400italic: 'gantry-theme://fonts/lora/lora-italic-webfont'
      400: 'gantry-theme://fonts/lora/lora-regular-webfont'
    lato:
      700: 'gantry-theme://fonts/lato/lato-bold-webfont'
      400: 'gantry-theme://fonts/lato/lato-regular-webfont'  
    latoblack:
      700: 'gantry-theme://fonts/latoblack/lato-black-webfont'

  css:
    compiler: \Gantry\Component\Stylesheet\ScssCompiler
    target: gantry-theme://css-compiled
    paths:
      - gantry-theme://scss
      - gantry-engine://scss
    files:
      - myriad
      - myriad-joomla
      - custom
    persistent:
      - myriad
    overrides:
      - myriad-joomla
      - custom

  section-variations: 
    Padding Variations:
      section-vertical-paddings: Section Vertical Paddings
      section-horizontal-paddings: Section Horizontal Paddings
      section-vertical-paddings-large: Large Vertical Paddings
      section-horizontal-paddings-large: Large Horizontal Paddings
      section-vertical-paddings-small: Small Vertical Paddings
      section-horizontal-paddings-small: Small Horizontal Paddings
      xlargemarginall: Extra Large Margin All
      xlargepaddingall: Extra Large Padding All
      xlargemargintop: Extra Large Margin Top
      xlargepaddingtop: Extra Large Padding Top
      xlargemarginbottom: Extra Large Margin Bottom
      xlargepaddingbottom: Extra Large Padding Bottom
      xlargemarginleft: Extra Large Margin Left
      xlargepaddingleft: Extra Large Padding Left
      xlargemarginright: Extra Large Margin Right
      xlargepaddingright: Extra Large Padding Right      
      largemarginall: Large Margin All
      largepaddingall: Large Padding All
      largemargintop: Large Margin Top
      largepaddingtop: Large Padding Top
      largemarginbottom: Large Margin Bottom
      largepaddingbottom: Large Padding Bottom
      largemarginleft: Large Margin Left
      largepaddingleft: Large Padding Left
      largemarginright: Large Margin Right
      largepaddingright: Large Padding Right
      medmarginall: Medium Margin All
      medpaddingall: Medium Padding All
      medmargintop: Medium Margin Top
      medpaddingtop: Medium Padding Top
      medmarginbottom: Medium Margin Bottom

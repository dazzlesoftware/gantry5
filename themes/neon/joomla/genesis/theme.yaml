details:
  name: Neon
  version: '@version@'
  icon: paper-plane
  date: '@versiondate@'
  author:
    name: Dazzle Software, LLC
    email: support@dazzlesoftware.org
    link: https://dazzlesoftware.org

  documentation:
    link: https://codex.dazzlecms.org

  support:
    link: https://gitter.im/genesis/genesis

  updates:
    link: 'https://dazzlecms.org/downloads'
    server: 'https://updates.dazzlecms.org/joomla/neon/tpl_neon.xml'

  copyright: Copyright (C) 2026 Dazzle Software, LLC
  license: GPLv3 and later
  description: Neon Theme
  images:
    thumbnail: template_preview.png
    preview: template_preview.png

configuration:
  genesis:
    platform: joomla
    engine: nucleus

  theme:
    parent: tmpl_neon
    base: genesis-theme://common
    file: genesis-theme://includes/theme.php
    class: \Genesis\Framework\Theme

  fonts:
    roboto:
      400: 'genesis-theme://fonts/roboto_regular_macroman/Roboto-Regular-webfont'
      500: 'genesis-theme://fonts/roboto_medium_macroman/Roboto-Medium-webfont'
      700: 'genesis-theme://fonts/roboto_bold_macroman/Roboto-Bold-webfont'

  css:
    compiler: \Genesis\Component\Stylesheet\ScssCompiler
    paths:
      - genesis-theme://scss
      - genesis-engine://scss
    files:
      - neon
      - neon-joomla
      - custom
    persistent:
      - neon
    overrides:
      - neon-joomla
      - custom

  block-variations:
    Box Variations:
      box1: Box 1
      box2: Box 2
      box3: Box 3
      box4: Box 4
    Effects:
      shadow: Shadow 1
      shadow2: Shadow 2
      rounded: Rounded
      square: Square
    Utility:
      disabled: Disabled
      align-right: Align Right
      align-left: Align Left
      center: Center
      full-width: Full Width
      equal-height: Equal Height
      nomarginall: No Margin
      nopaddingall: No Padding

  dependencies:
    genesis: '@genesis_version@'

admin:
  styles:
    core:
      - base
      - accent
    section:
      - header
      - navigation
      - showcase
      - feature
      - subfeature
      - main
      - footer
    configuration:
      - breakpoints

version: 3
preset:
  image: 'genesis-admin://images/layouts/3-col.png'

layout:
  /header/:
    - [logo 30, position-header 70]

  /navigation/:
    - menu

  /container-main/:
    -
      - sidebar 2:
         - position-sidebar
      - main 7:
          - position-breadcrumbs
          - system-messages
          - system-content
      - aside 2:
         - position-aside

  /footer/:
    - position-footer
    - [copyright 40, spacer 30, branding 30]

  offcanvas:
    - mobile-menu

structure:
  sidebar:
    subtype: aside
    block:
      fixed: 1
  aside:
    block:
      fixed: 1

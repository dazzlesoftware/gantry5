version: 3
preset:
  image: 'genesis-admin://images/layouts/3-col-right.png'

layout:
  /header/:
    - [logo 30, position-header 70]

  /navigation/:
    - menu

  /container-main/:
    -
      - main 7:
          - position-breadcrumbs
          - system-messages
          - pagecontent
      - aside 2:
         - position-aside
      - sidebar 2:
         - position-sidebar

  /footer/:
    - position-footer
    - [particle-copyright 40, spacer 30, particle-branding 30]

  offcanvas:
    - particle-mobile-menu

structure:
  sidebar:
    subtype: aside
    block:
      fixed: 1
  aside:
    block:
      fixed: 1

  custom-2116:
    title: 'Custom HTML'
    attributes:
      html: "<div class=\"page-header nomarginbottom nopaddingbottom\">\n  <h2 class=\"nomarginbottom nopaddingbottom\">\n    <a href=\"#\">Mainbody Area</a>\n  </h2>\n</div>\n<div class=\"entry-meta muted\">\n  <div class=\"meta-author\">Written by <a href-\"author\">Author</a></div>\n  <div class=\"meta-date\">Published: 01 January 2011</div>\n</div>\n<p class=\"g-lead nomargintop\"><span class=\"g-shadow-letter\">C</span>Cuaqum ante augue, iaculis eget fringilla vel, gravida non nibh. Nullam dignissim, felis eu imperdiet feugiat, libero ipsum gravida arcu, eu fermentum elit metus vel mauris.</p>\n\n<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum at sem ut ipsum vestibulum euismod. Mauris et massa porta leo facilisis feugiat. Suspendisse id neque a sem facilisis blandit. Aliquam sem leo, commodo ut, rutrum auctor, iaculis nec, eros. Aenean massa.</p>\n\n<p>Nullam eget neque. Nullam <a href=\"#\">imperdiet venenatis</a> ligula. Integer a leo. Nunc consectetur. Maecenas sem. Proin vulputate, massa vel volutpat laoreet, purus erat pretium ligula, eget varius arcu nibh sed libero. Fusce ante. Nullam interdum aliquet metus. Ut ultrices vestibulum tellus. Praesent quis erat. Nam id turpis sit amet neque cursus luctus. Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus. Quisque id tortor. In vitae sapien. Nunc quis tellus. </p>"
  logo-8106:
    title: 'Logo / Image'
    attributes:
      image: 'genesis-media://demo/layouts/img-02.jpg'
      text: ''
      class: ''
    block:
      class: 'nopaddingall nomargintop nomarginbottom'
  custom-9066:
    title: 'Left Sidebar'
    attributes:
      html: "<h3 class=\"g-title\">Left Sidebar</h3>\n<p>A left column layout example. The sidebar is independent from the Mainbody so can have multiple rows and columns, separate from the Mainbody area.</p>"
    block:
      class: 'nomargintop padding3x'
      variations: box3
  custom-9563:
    title: 'Aside Sidebar'
    attributes:
      html: "<h3 class=\"g-title\">Aside Sidebar</h3>\n<p>This page provides an example of both a left and right sidebar being used. Each column can have its own width in intervals of 1%, so can be equal or all different.</p>\n<p>Either use the drag and resize interface in the administrator, or individually set the numbers the block settings, to adjust the widths of all blocks in a row.</p>"
    block:
      variations: 'box4 title6'
  logo-2392:

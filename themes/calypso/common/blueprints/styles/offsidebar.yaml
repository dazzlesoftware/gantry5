name: Offsidebar Styles
description: Offsidebar styles for the Calypso theme
type: section

form:
  fields:

    background-1:
      type: input.colorpicker
      label: Background
      default: "#ffffff"
    background-2:
      type: input.colorpicker
      label: Background
      default: "rgba(0, 0, 0, 0.00)"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#000000"
    large-desktop-width:
      type: input.text
      label: Large Desktop
      description: Set breakpoint size in rem, em, or px unit values
      default: "15rem"
      pattern: '\d+(\.\d+){0,1}(rem|em|ex|ch|vw|vh|vmin|vmax|%|px|cm|mm|in|pt|pc)'
    desktop-width:
      type: input.text
      label: Desktop
      description: Set breakpoint size in rem, em, or px unit values
      default: "12rem"
      pattern: '\d+(\.\d+){0,1}(rem|em|ex|ch|vw|vh|vmin|vmax|%|px|cm|mm|in|pt|pc)'
    tablet-width:
      type: input.text
      label: Tablet
      description: Set breakpoint size in rem, em, or px unit values
      default: "10rem"
      pattern: '\d+(\.\d+){0,1}(rem|em|ex|ch|vw|vh|vmin|vmax|%|px|cm|mm|in|pt|pc)'

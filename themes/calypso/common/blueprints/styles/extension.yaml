name: Extension Styles
description: Extension styles for the Calypso theme
type: section

form:
  fields:

    background-1:
      type: input.colorpicker
      label: Background
      default: "#59ca88"
    background-2:
      type: input.colorpicker
      label: Background
      default: "#5180e8"
    background-direction:
      type: select.selectize
      label: Background Direction
      description: Select the Background Direction for the linear gradient background.
      default: 4
      options:
        1: Left to Right
        2: Top to Bottom
        3: Top to Bottom Left
        4: Top to Bottom Right
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"
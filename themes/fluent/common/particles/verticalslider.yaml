name: Vertical Slider
description: Background slider with thumbs
type: particle
icon: fa-image

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true

    _tabs:
      type: container.tabs
      fields:
        _tab_settings:
          label: Settings
          overridable: false
          fields:
            source:
              type: select.select
              label: Content Source
              description: Choose if the content should be loaded from the Joomla articles or particle itself.
              default: particle
              options:
                particle: Particle
                joomla: Joomla
            presets:
              type: select.select
              label: Presets Sync
              description: Enable or disable demo mode. Specifically used for presets on demo.rockettheme.com.
              default: disabled
              options:
                enabled: Enabled
                disabled: Disabled
            speed:
              type: input.number
              label: Speed
              description: Transition duration (in ms).
              default: 400
            auto:
              type: select.select
              label: Autoplay
              description: 	If enabled, the Slider will automatically start to play.
              default: disabled
              options:
                enabled: Enable
                disabled: Disable
            pause:
              type: input.number
              label: Pause Duration
              description: The time (in ms) between each auto transition.
              default: 2000
              min: 0
            loop:
              type: select.select
              label: Loop
              description: Enable or disable looping of the slides.
              default: disabled
              options:
                enabled: Enabled
                disabled: Disabled
            controls:
              type: select.select
              label: Controls
              description: 	If disabled, prev/next buttons will not be displayed.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable
            pager:
              type: select.select
              label: Pager
              description: Enable pager option
              default: enabled
              options:
                enabled: Enable
                disabled: Disable
            height:
              type: input.number
              label: Height
              description: Slider height in px.
              default: 580
            mobileheight:
              type: input.number
              label: Mobile Height
              description: Slider height in px for mobile view.
              default: 380

        _tab_collection:
          label: Particle Items
          overridable: false
          fields:
            items:
              type: collection.list
              array: true
              label: Images
              description: Create slideshow items.
              value: title
              ajax: true
              fields:
                .image:
                  type: input.imagepicker
                  label: Image
                  description: Select image for slideshow
                  placeholder: Pick an image
                .small_title:
                  type: input.text
                  label: Small Title
                  description: Customize the small Title.
                  placeholder: Enter the item Title
                .title:
                  type: input.text
                  label: Title
                  description: Customize the Title.
                  placeholder: Enter the item Title
                .desc:
                  type: textarea.textarea
                  label: Description
                  description: Customize the description.
                  placeholder: Enter short description
                .buttontext:
                  type: input.text
                  label: Button Label
                  description: Specify the button label.
                .buttonlink:
                  type: input.text
                  label: Button Link
                  description: Specify the button link.
                .buttontarget:
                  type: select.selectize
                  label: Target
                  description: Target browser window when item is clicked.
                  placeholder: 'Select...'
                  default: _self
                  options:
                      _self: Self
                      _blank: New Window
                .buttonclass:
                  type: input.selectize
                  label: Button Classes
                  description: CSS class names for the button.

        _tab_articles:
          label: Articles
          overridable: false
          fields:
            article.filter.categories:
              type: joomla.categories
              label: Categories
              description: Select the categories the articles should be taken from.
              overridable: false

            article.filter.articles:
              type: input.text
              label: Articles
              description: Enter the Joomla articles that should be shown. It should be a list of article IDs separated with a comma (i.e. 1,2,3,4,5).
              overridable: false

            article.filter.featured:
              type: select.select
              label: Featured Articles
              description: Select how Featured articles should be filtered.
              default: ''
              options:
                include: Include Featured
                exclude: Exclude Featured
                only: Only Featured
              overridable: false

            article.limit.total:
              type: input.text
              label: Number of Articles
              description: Enter the maximum number of articles to display.
              default: 5
              pattern: '\d{1,2}'
              overridable: false

            article.limit.start:
              type: input.text
              label: Start From
              description: Enter offset specifying the first article to return. The default is '0' (the first article).
              default: 0
              pattern: '\d{1,2}'
              overridable: false

            article.sort.orderby:
              type: select.select
              label: Order By
              description: Select how the articles should be ordered by.
              default: publish_up
              options:
                publish_up: Published Date
                created: Created Date
                modified: Last Modified Date
                title: Title
                ordering: Ordering
                hits: Hits
                id: ID
                alias: Alias
              overridable: false

            article.sort.ordering:
              type: select.select
              label: Ordering Direction
              description: Select the direction the articles should be ordered by.
              default: ASC
              options:
                ASC: Ascending
                DESC: Descending
              overridable: false

        _tab_display:
          label: Articles Display
          overridable: false
          fields:
            article.display.image.enabled:
              type: select.select
              label: Image
              description: Select if and what image of the article should be shown.
              options:
                intro: Intro
                full: Full
                '': None

            article.display.text.type:
              type: select.select
              label: Article Text
              description: Select if and how the article text should be shown.
              options:
                intro: Introduction
                full: Full Article
                '': Hide

            article.display.text.limit:
              type: input.text
              label: Text Limit
              description: Type in the number of characters the article text should be limited to.
              pattern: '\d+'

            article.display.text.formatting:
              type: select.select
              label: Text Formatting
              description: Select the formatting you want to use to display the article text.
              options:
                text: Plain Text
                html: HTML

            article.display.title.enabled:
              type: select.select
              label: Title
              description: Select if the article title should be shown.
              options:
                show: Show
                '': Hide

            article.display.title.limit:
              type: input.text
              label: Title Limit
              description: Enter the maximum number of characters the article title should be limited to.
              pattern: '\d+(\.\d+){0,1}'

            article.display.read_more.enabled:
              type: select.select
              label: Read More
              description: Select if the article 'Read More' button should be shown.
              options:
                show: Show
                '': Hide

            article.display.read_more.label:
              type: input.text
              label: Read More Label
              description: Type in the label for the 'Read More' button.
              placeholder: 'Read More...'

            article.display.read_more.css:
              type: input.selectize
              label: Button CSS Classes
              description: CSS class name for the 'Read More' button.

      items:
        -
          title: ''
          desc: '<p class="promo2">Set up and configure page layouts with Genesis''s new Layout Manager. Featuring drag-and-drop functionality that gives you the power to place content blocks, resize them, and configure their unique settings in seconds.</p>'
          link: ''
          linktext: ''
          buttontarget: _self
          buttonclass: button-3
          name: 'Item 1'
        -
          image: ''
          title: ''
          desc: '<p class="promo2">The template styling is built with SCSS, a programmable stylesheet language for CSS, making the CSS more dynamic and adaptable. You can easily enable and disable automatic recompilation of SCSS files.</p>'
          link: ''
          linktext: ''
          buttontarget: _self
          buttonclass: button-3
          name: 'Item 2'
        -
          image: ''
          title: ''
          desc: '<p class="promo2">Configuration in Genesis features sophisticated built-in fields such as Icon Picker, Image Picker, Font Picker, Collections, and much more. You can change almost any aspect of a theme without breaking out a single editor.</p>'
          link: ''

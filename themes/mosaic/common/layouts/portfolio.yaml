  custom-7122:
    title: 'Custom HTML'
    attributes:
      html: "<h3>Our Awesome Project</h3>\n\n<p>Efficiently unleash cross-media information without cross-media value. Quickly maximize timely deliverables for real-time schemas. Dramatically maintain clicks-and-mortar solutions without functional solutions.</p>\n\n<div class=\"genesis-row\">\n\t<div class=\"genesis-width-container\">\n\t\t<div class=\"genesis-width-50\">\n\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t<span class=\"rt-image\">\n\t\t\t\t\t<img src=\"genesis-media://pages/portfolio/img-17.jpg\" alt=\"image\" />\n\t\t\t\t</span>\n\t\t\t</div>\n\t\t</div>\n\n\t\t<div class=\"genesis-width-50\">\n\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t<h3>Project Description</h3>\n\t\t\t\t<p>Efficiently unleash cross-media information without cross-media value.<span class=\"hidden-tablet\"> Quickly maximize timely deliverables for real-time schemas. Dramatically maintain clicks-and-mortar solutions without functional solutions.</span></p>\n\t\t\t\t<h3>Project Details</h3>\n\t\t\t\t<div class=\"genesis-row\">\n\t\t\t\t\t<div class=\"genesis-width-30\">\n\t\t\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t\t\t<p class=\"smallmarginbottom\">Customer:</p>\n\t\t\t\t\t\t\t<p class=\"smallmarginbottom\">Live Demo:</p>\n\t\t\t\t\t\t\t<p class=\"smallmarginbottom\">Published<span class=\"hidden-tablet\"> Date</span>:</p>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t\t<div class=\"genesis-width-70\">\n\t\t\t\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t\t\t\t<p class=\"smallmarginbottom\">Dazzle Software</p>\n\t\t\t\t\t\t\t<p class=\"smallmarginbottom\">https://dazzlesoftware.org</p>\n\t\t\t\t\t\t\t<p class=\"smallmarginbottom\">08 March, 2014</p>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t</div>\n\t\t\t\t</div>\n\t\t\t\t<div class=\"clear\"></div>\n\t\t\t\t<p class=\"largemargintop\"><a href=\"#\" class=\"readon\">Learn More</a></p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div>\n\n<div class=\"clear\"></div>"

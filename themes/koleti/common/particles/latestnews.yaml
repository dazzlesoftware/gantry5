name: Latest News
description: Display latest news.
type: particle
icon: fa-newspaper-o

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particles.
      default: true

    _tabs:
      type: container.tabs
      fields:
        _tab_settings:
          label: Settings
          overridable: false
          fields:
            source:
              overridable: false
              type: select.select
              label: Content Source
              description: Choose if the content should be loaded from the platform or particle itself.
              default: particle
              options:
                particle: Particle
                joomla: Joomla

            margin_top:
              type: input.text
              label: Margin Top value
              description: Change margin value to move particle content up or down.
              pattern: '\-?\d+(\.\d+){0,1}(rem|em|ex|ch|vw|vh|vmin|vmax|%|px|cm|mm|in|pt|pc)'

            class:
              overridable: false
              type: input.selectize
              label: CSS Classes
              description: CSS class name for the particle.

            cols:
              overridable: false
              type: select.select
              label: Grid Column
              description: Select the grid column amount
              placeholder: 'Select...'
              default: cols-4
              options:
                cols-2: 2 Columns
                cols-3: 3 Columns
                cols-4: 4 Columns
                cols-5: 5 Columns

        _tab_collection:
          label: Particle Items
          overridable: false
          fields:
            cases:
              type: collection.list
              array: true
              label: News
              description: Create case studies.
              value: title
              ajax: true
              overridable: false
              fields:
                    .layout:
                      type: select.select
                      label: Layout
                      description: Select desired layout.
                      placeholder: 'Select...'
                      default: text
                      options:
                        photo: Photo
                        quote: Quote
                        text: Text

                    .image:
                      type: input.imagepicker
                      label: Image
                      description: Select desired image.
                    .title:
                      type: input.text
                      label: Title
                      description: Enter Item title
                    .description:
                      type: textarea.textarea
                      label: Description
                      description: Enter case description. Only for Alternative layouts.
                    .linklabel:
                      type: input.text
                      label: Link Label
                      default: Read More
                    .url:
                      type: input.text
                      label: Url
                      description: Customize Item url.
                    .target:
                      type: select.selectize
                      label: Target
                      description: Target browser window when item is clicked.
                      placeholder: 'Select...'
                      default: _self
                      options:
                          _self: Self
                          _blank: New

        _tab_articles:
          label: Articles
          overridable: false
          fields:
            article.filter.categories:
              overridable: false
              type: joomla.categories
              label: Categories
              description: Select the categories the articles should be taken from.

            article.filter.articles:
              overridable: false
              type: input.text
              label: Articles
              description: Enter the Joomla articles that should be shown. It should be a list of article IDs separated with a comma (i.e. 1,2,3,4,5).

            article.filter.featured:
              overridable: false
              type: select.select
              label: Featured Articles
              description: Select how Featured articles should be filtered.
              default: ''
              options:
                include: Include Featured
                exclude: Exclude Featured
                only: Only Featured

            article.limit.total:
              overridable: false
              type: input.text
              label: Number of Articles
              description: Enter the maximum number of articles to display.
              default: 5
              pattern: '\d{1,2}'

            article.limit.start:
              overridable: false
              type: input.text
              label: Start From
              description: Enter offset specifying the first article to return. The default is '0' (the first article).
              default: 0
              pattern: '\d{1,2}'

            article.sort.orderby:
              overridable: false
              type: select.select
              label: Order By
              description: Select how the articles should be ordered by.
              default: publish_up
              options:
                publish_up: Published Date
                created: Created Date
                modified: Last Modified Date
                title: Title
                ordering: Ordering
                hits: Hits
                id: ID
                alias: Alias

            article.sort.ordering:
              overridable: false
              type: select.select
              label: Ordering Direction
              description: Select the direction the articles should be ordered by.
              default: ASC
              options:
                ASC: Ascending
                DESC: Descending

        _tab_display:
          label: Articles Display
          overridable: false
          fields:
            article.display.image.enabled:
              overridable: false
              type: select.select
              label: Image
              description: Select if and what image of the article should be shown.
              options:
                intro: Intro
                full: Full
                '': None

            article.display.text.type:
              overridable: false
              type: select.select
              label: Article Text
              description: Select if and how the article text should be shown.
              options:
                intro: Introduction
                full: Full Article
                '': Hide

            article.display.text.limit:
              overridable: false
              type: input.text
              label: Text Limit
              description: Type in the number of characters the article text should be limited to.
              pattern: '\d+'

            article.display.text.formatting:
              overridable: false
              type: select.select
              label: Text Formatting
              description: Select the formatting you want to use to display the article text.
              options:
                text: Plain Text
                html: HTML

            article.display.category.enabled:
              overridable: false
              type: select.select
              label: Category
              description: Select if the category title should be shown.
              options:
                show: Show
                '': Hide

            article.display.title.enabled:
              overridable: false
              type: select.select
              label: Title
              description: Select if the article title should be shown.
              options:
                show: Show
                '': Hide

            article.display.title.limit:
              overridable: false
              type: input.text
              label: Title Limit
              description: Enter the maximum number of characters the article title should be limited to.
              pattern: '\d+(\.\d+){0,1}'

            article.display.read_more.enabled:
              overridable: false
              type: select.select
              label: Link
              description: Select if Link should be enabled.
              options:
                show: Show
                '': Hide

            article.display.read_more.target:
              overridable: false
              type: select.selectize
              label: Target
              description: Target browser window when item is clicked.
              placeholder: 'Select...'
              default: _self
              options:
                  _self: Self
                  _blank: New Window

name: Base Styles
description: Base styles for the Supra theme
type: core

form:
  fields:

    background:
      type: input.colorpicker
      label: Base Background
      default: "#000000"
    text-color:
      type: input.colorpicker
      label: Base Text Color
      default: "#82817c"
    text-active-color:
      type: input.colorpicker
      label: Base Text Active Color
      default: "#232529"

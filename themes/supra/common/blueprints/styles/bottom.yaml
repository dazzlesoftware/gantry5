name: Bottom Styles
description: Bottom styles for the Supra theme
type: section

form:
  fields:

    background-type:
      type: select.select
      label: Background Type
      description: Choose if the background should be a gradient or solid color.
      default: gradient
      options:
        gradient: Gradient
        solid: Solid
    background-1:
      type: input.colorpicker
      label: Background 1
      default: "#2276e3"
    background-2:
      type: input.colorpicker
      label: Background 2
      default: "#1ebcd3"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"

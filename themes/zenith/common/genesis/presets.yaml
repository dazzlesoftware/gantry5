      background: 'rgba(255, 255, 255, 0)'
      text-color: '#000000'
    feature:
      background: '#eef2ff'
      text-color: '#030303'
    extended:
      background: 'rgba(255, 255, 255, 0)'
      text-color: '#030303'
    showcase:
      background: '#000000'
      text-color: '#ffffff'
    utility:
      background: '#ffffff'
      text-color: '#030303'
    main:
      background: 'rgba(255, 255, 255, 0)'
      text-color: '#030303'
    expanded:
      background: 'rgba(255, 255, 255, 0)'
      text-color: '#030303'
    extension:
      background: '#eef2ff'
      text-color: '#030303'
    bottom:
      background: '#ffffff'
      text-color: '#030303'
    footer:
      background: '#000000'
      text-color: '#888888'
    copyright:
      background: '#000000'
      text-color: '#666666'

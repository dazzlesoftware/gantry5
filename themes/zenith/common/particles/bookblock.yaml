name: BookBlock
description: Display items in BookBlock layout.
type: particle
icon: fa-book

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particles.
      default: true

    _tabs:
      type: container.tabs
      fields:
        _tab_settings:
          label: Settings
          overridable: false
          fields:
            class:
              type: input.selectize
              label: CSS Classes
              description: CSS class name for the particle.

            source:
              type: select.select
              label: Content Source
              description: Choose if the content should be loaded from the Joomla articles or particle itself.
              default: particle
              options:
                joomla: Joomla
                particle: Particle

            height:
              type: input.number
              label: Section Height (px)
              description: Customize section height.
              placeholder: Enter number value.

            loop:
              type: select.select
              label: Loop
              description: Decide if you want your BookBlock to loop or not.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable

        _tab_collection:
          label: Particle Items
          overridable: false
          fields:
            items:
              type: collection.list
              array: true
              label: Blocks
              description: Create each item to appear in the content row.
              value: title
              ajax: true
              fields:
                .category:
                  type: input.text
                  label: Category
                  description: Customize the Category.
                  placeholder: Enter the item Category

                .subject:
                  type: input.text
                  label: Subject
                  description: Customize the Subject.
                  placeholder: Enter the item Subject.

                .title:
                  type: input.text
                  label: Title
                  description: Customize the Title.
                  placeholder: Enter the item Title

                .intro:
                  type: textarea.textarea
                  label: Intro
                  description: Customize the intro.
                  placeholder: Enter short intro

                .content:
                  type: textarea.textarea
                  label: Content
                  description: Customize the content.
                  placeholder: Enter content here

                .readmore:
                  type: input.text
                  label: Read More Label
                  description: Specify the Read More label.

                .readmorelink:
                  type: input.text
                  label: Read More Link
                  description: Specify the Read More link.

                .readmoretarget:
                  type: select.select
                  label: Read More Target
                  description: Target browser window when item is clicked.
                  placeholder: 'Select...'
                  default: _self
                  options:
                    _self: Self
                    _blank: New Window

                .readmoreclass:
                  type: input.selectize
                  label: Read More Classes
                  description: CSS class names for the Read More button.

                .image:
                  type: input.imagepicker
                  label: Image
                  description: Select desired image.

        _tab_articles:
          label: Articles
          overridable: false
          fields:
            article.filter.categories:
              type: joomla.categories
              label: Categories
              description: Select the categories the articles should be taken from.
              overridable: false

            article.filter.articles:
              type: input.text
              label: Articles
              description: Enter the Joomla articles that should be shown. It should be a list of article IDs separated with a comma (i.e. 1,2,3,4,5).
              overridable: false

            article.filter.featured:
              type: select.select
              label: Featured Articles
              description: Select how Featured articles should be filtered.
              default: ''
              options:
                include: Include Featured
                exclude: Exclude Featured
                only: Only Featured
              overridable: false

            article.limit.total:
              type: input.text
              label: Number of Articles
              description: Enter the maximum number of articles to display.
              default: 5
              pattern: '\d{1,2}'
              overridable: false

            article.limit.start:
              type: input.text
              label: Start From
              description: Enter offset specifying the first article to return. The default is '0' (the first article).
              default: 0
              pattern: '\d{1,2}'
              overridable: false

            article.sort.orderby:
              type: select.select
              label: Order By
              description: Select how the articles should be ordered by.
              default: publish_up
              options:
                publish_up: Published Date
                created: Created Date
                modified: Last Modified Date
                title: Title
                ordering: Ordering
                hits: Hits
                id: ID
                alias: Alias
              overridable: false

            article.sort.ordering:
              type: select.select
              label: Ordering Direction
              description: Select the direction the articles should be ordered by.
              default: ASC
              options:
                ASC: Ascending
                DESC: Descending
              overridable: false

        _tab_display:
          label: Articles Display
          overridable: false
          fields:
            article.display.image.enabled:
              type: select.select
              label: Image
              description: Select if and what image of the article should be shown.
              options:
                intro: Intro
                full: Full
                '': None

            article.display.categories.enabled:
              type: select.select
              label: Categories Names
              description: Enable or disable displaying of categories names.
              default: show
              options:
                show: Show
                '': Hide

            article.display.title.enabled:
              type: select.select
              label: Title
              description: Select if the article title should be shown.
              options:
                show: Show
                '': Hide

            article.display.title.limit:
              type: input.text
              label: Title Limit
              description: Enter the maximum number of characters the article title should be limited to.
              pattern: '\d+(\.\d+){0,1}'

            article.display.text.type:
              overridable: false
              type: select.select
              label: Article Text
              description: Select if and how the article text should be shown.
              options:
                intro: Introduction
                full: Full Article
                '': Hide

            article.display.text.limit:
              overridable: false
              type: input.text
              label: Text Limit
              description: Type in the number of characters the article text should be limited to.
              pattern: '\d+'

            article.display.text.formatting:
              overridable: false
              type: select.select
              label: Text Formatting
              description: Select the formatting you want to use to display the article text.
              options:
                text: Plain Text
                html: HTML

            article.display.link.enabled:
              type: select.select
              label: Button Link
              description: Select if the button should be shown.
              options:
                show: Show
                '': Hide

            article.display.link.label:
              type: input.text
              label: Button Label
              description: Type in the label for the button.
              placeholder: 'Learn More'

            article.display.link.target:
              type: select.selectize
              label: Link Target
              description: Target browser window when the button is clicked.
              placeholder: 'Select...'
              default: _self
              options:
                  _self: Self
                  _blank: New Window

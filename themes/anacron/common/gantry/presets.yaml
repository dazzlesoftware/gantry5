preset1:
  image: 'gantry-admin://images/preset1.png'
  description: 'Preset 1'
  colors:
    - '#3e9dd3'
    - '#78bf57'
    - '#888888'
  styles:    
    base:
      background: '#ffffff'
      text-color: '#6e6e6e'

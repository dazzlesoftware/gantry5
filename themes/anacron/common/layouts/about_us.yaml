  custom-5666:
    title: 'About Us'
    attributes:
      title: ''
      html: "<div class=\"gantry-width-block gantry-width-50\">\n\t<div class=\"gantry-width-spacer\">\n\t\t<span class=\"rt-image\">\n\t\t\t<img src=\"gantry-media://pages/about-us/img1.jpg\" alt=\"image\" />\n\t\t</span>\n\t</div>\n</div>\n\n<div class=\"gantry-width-block gantry-width-50\">\n\t<div class=\"gantry-width-spacer\">\n\t\t<h3>Introduction</h3>\n\t\t<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Amet, odio, enim quam temporibus ratione dolor iusto animi similique possimus at? Veritatis, a atque odio nam quisquam perferendis magnam necessitatibus laboriosam!</p>\n\t\t\n\t\t<div class=\"hidden-tablet\">\n\t\t\t<h3>Mission Statement</h3>\n\t\t\t<p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Amet, odio, enim quam temporibus ratione dolor iusto animi similique possimus at? Veritatis, a atque odio nam quisquam perferendis magnam necessitatibus laboriosam!</p>\t\t\t\t\n\t\t</div>\n\t</div>\n</div>\n\n<div class=\"clear\"></div>\n\n<div class=\"rt-readon-row\">\n\t<a href=\"#\" class=\"readon\"><span class=\"fa fa-arrow-right title-icon\"></span> Read More</a>\n\t<a href=\"#\" class=\"readon\"><span class=\"fa fa-envelope title-icon\"></span> Get in Touch</a>\n</div>"
  custom-3311:

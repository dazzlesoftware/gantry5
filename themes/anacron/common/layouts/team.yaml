    title: 'Pages Demo Footer'
    attributes:
      title: ''
      html: "<p>All demo content is for sample purpose only, intended to show a live site. Use the <a href=\"#\">Anacron RocketLauncher</a> to install an equivalent of the demo onto your site.</p>\n<p>Anacron is only available as part of the Club Subscription.</p>\n\n<div class=\"genesis-width-block genesis-width-50\">\n\t<div class=\"genesis-width-spacer\">\n\t\t<div class=\"rt-footer-logo\"></div>\n\t</div>\n</div>\n\n<div class=\"genesis-width-block genesis-width-50\">\n\t<div class=\"genesis-width-spacer nomarginleft\">\n\t\t<span>+1-(678)-123-6789</span><br />\n\t\t<span>Anacron Center, LLC</span><br />\n\t\t<span>123 Boulevard</span><br />\n\t\t<span>Seattle, WA 00000, USA</span><br />\n\t\t<span><a href=\"#\">hello@anacron.com</a></span>\n\t</div>\n</div>\n\n<div class=\"clear\"></div>"

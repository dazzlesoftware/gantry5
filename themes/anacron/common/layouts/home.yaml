  custom-6361:
    title: 'Custom HTML'
    attributes:
      title: 'Dynamic, Scrolling Header'
      html: "<div class=\"gantry-width-80 gantry-width-block rt-center rt-margin-auto\">\n\t<p>The Dynamic, Scrolling Header, is a custom design feature that adds an animation effect the header, where the logo and menu are contained, whereby the header elegantly collapses upon downward scroll and smoothly reappears on upward scroll.</p>\n</div>\n\n<div class=\"clear\"></div>\n\n<span class=\"rt-title-divider\"></span>\n\n"
    block:
      class: 'fp-feature rt-big-title nomarginbottom'
      variations: 'center nopaddingall'
  custom-4876:
    title: 'Custom HTML'
    attributes:
      title: ''
      html: "<div class=\"gantry-width-33 gantry-width-block rt-left\">\n  <div class=\"gantry-width-spacer\">\n      <h2><span class=\"title-icon fa fa-th\"></span><span>Responsive</span></h2>\n      <p>A responsive layout adapts to the viewing device, whether mobile, tablet or a small or larger desktop, to ensure your site is accessible on all devices.</p>\n    </div>\n</div>\n<div class=\"gantry-width-33 gantry-width-block rt-left\">\n  <div class=\"gantry-width-spacer\">\n    <h2><span class=\"title-icon fa fa-signal\"></span><span>Site Performance</span></h2>\n      <p>Dazzle Software creates sleek, dynamic themes that take full advantage of the latest Web technologies to deliver your content quickly and efficiently.</p>\n    </div>\n</div>\n\n<div class=\"gantry-width-33 gantry-width-block rt-left\">\n  <div class=\"gantry-width-spacer\">\n    <h2><span class=\"title-icon fa fa-thumbs-up\"></span><span>Great Support</span></h2> \n    <p>Receive exclusive access to the Anacron communty forum board for additional assistance, alongside the free and online documentation.</p>\n  </div>\n</div>\n\n<div class=\"clear\"></div>"
    block:
      class: 'nomargintop nopaddingtop'

      items:
        -
          title: ''
          desc: 'The Gantry 5 Framework is an ideal platform for users of all levels, whether beginners or web professionals. The administrative interface is both simple to use, intuitive and highly flexible, allowing for swift and extensive changes.'
          link: ''
          linktext: ''
          buttontarget: _self
          buttonclass: button-3
          name: 'Item 1'
        -
          title: ''
          desc: 'Grav is an award-winning content management system (CMS), which enables you to build web sites and powerful online applications. This makes Gantry 5-powered themes like Anacron the perfect match for this sleek, modern content management system.'
          link: ''
          linktext: ''
          buttontarget: _self

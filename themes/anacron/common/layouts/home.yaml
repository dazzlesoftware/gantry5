  custom-2298:
    title: 'Custom HTML'
    attributes:
      html: "<div class=\"gantry-width-20 gantry-width-block\">\n\t<div class=\"gantry-width-spacer\">\n\t\t<p class=\"rt-center\">\n\t\t\t<img src=\"gantry-media://home/extension/img1.png\" alt=\"image\" />\n\t\t</p>\n\t</div>\n</div>\n<div class=\"gantry-width-20 gantry-width-block\">\n\t<div class=\"gantry-width-spacer\">\n\t\t<p class=\"rt-center\">\n\t\t\t<img src=\"gantry-media://home/extension/img2.png\" alt=\"image\" />\n\t\t</p>\n\t</div>\n</div>\n<div class=\"gantry-width-20 gantry-width-block\">\n\t<div class=\"gantry-width-spacer\">\n\t\t<p class=\"rt-center\">\n\t\t\t<img src=\"gantry-media://home/extension/img3.png\" alt=\"image\" />\n\t\t</p>\n\t</div>\n</div>\n<div class=\"gantry-width-20 gantry-width-block\">\n\t<div class=\"gantry-width-spacer\">\n\t\t<p class=\"rt-center\">\n\t\t\t<img src=\"gantry-media://home/extension/img4.png\" alt=\"image\" />\n\t\t</p>\n\t</div>\n</div>\n<div class=\"gantry-width-20 gantry-width-block\">\n\t<div class=\"gantry-width-spacer\">\n\t\t<p class=\"rt-center\">\n\t\t\t<img src=\"gantry-media://home/extension/img5.png\" alt=\"image\" />\n\t\t</p>\n\t</div>\n</div>\n<div class=\"clear\"></div>"

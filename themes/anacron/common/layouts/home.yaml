  custom-6265:
    title: 'Custom HTML'
    attributes:
      title: 'Extensive Color Chooser Options'
      html: '<p>Anacron has an extensive Color Chooser in the template manager to provide intricate controls for each section of Anacron, inclusive of overlay type, text color, background color, as well as background images. Edit preexisting or create new presets.</p>'
    block:
      class: 'fp-expandedbottom rt-big-title nopaddingleft nopaddingright'
      variations: center
  contenttabs-4941:
    title: 'Content Tabs'
    attributes:
      items:
        -
          linklabel: ''
          link: ''
          content: "<div class=\"gantry-width-40 gantry-width-block\">\n  <div class=\"rt-about-img\">\n    <div class=\"rt-center\">\n      <img alt=\"image\" src=\"gantry-media://home/mainbottom/img1.jpg\"> <span class=\"rt-about-info\">Modern. Powerful.</span>\n    </div>\n  </div>\n</div>\n<div class=\"gantry-width-60 gantry-width-block\">\n  <h2 class=\"nomargintop\">Replicate the Demo.</h2>\n  <p><span class=\"rt-label-1\">Particles</span></p>\n  <p><span class=\"rt-label-2\">Multiple Platforms</span></p>\n  <p>The RocketLauncher is a customized install, that replaces the default sample data with the data from the demo, alongside images, the extensions and template. It is a quick way to replicate the demo onto your server.</p>\n</div>\n<div class=\"clear\"></div>"
          title: About
        -
          linklabel: ''
          link: ''
          content: "<h2 class=\"nomargintop\">Layered Image Sources.</h2><p>Anacron is distributed with Adobe Fireworks PNG sources, layered and editable, to allow for quick and easy customization.</p><div class=\"fp-team-tab\">\t<div class=\"gantry-width-25 gantry-width-block\">\t\t<div class=\"gantry-width-spacer\">\t\t\t<p class=\"rt-center\">\t\t\t\t<img src=\"gantry-media://home/mainbottom/img2.jpg\" alt=\"image\" />\t\t\t\t<span class=\"fp-team-name\">John Doe</span>\t\t\t\t<span class=\"fp-team-position\">CEO</span>\t\t\t</p>\t\t</div>\t</div>\t<div class=\"gantry-width-25 gantry-width-block\">\t\t<div class=\"gantry-width-spacer\">\t\t\t<p class=\"rt-center\">\t\t\t\t<img src=\"gantry-media://home/mainbottom/img2.jpg\" alt=\"image\" />\t\t\t\t<span class=\"fp-team-name\">Mary Burke</span>\t\t\t\t<span class=\"fp-team-position\">Designer</span>\t\t\t</p>\t\t</div>\t</div>\t<div class=\"gantry-width-25 gantry-width-block\">\t\t<div class=\"gantry-width-spacer\">\t\t\t<p class=\"rt-center\">\t\t\t\t<img src=\"gantry-media://home/mainbottom/img2.jpg\" alt=\"image\" />\t\t\t\t<span class=\"fp-team-name\">Hans Jose</span>\t\t\t\t<span class=\"fp-team-position\">Developer</span>\t\t\t</p>\t\t</div>\t</div>\t\t<div class=\"gantry-width-25 gantry-width-block\">\t\t<div class=\"gantry-width-spacer\">\t\t\t<p class=\"rt-center\">\t\t\t\t<img src=\"gantry-media://home/mainbottom/img2.jpg\" alt=\"image\" />\t\t\t\t<span class=\"fp-team-name\">Mark Riley</span>\t\t\t\t<span class=\"fp-team-position\">Support</span>\t\t\t</p>\t\t</div>\t</div>\t<div class=\"clear\"></div>\t</div>"
          title: Team
        -
          linklabel: ''
          link: ''
          content: '<h2 class="nomargintop"><span class="fa fa-question-circle"></span> Flexible &amp; Adaptable Sample Pages.</h2><p>There are a series of example pages beyond the frontpage, to show how flexible the layout system, with varying page types, module uses, and layout distributions.</p><h4 class=" nomarginbottom">Graphic Charts by ChartJS</h4><p>Create exquisite graphical charts using HTML5 and Chart.js, which is built-in with Anacron.</p><h4 class="nomarginbottom">Coming Soon / Offline Page</h4><p>Anacron supports a simple coming soon or offline style page with a time counter.</p>'
          title: FAQ

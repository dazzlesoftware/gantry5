      html: "<h2 class=\"title\">Versatile, Flexible Features Powered by the Gantry Framework.</h2>\n\n<p>Gantry is a free framework for both Joomla, WordPress, and Grav.</p>\n<a href=\"https://dazzlesoftware.org/joomla/templates/anacron\" class=\"readon2 rt-big-button\">Join Anacron Now</a>"

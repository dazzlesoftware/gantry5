    title: 'Custom HTML'
    attributes:
      title: ''
      html: "<h2 class=\"title\">Our Website is Temporarily Offline</h2>\n\nThis site is down for maintenance. <br>\nPlease check back again soon."
    block:
      class: nomargintop
      variations: center
  newsletter-4787:
    attributes:
      width: g-newsletter-compact
      layout: g-newsletter-aside-wrap
      style: g-newsletter-rounded
      title: 'Get Notified When We Release'
      inputboxtext: 'Email Address'
      buttonclass: button-xlarge
    block:
      id: rt-subscription-form
  custom-4776:
    title: 'Custom HTML'
    attributes:
      title: ''
      html: "<h2 class=\"rt-authorized-form-title\">Authorized Login</h2>\n\n<p class=\"rt-authorized-login-message\">\nThis feature sets your website offline. You can still access the frontend of the site by logging in below. You can customize this message in the Layout Manager.\t\t\t\t\t\t\t</p>"
    block:
      class: 'nomarginbottom nopaddingbottom nomargintop nopaddingtop'
      variations: center
  system-content-5351:
    block:
      id: rt-authorized-form

name: Clients
description: Shared visual defaults for Clients particles in this outline
type: particle

form:
  fields:
    heading: {type: select.select, label: Title Element, default: h3, options: {h2: H2, h3: H3, h4: H4, h5: H5, h6: H6}}
    titlefont: {type: input.fonts, label: Title Font}
    titlesize: {type: input.number, label: Title Font Size, min: 1, default: 28}
    titlecolor: {type: input.colorpicker, label: Title Color, default: '#222222'}
    titlemarginbottom: {type: input.number, label: Title Bottom Margin, min: 0, default: 24}
    alignment: {type: select.select, label: Alignment, default: center, options: {left: Left, center: Center, right: Right}}
    gap: {type: input.number, label: Item Gap, min: 0, default: 20}
    itempadding: {type: input.number, label: Item Padding, min: 0, default: 15}
    logoheight: {type: input.number, label: Logo Maximum Height, min: 1, default: 100}
    logowidth: {type: input.number, label: Logo Maximum Width, min: 1, default: 220}
    opacity: {type: input.number, label: Opacity, min: 0, max: 100, default: 100}
    itembackground: {type: input.colorpicker, label: Item Background, default: 'transparent'}
    itemborder: {type: select.select, label: Item Border, default: hide, options: {hide: Hide, show: Show}}
    itemborderwidth: {type: input.number, label: Item Border Width, min: 0, default: 1}
    itembordercolor: {type: input.colorpicker, label: Item Border Color, default: '#dddddd'}
    itemradius: {type: input.number, label: Item Border Radius, min: 0, default: 0}
    arrows: {type: select.select, label: Arrows, default: enable, options: {enable: Show, disable: Hide}}
    arrowcolor: {type: input.colorpicker, label: Arrow Color, default: '#333333'}
    arrowbackground: {type: input.colorpicker, label: Arrow Background, default: '#ffffff'}
    arrowsize: {type: input.number, label: Arrow Icon Size, min: 1, default: 22}
    arrowboxsize: {type: input.number, label: Arrow Box Size, min: 20, default: 44}
    arrowradius: {type: input.number, label: Arrow Border Radius, min: 0, default: 0}
    bulletcolor: {type: input.colorpicker, label: Bullet Color, default: '#cccccc'}
    bulletactivecolor: {type: input.colorpicker, label: Active Bullet Color, default: '#3366ff'}
    bulletsize: {type: input.number, label: Bullet Size, min: 2, default: 10}

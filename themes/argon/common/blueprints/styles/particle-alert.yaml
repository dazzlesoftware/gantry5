name: Alert
description: Shared visual defaults for Alert particles in this outline
type: particle

form:
  fields:
    heading: {type: select.select, label: Title Element, default: h3, options: {h2: H2, h3: H3, h4: H4, h5: H5, h6: H6}}
    icon: {type: input.icon, label: Icon}
    fontsize: {type: input.number, label: Content Font Size, min: 1, default: 16}
    padding: {type: input.text, label: Padding, default: '16px'}
    radius: {type: input.number, label: Border Radius, min: 0, default: 4}

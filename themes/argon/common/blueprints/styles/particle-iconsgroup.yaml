name: Icons Group
description: Shared visual defaults for Icons Group particles in this outline
type: particle

form:
  fields:
    heading: {type: select.select, label: Title Element, default: h3, options: {h2: H2, h3: H3, h4: H4, h5: H5, h6: H6}}
    titlealignment: {type: select.select, label: Title Alignment, default: center, options: {left: Left, center: Center, right: Right}}
    alignment: {type: select.select, label: Group Alignment, default: center, options: {left: Left, center: Center, right: Right}}
    gap: {type: input.number, label: Item Gap, min: 0, default: 12}

name: Dynamic Tabs
description: Shared visual defaults for Dynamic Tabs particles in this outline
type: particle

form:
  fields:
    navposition: {type: select.select, label: Navigation Position, default: top, options: {top: Top, bottom: Bottom, left: Left, right: Right}}
    alignment: {type: select.select, label: Navigation Alignment, default: left, options: {left: Left, center: Center, right: Right, justified: Justified}}
    style: {type: select.select, label: Bootstrap Tab Style, default: tabs, options: {tabs: Tabs, pills: Pills, underline: Underline}}
    navwidth: {type: input.number, label: Side Navigation Width, description: 'Percentage when navigation is left or right.', min: 10, max: 60, default: 25}
    gap: {type: input.number, label: Navigation Gap, min: 0, default: 8}
    navcolor: {type: input.colorpicker, label: Navigation Text Color, default: '#333333'}
    activecolor: {type: input.colorpicker, label: Active Text Color, default: '#ffffff'}
    activebackground: {type: input.colorpicker, label: Active Background, default: '#3366ff'}
    contentbackground: {type: input.colorpicker, label: Content Background, default: 'rgba(0,0,0,0)'}
    contentpadding: {type: input.text, label: Content Padding, default: '1.5rem'}

name: Pricing Table
description: Shared visual defaults for Pricing Table particles in this outline
type: particle

form:
  fields:
    alignment: {type: select.select, label: Alignment, default: center, options: {left: Left, center: Center, right: Right}}
    buttonstyle: {type: select.select, label: Bootstrap Button Style, default: primary, options: {primary: Primary, secondary: Secondary, success: Success, danger: Danger, warning: Warning, info: Info, dark: Dark, custom: Custom}}
    background: {type: input.colorpicker, label: Background, default: '#ffffff'}
    color: {type: input.colorpicker, label: Text Color, default: '#555555'}
    titlecolor: {type: input.colorpicker, label: Title Color, default: '#222222'}
    pricecolor: {type: input.colorpicker, label: Price Color, default: '#3366ff'}
    bordercolor: {type: input.colorpicker, label: Border Color, default: '#dddddd'}
    radius: {type: input.number, label: Border Radius, min: 0, default: 6}
    padding: {type: input.number, label: Padding, min: 0, default: 30}
    hoverbackground: {type: input.colorpicker, label: Hover Background, default: '#ffffff'}
    hoverbordercolor: {type: input.colorpicker, label: Hover Border Color, default: '#3366ff'}
    custombuttoncolor: {type: input.colorpicker, label: Custom Button Color, default: '#ffffff'}
    custombuttonbackground: {type: input.colorpicker, label: Custom Button Background, default: '#3366ff'}

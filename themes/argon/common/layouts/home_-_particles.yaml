content:
  swipercarousel-2455:
    title: 'Swiper Carousel'
    attributes:
      items:
        -
          image: 'genesis-media://header/img01.jpg'
          title: 'Argon is here!'
          desc: 'Begin your journey with a brand new &raquo;free&laquo; Genesis template from Dazzle Software.'
          link: 'http://genesis.org/downloads'
          linktext: 'Download Now'
          buttonicon: 'fa fa-rocket'
          buttonclass: button-outline
          name: 'Item 1'
        -
          image: 'genesis-media://header/img02.jpg'
          title: 'Argon is Genesis powered!'
          desc: 'Argon is based on the powerful Genesis framework.'
          link: 'http://genesis.org/downloads'
          linktext: 'Download Now'
          buttonclass: button-outline
          name: 'Item 2'
  custom-5807:
    title: Intro
    attributes:
      html: "<div class=\"fp-intro\">\n    <h2 class=\"g-title\">Build your beautiful theme, the way you want it, with Argon</h2>\n    <p>Craft memorable, emotive experiences with our Genesis framework.</p>\n    <div class=\"ipad-mockup\">\n        <img src=\"genesis-media://intro/mockup.png\" alt=\"\" />\n    </div>\n</div>"
    block:
      variations: center
  genesisfeatures-3119:
    title: 'Genesis Features'
    attributes:
      class: fp-features
      columns: 33-3
      items:
        -
          title: Drupal
          description: 'Build flexible, content-rich experiences with Genesis''s visual layout system and Drupal''s powerful content management tools.'
          icon: 'fa fa-drupal fab fa-drupal'
        -
          title: Grav
          description: 'Create fast, flexible websites with Genesis''s visual layout tools and Grav''s modern flat-file CMS.'
          icon: 'fa fa-grav fab fa-grav'
        -
          title: Joomla
          description: 'Bring your website to life with one of the most powerful and popular theming frameworks for Joomla.'
          icon: 'fa fa-joomla fab fa-joomla'
        -
          title: TYPO3
          description: 'Combine Genesis''s adaptable layouts with TYPO3''s enterprise content management capabilities for scalable, multilingual websites.'
          icon: 'fa fa-cogs'
        -
          title: WordPress
          description: 'Genesis extends WordPress'' native functionality, empowering users to shape virtually every aspect of their visitors'' experience.'
          icon: 'fa fa-wordpress fab fa-wordpress'
        -
          title: XOOPS
          description: 'Use Genesis''s flexible theming tools with XOOPS to build modular, community-focused websites that are easy to extend.'
          icon: 'fa fa-cubes'
    block:
      variations: center
  contenttabs-3854:
    title: 'Content Tabs'
    attributes:
      items:
        -
          content: "<p>Genesis includes a new, powerful Menu editor that makes menu organization,\nparticle and module injection, and visual enhancements a breeze. Here are just\na handful of things you can do with Genesis’s powerful Menu Editor.</p>\n<div class=\"row g-grid\">\n    <div class=\"col g-block col-6\">\n        <ul>\n            <li>\n                FontAwesome Icons\n            </li>\n            <li>\n                Easy Module Injection\n            </li>\n            <li>\n                Simple Particle Injection\n            </li>\n            <li>\n                Drag-and-drop Functionality\n            </li>\n            <li>\n                Per-item CSS Classes\n            </li>\n            <li>\n                Submenu Column Control\n            </li>\n        </ul>\n    </div>\n    <div class=\"col g-block col-6\">\n        <ul>\n            <li>\n                Easy Organization / Reordering\n            </li>\n            <li>\n                Link Target Designation\n            </li>\n            <li>\n                Multiple Dropdown Styles\n            </li>\n            <li>\n                Per-item Image Support\n            </li>\n            <li>\n                Subtitles\n            </li>\n            <li>\n                Non-destructive\n            </li>\n        </ul>\n    </div>\n</div>\n<div class=\"row g-grid\">\n    <div class=\"col g-block col-12\">\n        Find out more about using the Menu Editor in our <a href=\"https://codex.dazzlecms.org/configure/menu-editor\">documentation</a>.\n    </div>\n</div>"
          title: 'Menu Editor'
        -
          content: "<p>The Layout Manager makes it easier than ever to arrange and customize your users’ experience with drag-and-drop simplicity from start to finish. A handful of the many features found in the Layout Manager are listed below.</p>\n<div class=\"row g-grid\">\n    <div class=\"col g-block col-6\">\n        <ul>\n            <li>Drag-and-drop Functionality</li>\n            <li>Unlimited Items Per Row</li>\n            <li>Unlimited Rows Per Section</li>\n            <li>Easy Widget Position Placement</li>\n            <li>Resize Items with Simple Sliders</li>\n            <li>Per-section CSS Classes and Tag Attributes</li>\n        </ul>\n    </div>\n    <div class=\"col g-block col-6\">\n        <ul>\n            <li>Per-block CSS Classes, Variations, and Tag Attributes</li>\n            <li>Quick Preset Loading</li>\n            <li>Undo and Redo</li>\n            <li>Access to Easy-to-use Particles</li>\n            <li>Intuitive Visual Interface</li>\n            <li>Touch-screen Friendly</li>\n        </ul>\n    </div>\n</div>\n<div>Find out more about using the Layout Manager in our <a href=\"https://codex.dazzlecms.org/configure/layout-manager\">documentation</a>.</div>"
          title: 'Layout Manager'
  contentcubes-7850:
    title: 'Content Cubes'
    attributes:
      items:
        -
          image: 'genesis-media://above/img01.jpeg'
          imageposition: left
          label: Featured
          title: 'Genesis Won "Best Framework System" at J and Beyond 2016 '
          tags:
            -
              icon: 'fa fa-tag'
              link: '#'
              target: _self
              text: 'Design Studio'
            -
              icon: 'fa fa-tag'
              link: '#'
              target: _self
              text: Photo
          link: 'http://genesis.org/blog/genesis-wins-joscar'
          linktext: '&rarr;'
          buttonclass: ''
          buttontarget: _self
          name: 'Item 1'
        -
          image: 'genesis-media://above/img02.jpeg'
          imageposition: right
          label: Featured
          title: 'Genesis Has Been Downloaded Over Half a Million Times'
          tags:
            -
              icon: 'fa fa-tag'
              link: '#'
              target: _self
              text: 'Graphic Design'
            -
              icon: 'fa fa-tag'
              link: '#'
              target: _self
              text: 'Website Creation'
          link: 'http://genesis.org'
          linktext: '&rarr;'
          buttonclass: ''
          buttontarget: _self
          name: 'Item 2'
  custom-7658:
    title: 'Customer Testimonials'
    attributes:
      html: "<div class=\"fp-testimonials\">\n    <blockquote>\n        <img src=\"genesis-media://testimonials/face.jpg\" alt=\"Avatar\" class=\"g-img-circle\" height=\"80\" width=\"80\">\n        <p class=\"h3\">\"Argon is a beautiful, free theme made by the Dazzle Software team in appreciation of the incredible Genesis community.\"</p>\n        <footer>Andy Miller</footer>\n    </blockquote>\n</div>"
    block:
      variations: center
  custom-6355:
    title: 'Develop CMS themes quickly'
    attributes:
      html: "<div class=\"fp-multi-column-text\">\n    <h2 class=\"g-title\">Develop CMS themes quickly and efficiently</h2>\n    <div class=\"row g-grid\">\n        <div class=\"col g-block col-6\">\n            <p>\n                Argon was crafted with love by the <a href=\"https://dazzlesoftware.org\">Dazzle Software</a> team to showcase the capabilities of the Genesis framework. Argon is open source and available for free under a dual license system (<a href=\"http://www.opensource.org/licenses/mit-license.php\">MIT</a> or <a href=\"https://www.gnu.org/licenses/gpl-3.0.html\">GPL version 3 or later</a>). You do not have to keep the Genesis or Dazzle Software links and logos in the front end, however, you must ensure that all copyright notices in the code are retained.\n            </p>\n        </div>\n        <div class=\"col g-block col-6\">\n            <p>\n                Documentation for Genesis is available on the <a href=\"https://codex.dazzlecms.org\">official Genesis website</a>. You can submit any issues or feature requests for Genesis through <a href=\"http://github.com/genesis/genesis\">GitHub</a>. A chat room has been set up using <a href=\"https://gitter.im/genesis/genesis\">Gitter</a> where you can go to talk about the project with developers, contributors, and other members of the community. This is the best place to go to get quick tips and discuss features with others.\n            </p>\n        </div>\n    </div>\n</div>"
    block:
      variations: title-center

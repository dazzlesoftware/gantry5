  custom-5072:
    title: 'Custom HTML'
    attributes:
      title: 'Valora Demo'
      titletag: ''
      html: "<p class=\"hidden-phone\">These examples are intended to show how Valora can be constructed on your site, above and beyond the frontpage demonstration. These include Joomla content and component pages, with varying modular content, mainbody widths and page lengths.</p>\n\n<p class=\"nomarginbottom\">All demo content is for sample purpose only, intended to show a live site. Use the <a href=\"#\">Valora RocketLauncher</a> to install an equivalent of the demo onto your site.</p>"
      twig: '0'
      filter: '0'
    block:
      class: 'module-title rt-phone-center'
  custom-3219:

preset1:
  image: 'genesis-admin://images/preset1.png'
  description: 'Preset 1'
  colors:
    - '#e10a30'
    - '#f0600b'
  styles:    
    base:
      background: '#e8e8e8'
      text-color: '#686868'
    accent:
      color-1: '#e10a30'
      color-2: '#f0600b'
    font:
      family-default: 'ptserif, Verdana, Helvetica, Arial, sans-serif'
      family-alt: 'playfairdisplay, Verdana, Helvetica, Arial, sans-serif'
      family-alt2: 'roboto, Verdana, Helvetica, Arial, sans-serif'
    navigation:
      background: '#000000'
      text-color: '#ffffff'
    showcase:
      background: '#3f3f3f'
      text-color: '#ffffff' 
    utility:
      background: '#e10a30'
      text-color: '#ffffff'      
    feature:
      background: '#ffffff'
      text-color: '#8f8f8f'
    maintop:
      background: '#ffffff'
      text-color: '#8f8f8f'
    mainbottom:
      background: '#ffffff'
      text-color: '#8f8f8f'
    extension:
      background: '#000000'
      text-color: '#ffffff'
    bottom:
      background: '#ffffff'
      text-color: '#8f8f8f'
    footer:
      background: '#f5f5f5'
      text-color: '#686868'
    copyright:
      background: '#000000'
      text-color: '#828282'
    offcanvas:
      background: '#efefef'
      text-color: '#e10a30'
      toggle-color: '#e10a30'
      

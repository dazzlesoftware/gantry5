name: Slideshow Styles
description: Slideshow styles for the theme
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: "#000000"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/slideshow/background-01.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"

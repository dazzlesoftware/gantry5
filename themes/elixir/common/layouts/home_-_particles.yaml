      items:
        -
          class: ''
          image: 'genesis-media://home/slideshow/img-01.jpg'
          main_title: '<div data-aos="fade-right"><span>Perfect for Coffee Shops and Pubs.</span></div>'
          description1: '<div data-aos="fade-right"><span>Built on the Genesis Framework. Ready for Your Next Project.</span></div>'
          description2: '<div data-aos="fade-left"><span>Elixir is a beautiful responsive theme built using a next-generation framework. It is packed with features that are a perfect fit for cafés, coffee shops, pubs, and more! Your customers will love it!</span></div>'
          link: '#'
          linktarget: _self
          title: 'Item 1'
        -
          class: ''
          image: 'genesis-media://home/slideshow/img-01.jpg'
          main_title: '<span>Give Your Customers More to Love.</span>'
          description1: '<span>Over 30+ Particles available. Customize your site with Elixir.</span>'
          description2: '<span>The Slideshow particle catches the eye with text that flies off the side of the image, flipping between slides as your customers learn about your business'' incredible offerings.</span>'
          link: '#'
          linktarget: _self
          title: 'Item 2'
        -
          class: ''
          image: 'genesis-media://home/slideshow/img-01.jpg'
          main_title: '<span>Elixir Warms Hearts and Phones.</span>'
          description1: '<span>Mobile friendly design. Responsive to your viewing device.</span>'
          description2: '<span>Elixir is built with a responsive layout, so it will expand and contract accordingly to the size and resolution of the screen, whether mobile, tablet or desktop.</span>'
          link: '#'
          linktarget: _self
          title: 'Item 3'
      article:
        filter:
          categories: ''
          articles: ''
          featured: include

  slideshow-4169:
    attributes:
      source: particle
      height: 85vh
      heightMobile: 500px
      direction: horizontal
      bullets: enabled
      arrows: enabled
      autoplay: enabled
      autoplayTimeout: '8000'
      loop: enabled

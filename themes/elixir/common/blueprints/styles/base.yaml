name: Base Styles
description: Base styles for the theme
type: core

form:
  fields:
    background:
      type: input.colorpicker
      label: Base Background
      default: "#2d271d"
    surround-image:
      type: input.imagepicker
      label: Surround Image
      default: "genesis-media://backgrounds/body/bg-01.svg"
    text-color:
      type: input.colorpicker
      label: Base Text Color
      default: "#736f6c"
    text-active-color:
      type: input.colorpicker
      label: Base Text Active Color
      default: "#d6b67f"

name: Font Families
description: Font families for the Aeonix theme
type: core

form:
  fields:

    family-regular:
      type: input.fonts
      label: Regular Font
      default: 'cabin-regular, Verdana, Helvetica, Arial, sans-serif'
    family-bold:
      type: input.fonts
      label: Bold Font
      default: 'cabin-semibold, Verdana, Helvetica, Arial, sans-serif'
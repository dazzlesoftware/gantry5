content:
  custom-3803:
    title: 'Custom HTML'
    attributes:
      title: ''
      html: '<a id="rt-logo" href="#"></a>'
    block:
      class: nopaddingall
      variations: center
  simplecounter-2192:
    title: 'Simple Counter'
    attributes:
      title: 'Our Website is Coming Soon'
      desc: 'Aeonix supports a simple coming soon or offline style page with a time counter. It has been specifically styled to match the template. Just load the Coming Soon layout in the Layout manager and assign to your Home page to enable.'
      date: '1'
      month: '1'
      year: '2025'
      daytext: Day
      daystext: Days
      hourtext: Hour
      hourstext: Hours
      minutetext: Minutes
      minutestext: Minutes
      secondtext: Second
      secondstext: Seconds
    block:
      class: 'rt-big-title nopaddingall'
      variations: center
  newsletter-4787:
    attributes:
      width: g-newsletter-compact
      layout: g-newsletter-aside-wrap
      style: g-newsletter-rounded
      title: 'Get Notified When We Release'
      inputboxtext: 'Email Address'
      buttonclass: button-xlarge
    block:
      id: rt-subscription-form
  custom-4776:
    title: 'Custom HTML'
    attributes:
      title: ''
      html: "<h2 class=\"rt-authorized-form-title\">Authorized Login</h2>\n\n<p class=\"rt-authorized-login-message\">\nThis feature hides your site behind the Coming Soon page with its Countdown timer. You can still access the frontend of the site by logging in as an administrator below. You can customize this message in the Layout Manager.\t\t\t\t\t\t\t</p>"
    block:
      class: 'nomarginbottom nopaddingbottom nomargintop nopaddingtop'
      variations: center
  position-position-1475:
    title: Login
    attributes:
      key: login
    block:
      id: rt-authorized-form

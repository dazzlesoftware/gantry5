name: Slideshow Styles
description: Slideshow styles for the theme
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: "rgba(255,255,255,0)"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/slideshow/bg-01.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"
    section-clipping:
      type: enable.enable
      label: Section Clipping
      default: 1

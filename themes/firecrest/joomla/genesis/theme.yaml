details:
  name: Firecrest
  version: '@version@'
  icon: paper-plane
  date: '@versiondate@'
  author:
    name: Dazzle Software, LLC
    email: support@dazzlesoftware.org
    link: https://dazzlesoftware.org

  documentation:
    link: https://codex.dazzlecms.org

  support:
    link: https://gitter.im/genesis/genesis

  updates:
    link: https://updates.dazzlecms.org/joomla/firecrest/tpl_firecrest.xml

  news:
    link: http://news.rockettheme.com/prime/themes.yaml

  copyright: Copyright (C) 2026 Dazzle Software, LLC
  license: GPLv3 and later
  description: Firecrest Theme
  images:
    thumbnail: template_preview.png
    preview: template_preview.png

configuration:
  genesis:
    platform: joomla
    engine: nucleus

  theme:
    parent: tpl_firecrest
    base: genesis-theme://common
    file: genesis-theme://include/theme.php
    class: \Genesis\Framework\Theme

  fonts:
    feather:
      400: 'genesis-theme://fonts/feather/feather'
    montserrat:
      300: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-300'
      300italic: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-300italic'
      400: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-regular'
      400italic: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-italic'
      500: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-500'
      500italic: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-500italic'
      600: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-600'
      600italic: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-600italic'
      700: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-700'
      700italic: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-700italic'
      800: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-800'
      800italic: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-800italic'
      900: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-900'
      900italic: 'genesis-theme://fonts/montserrat/montserrat-v14-latin-900italic'
    roboto:
      300: 'genesis-theme://fonts/roboto/roboto-v20-latin-300'
      300italic: 'genesis-theme://fonts/roboto/roboto-v20-latin-300italic'
      400: 'genesis-theme://fonts/roboto/roboto-v20-latin-regular'
      400italic: 'genesis-theme://fonts/roboto/roboto-v20-latin-italic'
      500: 'genesis-theme://fonts/roboto/roboto-v20-latin-500'
      500italic: 'genesis-theme://fonts/roboto/roboto-v20-latin-500italic'
      700: 'genesis-theme://fonts/roboto/roboto-v20-latin-700'
      700italic: 'genesis-theme://fonts/roboto/roboto-v20-latin-700italic'
  css:
    compiler: \Genesis\Component\Stylesheet\ScssCompiler
    target: genesis-theme://css-compiled
    paths:
      - genesis-theme://scss
      - genesis-engine://scss
    files:
      - firecrest
      - firecrest-joomla
      - custom
    persistent:
      - firecrest
    overrides:
      - firecrest-joomla
      - custom

  dependencies:
    genesis: '@genesis_version@'
  section-variations:
    Padding Variations:
      section-vertical-paddings: Section Vertical Paddings
      section-horizontal-paddings: Section Horizontal Paddings
      section-vertical-paddings-large: Large Vertical Paddings
      section-horizontal-paddings-large: Large Horizontal Paddings
      section-vertical-paddings-small: Small Vertical Paddings
      section-horizontal-paddings-small: Small Horizontal Paddings
      largemarginall: Large Margin All
      largepaddingall: Large Padding All
      largemargintop: Large Margin Top
      largepaddingtop: Large Padding Top
      largemarginbottom: Large Margin Bottom
      largepaddingbottom: Large Padding Bottom
      largemarginleft: Large Margin Left
      largepaddingleft: Large Padding Left
      largemarginright: Large Margin Right
      largepaddingright: Large Padding Right
      medmarginall: Medium Margin All
      medpaddingall: Medium Padding All
      medmargintop: Medium Margin Top
      medpaddingtop: Medium Padding Top
      medmarginbottom: Medium Margin Bottom
      medpaddingbottom: Medium Padding Bottom
      medmarginleft: Medium Margin Left
      medpaddingleft: Medium Padding Left
      medmarginright: Medium Margin Right
      medpaddingright: Medium Padding Right
      smallmarginall: Small Margin All
      smallpaddingall: Small Padding All
      smallmargintop: Small Margin Top
      smallpaddingtop: Small Padding Top
      smallmarginbottom: Small Margin Bottom

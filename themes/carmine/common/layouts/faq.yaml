  custom-5907:
    title: 'Custom HTML'
    attributes:
      html: "<h3>Common Queries and Questions</h3>\n\n<p>Completely synergize resource sucking relationships via premier niche markets. Professionally cultivate one-to-one customer service with robust ideas. Dynamically innovate resource-leveling customer service for state of the art customer service.</p>\n<ul>\n\t<li>Versatile, Flexible Features Powered by the Genesis Framework.</li>\n\t<li>Genesis is a free framework for Joomla, WordPress, and Grav.</li>\n\t<li>A selection of configurable preset style variations are available.</li>\n</ul>\n\n<p><a href=\"#\" class=\"readon\">Help &amp; Knowledge</a></p>"
  custom-2633:
    title: 'Custom HTML'
    attributes:
      html: "<h2 class=\"title module-title\"><span>FAQ Didn't Solve Your Problem?</span></h2>\n\n<p>Get Direct Access to the Team Via Phone, Email or Live Chat.</p>\n\n<p><a href=\"https://dazzlesoftware.org/forum/grav-theme-carmine\" class=\"readon largemargintop\">Contact Us</a></p>"
    block:
      variations: center
  custom-7934:
    title: 'Custom HTML'
    attributes:
      html: "<h2 class=\"title\"><span>Carmine Demo</span></h2>\n\n<p class=\"hidden-phone\">These examples are intended to show how Carmine can be constructed on your site, above and beyond the frontpage demonstration. These include content and component pages, with varying modular content, mainbody widths and page lengths.</p>\n\n<p class=\"nomarginbottom\">All demo content is for sample purpose only, intended to show a live site. Use the <a href=\"#\">Carmine RocketLauncher</a> to install an equivalent of the demo onto your site.</p>"
    block:
      class: rt-phone-center
  custom-1158:
    title: 'Custom HTML'
    attributes:
      html: "<h2 class=\"title\"><span>Sample Contact Info</span></h2>\n\n<p>Completely synergize resource sucking relationships via premier niche markets. Professionally cultivate one-to-one customer service with robust ideas.</p>\n\n<div class=\"genesis-width-container\">\n\t<div class=\"genesis-width-40\">\n\t\t<div class=\"genesis-width-spacer\">\n\t\t\t<img src=\"genesis-media://pages/overview/logo.png\" alt=\"image\" />\n\t\t</div>\t\n\t</div>\n\n\t<div class=\"genesis-width-60\">\n\t\t<div class=\"genesis-width-spacer\">\n\t\t\t<span class=\"rt-intro-text\">+1(123)456-5555-555</span><br />\n\t\t\t<span>Carmine Theme, LLC</span><br />\n\t\t\t<span>123 CMS Boulevard</span><br />\n\t\t\t<span>Seattle, WA 00000, USA</span><br />\n\t\t\t<span><a href=\"#\">noreply@domain.com</a></span>\n\t\t</div>\n\t</div>\n</div>\n<div class=\"clear\"></div>"

name: Slideshow Styles
description: Slideshow styles for the Vortex theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#ffffff"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/slideshow/img-01.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#605c72"

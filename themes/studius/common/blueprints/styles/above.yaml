name: Above Styles
description: Above styles for the theme
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: "#193564"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "gantry-media://backgrounds/above/bg-01.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"

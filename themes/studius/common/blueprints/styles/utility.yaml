name: Utility Styles
description: Utility styles for the theme
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: "#f2f9fb"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/utility/bg-01.png"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#193564"

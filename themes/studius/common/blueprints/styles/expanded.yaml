name: Expanded Styles
description: Expanded styles for the theme
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: "#ffffff"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/expanded/bg-01.svg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#193564"

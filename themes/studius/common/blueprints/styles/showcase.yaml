name: Showcase Styles
description: Showcase styles for the theme
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: "#f6faff"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "gantry-media://backgrounds/showcase/bg-01.png"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#193564"

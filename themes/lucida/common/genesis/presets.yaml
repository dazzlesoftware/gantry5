      background: '#ffffff'
      text-color: '#000000'
    utility:
      background: '#ffffff'
      text-color: '#000000'
    main:
      background: '#ffffff'
      text-color: '#000000'
    expanded:
      background: '#ffffff'
      text-color: '#000000'
    extension:
      background: '#ffffff'
      text-color: '#000000'
    bottom:
      background: '#000000'
      text-color: '#ffffff'
    footer:
      background: '#000000'
      text-color: '#666666'

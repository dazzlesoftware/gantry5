name: Feature Styles
description: Feature styles for the theme
type: section

form:
  fields:
    background:
      type: input.colorpicker
      label: Background
      default: "#ffffff"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/feature/bg-01.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#000000"

name: Accordion Slider
description: Display items in paginated Accordion layout.
type: particle
icon: fa-slideshare

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true

    _tabs:
      type: container.tabs
      fields:
        _tab_settings:
          label: Particle Settings
          overridable: false
          fields:
            class:
              type: input.selectize
              label: CSS Classes
              description: CSS class name for the particle.

            source:
              type: select.select
              label: Content Source
              description: Choose if the content should be loaded from the Joomla articles or particle itself.
              default: particle
              options:
                particle: Particle
                joomla: Joomla

            title:
              type: input.text
              label: Title
              description: Customize the title text.
              placeholder: Enter title

            description:
              type: textarea.textarea
              label: Description
              description: Customize the description.
              placeholder: Enter short description

            displayitems:
              type: input.number
              label: Display at Once
              description: Number of items to display at once.
              min: 1
              default: 3

            nav:
              type: select.select
              label: Prev / Next
              description: Enable or disable the Prev / Next navigation.
              default: enabled
              options:
                enabled: Enabled
                disabled: Disabled

            prevText:
              type: input.text
              label: Prev Text
              description: Customize the Prev text if Prev / Next navigation is enabled.
              placeholder: '&larr;'

            nextText:
              type: input.text
              label: Next Text
              description: Customize the Nav text if Prev / Next navigation is enabled.
              placeholder: '&rarr;'

            loop:
              type: select.select
              label: Loop
              description: Enable or disable the Inifnity loop. Duplicate last and first items to get loop illusion.
              default: enabled
              options:
                enabled: Enabled
                disabled: Disabled

            autoplay:
              type: select.select
              label: Autoplay
              description: Enable or disable the Autoplay.
              default: disabled
              options:
                enabled: Enabled
                disabled: Disabled

            autoplaySpeed:
              type: input.text
              label: Autoplay Speed
              description: Set the speed of the Autoplay, in milliseconds.
              placeholder: 5000

            pauseOnHover:
              type: select.select
              label: Pause on Hover
              description: Pause the slideshow when hovering over slider, then resume when no longer hovering.
              default: enabled
              options:
                enabled: Enabled
                disabled: Disabled

            accordionTitle:
              type: input.text
              label: Accordion Title
              description: Customize the accordion title text.
              placeholder: Enter title

            accordionSubtitle:
              type: input.text
              label: Accordion Subtitle
              description: Customize the accordion subtitle text.
              placeholder: Enter subtitle

        _tab_collection:
          label: Particle Items
          overridable: false
          fields:
            items:
              type: collection.list
              array: true
              label: Accordion Items
              description: Create each accordion item to display.
              value: name
              ajax: true

              fields:
                .image:
                  type: input.imagepicker
                  label: Image
                  description: Select desired image.
                .title:
                  type: input.text
                  label: Title
                  description: Enter the title
                .desc:
                  type: textarea.textarea
                  label: Description
                  description: Customize the description.
                  placeholder: Enter short description
                .link:
                  type: input.text
                  label: Link
                  description: Input the item link.
                .linktext:
                  type: input.text
                  label: Link Text
                  description: Input the text for the item link.
                  placeholder: 'Read More'
                .buttontarget:
                  type: select.selectize
                  label: Target
                  description: Target browser window when item is clicked.
                  placeholder: 'Select...'
                  default: _self
                  options:
                      _self: Self
                      _blank: New Window

        _tab_joomla:
          label: Joomla Content
          overridable: false
          fields:
            joomla.categories:
              type: joomla.categories
              label: Joomla Categories
              description: Select the categories the articles should be taken from.

            joomla.articles:
              type: input.number
              label: Articles to Fetch
              description: Number of Joomla articles to fetch from category.
              min: 1
              default: 6

            joomla.introimage:
              type: select.select
              label: Intro Image
              description: Enable or disable the Intro Image.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable

            joomla.introtext:
              type: select.select
              label: Intro Text
              description: Enable or disable the Intro Text.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable

            joomla.link:
              type: select.select
              label: Link
              description: Enable or disable displaying of link to article.
              default: disabled
              options:
                enabled: Enable
                disabled: Disable

            joomla.linktext:
              type: input.text
              label: Link Text
              description: Input the text for the article link.
              placeholder: Read more

            joomla.linktarget:
              type: select.selectize
              label: Target
              description: Target browser window when item is clicked.
              placeholder: 'Select...'
              default: _self
              options:
                  _self: Self
                  _blank: New Window

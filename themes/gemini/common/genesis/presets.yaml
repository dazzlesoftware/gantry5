preset1:
  image: 'genesis-admin://images/preset1.png'
  description: 'Preset 1'
  colors:
    - '#4e58cb'
    - '#a5a6bd'
    - '#4e58cb'
  styles:
    base:
      background: '#ffffff'
      text-color: '#7f7f7f'
      text-active-color: '#232529'
    accent:
      color-1: '#4e58cb'
      color-2: '#f2435b'
      color-3: '#a5a6bd'
    menustyle:
      text-color: '#7f7f7f'
      text-color-active: '#232529'
      sublevel-text-color: 'rgba(255, 255, 255, 0.8)'
      sublevel-text-color-active: '#ffffff'
      sublevel-background: '#232529'
    font:
      family-default:    'sourcesanspro, Helvetica, Tahoma, Geneva, Arial, sans-serif'
      family-title:      'sourcesanspro, Helvetica, Tahoma, Geneva, Arial, sans-serif'
      family-promo:      'sourcesanspro, Helvetica, Tahoma, Geneva, Arial, sans-serif'
    overlay:
      background: 'rgba(2, 3, 30, 0.9)'
      text-color: '#ffffff'
      opacity: '0.9'
    top:
      background: '#ffffff'
      text-color: '#7f7f7f'
    navigation:
      background: 'rgba(255, 255, 255, 0.0)'
      background-image: 'genesis-media://backgrounds/navigation/img-01.jpg'
      text-color: '#7f7f7f'
    slideshow:
      background: '#ffffff'
      text-color: '#7f7f7f'
    header:
      background: '#f8f8f8'
      text-color: '#7f7f7f'
    above:
      background: '#ffffff'
      text-color: '#7f7f7f'
    showcase:
      background: '#ffffff'
      text-color: '#7f7f7f'
    utility:
      background: '#f8f8f8'
      text-color: '#7f7f7f'
    feature:
      background: '#ffffff'
      text-color: '#7f7f7f'
    main:
      background: '#ffffff'
      text-color: '#7f7f7f'
    expanded:
      background: '#ffffff'
      text-color: '#7f7f7f'
    extension:
      background: '#f8f8f8'
      text-color: '#7f7f7f'
    bottom:
      background: '#ffffff'
      text-color: '#7f7f7f'
    footer:
      background: '#f8f8f8'
      text-color: '#aaaaaa'
    copyright:
      background: '#ffffff'
      text-color: '#aaaaaa'
    offcanvas:
      background: '#000000'
      text-color: '#87888e'
      toggle-color: '#000000'
    breakpoints:
      large-desktop-container: 75rem
      desktop-container: 60rem
      tablet-container: 48rem
      large-mobile-container: 30rem
      mobile-menu-breakpoint: 48rem

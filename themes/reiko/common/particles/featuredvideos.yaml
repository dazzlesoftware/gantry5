name: Featured Videos
description: Background slideshow with small picture
type: particle
icon: fa-youtube-play

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true
    title:
      type: input.text
      label: Particle Title
      description: Enter particle title.

    _tabs:
      type: container.tabs
      fields:
        _tab_settings:
          label: Settings
          overridable: false
          fields:
            height:
              type: input.text
              label: Slide Height
              description: Set the video slide minimum height in pixels.
              placeholder: 300

            titleheight:
              type: input.text
              label: Slide Title Height
              description: Set the video slide title minimum height in pixels.
              placeholder: 140

            autoplay:
              type: select.select
              label: Autoplay
              description: Decide if you want your slideshow to autoplay or not.
              default: enabled
              options:
                enabled: Enable
                disabled: Disable

            autoplayTimeout:
              type: input.number
              label: Autoplay Timeout
              description: The time between each auto transition
              default: 5000

            speed:
              type: input.number
              label: Speed
              description: Transition speed
              default: 250

        _tab_collection:
          label: Particle Items
          overridable: false
          fields:
            items:
              type: collection.list
              array: true
              label: Items
              description: Create slideshow items.
              value: title
              ajax: true
              fields:
                .title:
                  type: input.text
                  label: Title
                  description: Enter slide title

                .image:
                  type: input.imagepicker
                  label: Image
                  description: Select image for slideshow
                  placeholder: Pick an image

                .alt:
                  type: input.text
                  label: Alt Attribute
                  description: Alt attribute specifies an alternate text for an image, if the image cannot be displayed.
                  placeholder: Enter alt attribute

                .link:
                  type: input.text
                  label: Link
                  description: Set a URL for the item to take visitors to (YouTube requires /embed/ url).

                .linktarget:
                  type: select.selectize
                  label: Link Target
                  description: Set the target for the URL to open in.
                  placeholder: 'Select...'
                  default: modal
                  options:
                      _self: Self
                      _blank: New Window
                      modal: Modal

  custom-7934:
    title: 'Custom HTML'
    attributes:
      html: "<h2 class=\"title\"><span>Vermilion Demo</span></h2>\n\n<p class=\"hidden-phone\">These examples are intended to show how Vermilion can be constructed on your site, above and beyond the frontpage demonstration. These include content and component pages, with varying modular content, mainbody widths and page lengths.</p>\n\n<p class=\"nomarginbottom\">All demo content is for sample purpose only, intended to show a live site. Use the <a href=\"#\">Vermilion RocketLauncher</a> to install an equivalent of the demo onto your site.</p>"
    block:
      class: rt-phone-center

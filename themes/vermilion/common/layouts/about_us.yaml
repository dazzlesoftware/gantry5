  custom-9150:
    title: 'Custom HTML'
    attributes:
      html: "<div class=\"genesis-row\">\n\t<div class=\"genesis-width-container\">\n\t\t<div class=\"genesis-width-33\">\n\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/about-us/img-02.jpg\" alt=\"image\" /></span>\n\t\t\t\t<h4>Our Mission</h4>\n\t\t\t\t<p>Objectively innovate empowered manufactured products whereas parallel platforms. Holistically predominate extensible testing procedures for reliable supply chains.</p>\n\t\t\t</div>\n\t\t</div>\n\n\t\t<div class=\"genesis-width-33\">\n\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/about-us/img-02.jpg\" alt=\"image\" /></span>\n\t\t\t\t<h4>Our Values</h4>\n\t\t\t\t<p>Proactively envisioned multimedia based expertise and cross-media growth strategies. Seamlessly visualize quality intellectual capital without superior collaboration.</p>\n\t\t\t</div>\n\t\t</div>\n\n\t\t<div class=\"genesis-width-33\">\n\t\t\t<div class=\"genesis-width-spacer\">\n\t\t\t\t<span class=\"rt-image\"><img src=\"genesis-media://pages/about-us/img-02.jpg\" alt=\"image\" /></span>\n\t\t\t\t<h4>Our Solution</h4>\n\t\t\t\t<p>Engage worldwide methodologies with web-enabled technology. Interactively coordinate proactive e-commerce via process-centric outside the box thinking.</p>\n\t\t\t</div>\n\t\t</div>\n\t</div>\n</div>\n\n<div class=\"clear\"></div>"
  custom-2633:
    title: 'Custom HTML'
    attributes:
      title: 'We Always Try to Create a Difference'
      titletag: ''
      html: "<p>Utilized with Versatile and Flexible Features Powered by the Genesis Framework.</p>\n\n<p><a href=\"https://dazzlesoftware.org/grav/themes/vermilion\" class=\"readon largemargintop\">Download Vermilion</a></p>"
    block:

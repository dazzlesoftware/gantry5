  showcase-4247:
    attributes:
      promo: About
      promobold: Vermilion
      desc: '<p class="hidden-phone">Vermilion adopts a business or commercial centric visual model, with corporate background shades interwoven with configurable, vibrant or brand colors, allowing for an equilibrium between professionalism and artistic allure.</p>'
      link1: 'https://dazzlesoftware.org/joomla/themes/vermilion'
      linktext1: 'Purchase Vermilion'
      buttontarget1: _blank
      buttonclass1: readon
      link2: 'https://dazzlesoftware.org/docs/joomla/themes/vermilion'
      linktext2: 'View Documentation'
      buttontarget2: _blank
      buttonclass2: readon2
    block:
      class: 'fp-showcase fp-showcase-animate'
      variations: center
  headlines-9763:
    attributes:
      class: ''
      title: ''
      description: ''
      nav: enabled
      autoplay: disabled
      autoplaySpeed: ''
      pauseOnHover: enabled
      label: 'Recent News:'
      items:
        -
          image: ''
          desc: 'The Genesis Framework is the powerful platform that supports Vermilion.'
          link: ''
          name: 'Item 1'
        -
          image: ''
          desc: 'Dropdown Menu is a highly configurable CSS-based menu system.'
          link: ''
          name: 'Item 2'
        -
          image: ''
          desc: 'The responsive layout provides mobile, tablet and desktop support.'
          link: ''
          name: 'Item 3'
    block:
      class: 'fp-feature-02 box1'
      variations: nomarginall
  featureblocks-7606:
    title: 'Feature Blocks'
    attributes:
      cols: '25'
      items:
        -
          image: 'genesis-media://home/fp-feature/img-01.jpg'
          imagealt: ''
          animation: '1'
          overlaytitle: 'Advanced &amp; adaptable CSS <span class="hidden-tablet">dropdown </span>menu'
          overlaydesc: 'Two Menu Options'
          link: '#'
          icon: 'fa fa-dashboard'
          title: 'Multiple Configurable Navigation Systems'
          desc: 'Choose between our CSS-based dropdown menu with advanced features such as inline particles.'
          name: 'Item 1'
        -
          image: 'genesis-media://home/fp-feature/img-01.jpg'
          imagealt: ''
          animation: '2'
          overlaytitle: 'Integrated styling for content<span class="visible-large"> blocks and particles</span>'
          overlaydesc: 'Content Particles'
          link: '#'
          icon: 'fa fa-comments-o'
          title: 'Versatile Layout Manager with Custom Particles'
          desc: 'Multiple default particles to choose from, and an advanced &amp; powerful custom administrative interface.'
          name: 'Item 2'
        -
          image: 'genesis-media://home/fp-feature/img-01.jpg'
          imagealt: ''
          animation: '3'
          overlaytitle: 'Powerful and free core framework<span class="visible-large"> for Joomla</span>'
          overlaydesc: 'Genesis Framework'
          link: '#'
          icon: 'fa fa-book'
          title: 'Extensive Array of Standard Features'
          desc: 'Genesis is the powerful core framework that sits at the core of Vermilion, providing a rich feature set.'
          name: 'Item 3'
        -
          image: 'genesis-media://home/fp-feature/img-01.jpg'
          imagealt: ''
          animation: '4'
          overlaytitle: '<span><span class="visible-tablet">Several</span><span class="hidden-tablet">Eight stylistics and </span><span class="hidden-large"><span class="hidden-tablet">other</span></span><span class="visible-large">several structural</span> block variations</span>'
          overlaydesc: Customization
          link: '#'
          icon: 'fa fa-unlink'
          title: 'Quick and Easy Block Individualization'
          desc: 'A diverse selection of configurable block variations, either stylistic or structural in function.'
          name: 'Item 4'
    block:
      variations: 'nopaddingall nomarginall center'
  custom-8900:
    title: 'FP MainTop'
    attributes:
      title: ''
      titletag: ''
      html: "<div class=\"rt-icon-badge\"><span class=\"fa fa-volume-up\"></span></div>\n<p class=\"promo2 nomarginbottom\">Use over 350 built-in icons for your site content and design</p>\n<p class=\"rt-text-small nomarginbottom\">Powered by Font Awesome 4</p>"
      twig: '0'
      filter: '0'
    block:
      class: fp-maintop
      variations: center
  custom-1259:
    title: 'FP Expanded Top'
    attributes:
      title: ''
      titletag: ''
      html: "<div class=\"genesis-row\">\n\t<div class=\"genesis-width-33\">\n\t\t<div class=\"genesis-width-spacer\">\n\t\t\t<div class=\"rt-icon-badge rt-text-accent2\"><span class=\"fa fa-desktop\"></span></div>\n\t\t\t<h5 class=\"medpaddingtop rt-text-accent2\">Responsive Layout</h5>\n\t\t\t<p>A responsive layout automatically adapts to the viewing device, allowing for an optimized appearance on multiple devices, such as tablets.</p>\n\t\t\t<a href=\"#\" class=\"readon4\">Read More</a>\n\t\t</div>\n\t</div>\n\n\t<div class=\"genesis-width-33\">\n\t\t<div class=\"genesis-width-spacer\">\n\t\t\t<div class=\"rt-icon-badge rt-text-accent3\"><span class=\"fa fa-th\"></span></div>\n\t\t\t<h5 class=\"medpaddingtop rt-text-accent3\">Editable Structure</h5>\n\t\t\t<p>The template manager offers configuration options to individually control each module position row, per page, allowing for custom widths.</p>\n\t\t\t<a href=\"#\" class=\"readon3\">Read More</a>\n\t\t</div>\n\t</div>\n\n\t<div class=\"genesis-width-33\">\n\t\t<div class=\"genesis-width-spacer\">\n\t\t\t<div class=\"rt-icon-badge rt-text-accent2\"><span class=\"fa fa-mobile-phone\"></span></div>\n\t\t\t<h5 class=\"medpaddingtop rt-text-accent2\">Mobile Support</h5>\n\t\t\t<p>Vermilion has responsive styling for smartphones, but also benefits from a mobile specific menu to better match the touch based user interface.</p>\n\t\t\t<a href=\"#\" class=\"readon4\">Read More</a>\n\t\t</div>\n\t</div>\t\n</div>\n\n<div class=\"clear\"></div>"
      twig: '0'
      filter: '0'
    block:
      class: fp-expandedtop
      variations: center
  stripsslider-5044:
    title: 'Strips Slider'
    attributes:
      class: ''
      title: Particles
      description: "Versatile Content Blocks for Genesis\n"
      displayitems: '3'
      mobiledisplayitems: '3'
      nav: disabled
      dots: enabled
      loop: disabled
      autoplay: disabled
      autoplaySpeed: ''
      pauseOnHover: enabled
      items:
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: Mosaic
          desc: 'The Mosaic particle displays content in dynamic blocks that adapt to their content size and by frontend filters.'
          link: '#'
          name: 'Item 1'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: 'Content Tabs'
          desc: 'A particle to display tabbed content, with configurable tab positions, either top, bottom, left or right.'
          link: '#'
          name: 'Item 2'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: Headlines
          desc: 'The Headlines particle displays content in a news ticket type format, rotating through content snippets.'
          link: '#'
          name: 'Item 3'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: Lists
          desc: 'The Lists particle displays content in a vertical format, either statically or dynamically through an accordion effect.'
          link: '#'
          name: 'Item 4'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: Slider
          desc: 'The Slider particle displays image focused content as a slideshow or in a more robust showcase type format.'
          link: '#'
          name: 'Item 5'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: Strips
          desc: 'The Strips particle displays content in horizontal rows, which can be stacked in a grid type format, and are pageable.'
          link: '#'
          name: 'Item 6'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: 'Custom UI'
          desc: 'The Layout Manager provides several options for setting up the layout of the theme''s Outlines.'
          link: '#'
          name: 'Item 7'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: Responsive
          desc: 'Vermilion is built with a responsive layout, which means it automatically adapts to the viewing device.'
          link: '#'
          name: 'Item 8'
        -
          image: 'genesis-media://home/fp-expandedbottom/img-01.jpg'
          title: Docs
          desc: 'Genesis benefits from an extensive catalog of online and free documentation covering several topics.'
          link: '#'
          name: 'Item 9'
    block:
      class: 'rt-title-large fp-expandedbottom'
      variations: center
  slider-6732:
    attributes:
      class: ''
      title: ''
      description: ''
      animateIn: fadeIn
      animateOut: fadeOut
      nav: disabled
      dots: enabled
      loop: disabled
      autoplay: disabled
      autoplaySpeed: ''
      pauseOnHover: enabled
      items:
        -
          image: 'genesis-media://home/fp-mainbottom/img-01.jpg'
          title: '<span class="fa fa-trophy"></span>'
          desc: '<span>Take advantage of the uniquely powerful Genesis Color Picker<span class="hidden-phone hidden-tablet"> and change your theme’s color scheme in seconds. Adjust color, saturation, hue, and transparency quickly and easily</span>.</span>'
          link: '#'
          linktext: ''
          buttontarget: _self
          buttonclass: ''
          name: 'Item 1'
        -
          image: 'genesis-media://home/fp-mainbottom/img-01.jpg'
          title: '<span class="fa fa-tasks"></span>'
          desc: '<span>Font Awesome icons are awesome<span class="hidden-phone hidden-tablet">, and they’re supported natively in Topaz. Use Genesis’s powerful Icon Picker to easily add icons to menus, particles, and more</span>.</span>'
          link: '#'
          linktext: ''
          buttontarget: _self
          buttonclass: readon
          name: 'Item 2'
        -
          image: 'genesis-media://home/fp-mainbottom/img-01.jpg'
          title: '<span class="fa fa-arrows-alt"></span>'
          desc: '<span>Want to pick the perfect font for your content? <span class="hidden-phone hidden-tablet">Select from hundreds of fonts in the Google Font Library with Genesis’s Font Picker. Powered by Genesis.</span></span>'
          link: '#'
          linktext: ''
          buttontarget: _self
          buttonclass: readon
          name: 'Item 3'
    block:
      class: fp-mainbottom
      variations: 'nomarginall nopaddingall'
  contenttabs-9016:
    title: 'Content Tabs'
    attributes:
      items:
        -
          title: Setup
          linklabel: ''
          link: ''
          content: "<div class=\"rt-icon-badge rt-badge-left\">\t<a href=\"#\"><span class=\"fa fa-cogs\"></span></a></div><h2 class=\"title\">\t<a href=\"#\">RocketLauncher</a></h2><p>\tA RocketLauncher is a custom, full Joomla package that installs a near equivalent of the demo onto your server.</p><p class=\"hidden-tablet hidden-phone\">\tThis option allows you to check exactly how the demo is constructed.</p><div class=\"clear\"></div><div class=\"rt-icon-badge rt-badge-left\">\t<a href=\"#\"><span class=\"fa fa-cloud-upload\"></span></a></div><h2 class=\"title\">\t<a href=\"#\">Documentation</a></h2><p>\tIn addition, Vermilion has free online guides to assist in setting up the template on your site.</p><p>\t<a href=\"https://dazzlesoftware.org/docs/joomla/templates/vermilion\" class=\"readon3\">Read More</a></p><div class=\"clear\"></div>"
          name: Setup
        -
          title: Addons
          linklabel: ''
          link: ''
          content: "<div class=\"rt-icon-badge rt-badge-left\">\t<a href=\"#\"><span class=\"fa fa-paste\"></span></a></div><h2 class=\"title\">\t<a href=\"#\">Image Sources</a></h2><p>\tVermilion is bundled with Adobe&reg; Fireworks PNG Sources, which are layered and edible, for customizing.</p><p class=\"hidden-tablet hidden-phone\">\tThe sources are available to all active club members or Vermilion purchasers.</p><div class=\"clear\"></div><div class=\"rt-icon-badge rt-badge-left\">\t<a href=\"#\"><span class=\"fa fa-dashboard\"></span></a></div><h2 class=\"title\">\t<a href=\"#\">Extensions</a></h2><p>\tAll Dazzle Software Extensions for Vermilion are free and can be downloaded separately.</p><p>\t<a href=\"#\" class=\"readon3\">Read More</a></p><div class=\"clear\"></div>"
          name: Addons
        -
          title: Extras
          linklabel: ''
          link: ''
          content: "<div class=\"rt-icon-badge rt-badge-left\">\t<a href=\"#\"><span class=\"fa fa-clock-o\"></span></a></div><h2 class=\"title\">\t<a href=\"#\">Coming Soon/Offline</a></h2><p>\tStylistically integrated custom designed Offline or Coming Soon, with a configurable time counter, are available.</p><p class=\"hidden-tablet hidden-phone\">\tThe sources are available to all active club members or Vermilion purchasers.</p><div class=\"clear\"></div><div class=\"rt-icon-badge rt-badge-left\">\t<a href=\"#\"><span class=\"fa fa-bar-chart-o\"></span></a></div><h2 class=\"title\">\t<a href=\"#\">ChartJS</a></h2><p>\tCreate exquisite graphical charts using HTML5 and Chart.js, which is built-in with Vermilion.</p><p>\t<a href=\"#\" class=\"readon3\">Read More</a></p><div class=\"clear\"></div>"
          name: Extras
    block:
      class: fp-extension-a
  lists-5875:
    attributes:
      class: ''
      title: 'More Features'
      description: ''
      displayitems: '4'
      accordion: enabled
      nav: disabled
      dots: disabled
      autoplay: disabled
      autoplaySpeed: ''
      pauseOnHover: enabled
      items:
        -
          title: 'Grid System'
          desc: 'The module layout is split into rows of up to 6 grid blocks. Each grid block has per page width controls.'
          link: ''
          name: 'Grid System'
        -
          title: 'Custom Interface'
          desc: 'Controlled via an advanced user interface, with tabs, toggles, sliders and modals, to allow easy configuration.'
          link: ''
          name: 'Custom Interface'
        -
          title: 'Built-in Features'
          desc: 'Features are self contained elements of functionality. They can easily hook into a Genesis template.'
          link: ''
          name: 'Built-in Features'
        -
          title: 'Top Notch Support'
          desc: 'Community forum support as well as publicly available online documentation, to assist and guide.'
          link: ''
          name: 'Top Notch Support'
    block:
      class: fp-extension-b
  custom-6774:
    title: 'FP Bottom'
    attributes:
      title: 'More Details'
      titletag: 'Please Get in Touch to Know More About Vermilion'
      html: ''
      twig: '0'
      filter: '0'
    block:
      class: rt-title-large
      variations: center
  custom-5916:
    title: 'FP Footer A'
    attributes:
      title: ''
      titletag: ''
      html: "<div class=\"rt-icon-badge rt-badge-left\">\_</div>\n<h2 class=\"title\"><a href=\"#\">Demo Info</a></h2>\n<p>All demo content is for sample purpose only. All content images have been sourced from <a href=\"http://unsplash.com/\">Unsplash</a> or <a href=\"http://flickr.com\">Flickr</a>. <a href=\"https://dazzlesoftware.org/joomla/themes/vermilion\">Click for Attribution</a>.</p>\n<p>Please use the <a href=\"https://dazzlesoftware.org/joomla/themes/vermilion\">Vermilion RocketLauncher</a> to install an equivalent of the demo.</p>"
      twig: '0'
      filter: '0'
    block:
      class: fp-footer-a
  mailchimp-6273:
    title: MailChimp
    attributes:
      layout: g-newsletter-aside
      link: '#'
      icon: 'fa fa-copy'
      title: 'Sample Pages'
      headtext: 'See a range of example pages and layouts, that are possible with the Vermilion template.'
      inputboxtext: 'Your Email'
      error: '#2d3945'
      buttontext: Join
      buttonclass: readon
    block:
      class: fp-footer-b

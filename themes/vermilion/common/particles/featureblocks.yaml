name: Feature Blocks
description: Display feature blocks.
type: particle
icon: fa-th-large

configuration: 
  caching:
    type: config_matches
    values:
      twig: '0'
      filter: '0'

form:
  overrideable: false  
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable the particle.
      default: true

    cols:
      type: select.select
      label: Grid Column
      description: Select the grid column amount
      placeholder: 'Select...'
      default: 25
      options:
        50: 2 Columns
        33: 3 Columns
        25: 4 Columns

    items:
      type: collection.list
      array: true
      label: Items
      description: Create each item for Feature Blocks.
      value: name
      ajax: true

      fields:
        .image:
          type: input.imagepicker
          label: Image
          description: Select desired image.
        .imagealt:
          type: input.text
          label: Image Alt
          description: Enter image alt text
        .animation:
          type: select.select
          label: Animation
          description: Select animation.
          default: 1
          options:
            1: Animation 1
            2: Animation 2
            3: Animation 3
            4: Animation 4
        .overlaytitle:
          type: input.text
          label: Overlay Title
          description: Customize the title text.
          placeholder: Enter overlay title        
        .overlaydesc:
          type: textarea.textarea
          label: Overlay Desc
          description: Enter overlay description into here.
        .link:
          type: input.text
          label: Link
          description: Customize the link.
        .icon:
          type: input.icon
          label: Icon
          description: Pick an icon.
        .title:
          type: input.text
          label: Title
          description: Customize the title text.
          placeholder: Enter title        
        .desc:
            type: textarea.textarea
            label: Description
            description: Enter description into here.

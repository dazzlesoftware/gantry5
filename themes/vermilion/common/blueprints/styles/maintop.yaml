name: MainTop Colors
description: MainTop colors for the Vermilion theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#df392e"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://backgrounds/maintop/background.jpg"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#ffffff"

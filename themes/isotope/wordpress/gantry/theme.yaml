details:
  name: Isotope
  version: '1.5.0'
  icon: paper-plane
  date: 'December  2, 2021'
  author:
    name: Dazzle Software, LLC
    email: support@dazzlesoftware.org
    link: https://dazzlesoftware.org

  documentation:
    link: http://docs.gantry.org/gantry5

  support:
    link: https://gitter.im/gantry/gantry5

  updates:
    link: http://updates.rockettheme.com/themes/isotope.yaml

  copyright: Copyright (C) 2026 Dazzle Software, LLC
  license: GPLv2
  description: Isotope Theme
  images:
    thumbnail: admin/images/preset1.png
    preview: admin/images/preset1.png

configuration:
  gantry:
    platform: wordpress
    engine: nucleus

  theme:
    parent: g5_isotope
    base: gantry-theme://common
    file: 'gantry-theme://includes/theme.php'
    class: '\Gantry\Framework\Theme'
    textdomain: g5_isotope

  fonts:
    sourcesanspro:
      900: 'gantry-theme://fonts/sourcesanspro/sourcesanspro-black/sourcesanspro-black-webfont'
      900italic: 'gantry-theme://fonts/sourcesanspro/sourcesanspro-blackitalic/sourcesanspro-blackitalic-webfont'    
      700: 'gantry-theme://fonts/sourcesanspro/sourcesanspro-bold/sourcesanspro-bold-webfont'
      700italic: 'gantry-theme://fonts/sourcesanspro/sourcesanspro-bolditalic/sourcesanspro-bolditalic-webfont'
      400italic: 'gantry-theme://fonts/sourcesanspro/sourcesanspro-italic/sourcesanspro-italic-webfont'
      400: 'gantry-theme://fonts/sourcesanspro/sourcesanspro-regular/sourcesanspro-regular-webfont'
    goudybookletter1911:
      900: 'gantry-theme://fonts/goudybookletter1911/goudybookletter1911-regular/goudybookletter1911-regular-webfont'
      900italic: 'gantry-theme://fonts/goudybookletter1911/goudybookletter1911-regular/goudybookletter1911-regular-webfont'
      700: 'gantry-theme://fonts/goudybookletter1911/goudybookletter1911-regular/goudybookletter1911-regular-webfont'
      700italic: 'gantry-theme://fonts/goudybookletter1911/goudybookletter1911-regular/goudybookletter1911-regular-webfont'
      400italic: 'gantry-theme://fonts/goudybookletter1911/goudybookletter1911-regular/goudybookletter1911-regular-webfont'
      400: 'gantry-theme://fonts/goudybookletter1911/goudybookletter1911-regular/goudybookletter1911-regular-webfont'

  css:
    compiler: \Gantry\Component\Stylesheet\ScssCompiler
    options:
      compatibility: '5.5'
      deprecations: true
    target: gantry-theme://css-compiled
    paths:
      - gantry-theme://scss
      - gantry-engine://scss
    files:
      - isotope
      - isotope-wordpress
      - custom
    persistent:
      - isotope
    overrides:
      - isotope-wordpress
      - custom

  section-variations: 
    Padding Variations:
      section-vertical-paddings: Section Vertical Paddings
      section-horizontal-paddings: Section Horizontal Paddings
      section-vertical-paddings-large: Large Vertical Paddings
      section-horizontal-paddings-large: Large Horizontal Paddings
      section-vertical-paddings-small: Small Vertical Paddings
      section-horizontal-paddings-small: Small Horizontal Paddings
      largemarginall: Large Margin All
      largepaddingall: Large Padding All
      largemargintop: Large Margin Top
      largepaddingtop: Large Padding Top
      largemarginbottom: Large Margin Bottom
      largepaddingbottom: Large Padding Bottom
      largemarginleft: Large Margin Left
      largepaddingleft: Large Padding Left
      largemarginright: Large Margin Right
      largepaddingright: Large Padding Right
      medmarginall: Medium Margin All
      medpaddingall: Medium Padding All
      medmargintop: Medium Margin Top
      medpaddingtop: Medium Padding Top
      medmarginbottom: Medium Margin Bottom
      medpaddingbottom: Medium Padding Bottom
      medmarginleft: Medium Margin Left
      medpaddingleft: Medium Padding Left
      medmarginright: Medium Margin Right
      medpaddingright: Medium Padding Right
      smallmarginall: Small Margin All
      smallpaddingall: Small Padding All
      smallmargintop: Small Margin Top
      smallpaddingtop: Small Padding Top
      smallmarginbottom: Small Margin Bottom
      smallpaddingbottom: Small Padding Bottom
      smallmarginleft: Small Margin Left
      smallpaddingleft: Small Padding Left
      smallmarginright: Small Margin Right
      smallpaddingright: Small Padding Right
    Remove Padding / Margin:
      nomarginall: No Margin All
      nopaddingall: No Padding All
      nomargintop: No Margin Top 
      nopaddingtop: No Padding Top 
      nomarginbottom: No Margin Bottom
      nopaddingbottom: No Padding Bottom
      nomarginleft: No Margin Left
      nopaddingleft: No Padding Left
      nomarginright: No Margin Right 
      nopaddingright: No Padding Right        

  block-variations:
    Title Variations:
      title1: Title 1
      title2: Title 2
      title3: Title 3
      title4: Title 4
      title-grey       : Title Grey
      title-pink       : Title Pink
      title-red        : Title Red
      title-purple     : Title Purple
      title-orange     : Title Orange
      title-blue       : Title Blue
      title-underline  : Title Underline
      title-inline     : Title Inline
      title-rounded    : Title Rounded
      g-title-bordered : Title Bordered
      g-title-promo    : Title Promo
    Box Variations:
      box1: Box 1
      box2: Box 2
      box3: Box 3
      box4: Box 4
      box-white   : Box White
      box-grey    : Box Grey
      box-pink    : Box Pink
      box-red     : Box Red
      box-purple  : Box Purple
      box-orange  : Box Orange
      box-blue    : Box Blue
    Effects:
      spaced 			: Spaced
      bordered    : Bordered
      shadow      : Shadow 1
      shadow2     : Shadow 2
      rounded     : Rounded
      square      : Square
    Utility:
      equal-height: Equal Height
      g-outer-box: Outer Box
      disabled: Disabled
      align-right: Align Right
      align-left: Align Left
      title-center: Centered Title
      center: Center
      largemarginall: Large Margin All
      largepaddingall: Large Padding All
      largemargintop: Large Margin Top
      largepaddingtop: Large Padding Top
      largemarginbottom: Large Margin Bottom
      largepaddingbottom: Large Padding Bottom
      largemarginleft: Large Margin Left
      largepaddingleft: Large Padding Left
      largemarginright: Large Margin Right
      largepaddingright: Large Padding Right
      medmarginall: Medium Margin All
      medpaddingall: Medium Padding All
      medmargintop: Medium Margin Top
      medpaddingtop: Medium Padding Top
      medmarginbottom: Medium Margin Bottom
      medpaddingbottom: Medium Padding Bottom
      medmarginleft: Medium Margin Left
      medpaddingleft: Medium Padding Left
      medmarginright: Medium Margin Right
      medpaddingright: Medium Padding Right
      smallmarginall: Small Margin All
      smallpaddingall: Small Padding All
      smallmargintop: Small Margin Top
      smallpaddingtop: Small Padding Top
      smallmarginbottom: Small Margin Bottom
      smallpaddingbottom: Small Padding Bottom
      smallmarginleft: Small Margin Left
      smallpaddingleft: Small Padding Left
      smallmarginright: Small Margin Right
      smallpaddingright: Small Padding Right
    Remove Padding / Margin:  
      nomarginall: No Margin All
      nopaddingall: No Padding All
      nomargintop: No Margin Top 
      nopaddingtop: No Padding Top 
      nomarginbottom: No Margin Bottom
      nopaddingbottom: No Padding Bottom
      nomarginleft: No Margin Left
      nopaddingleft: No Padding Left
      nomarginright: No Margin Right 
      nopaddingright: No Padding Right

admin:
  styles:
    core:
      - base
      - accent
      - font
    section:
      - top
      - navigation
      - header
      - showcase
      - above
      - utility
      - feature
      - sidebar
      - mainbar
      - aside
      - expanded
      - extension
      - bottom
      - footer
      - copyright
      - offcanvas
    configuration:
      - breakpoints

chrome:
  gantry:
    before_widget: '<div id="%1$s" class="widget %2$s">'
    after_widget: '</div>'
    before_title: '<h3 class="widgettitle g-title">'
    after_title: '</h3>'

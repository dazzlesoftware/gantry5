      - 'position-utility-a 4'
      - 'position-utility-b 4'
      - 'position-utility-c 4'
  /feature/:
    -
      - 'position-feature-a 4'
      - 'position-feature-b 4'
      - 'position-feature-c 4'
  /container-main/:
    -
      -
        'sidebar 2':
          -
            - position-sidebar
      -
        'mainbar 7':
          -
            - 'position-mainbar-a 4'
            - 'position-mainbar-b 4'
            - 'position-mainbar-c 4'
          -
            - system-content-5020
      -
        'aside 2':
          -
            - position-aside
  /expanded/:
    -
      - 'position-expanded-a 4'
      - 'position-expanded-b 4'
      - 'position-expanded-c 4'
  /extension/:
    -
      - 'position-extension-a 4'
      - 'position-extension-b 4'
      - 'position-extension-c 4'
  /bottom/:
    -
      - 'position-bottom-a 4'
      - 'position-bottom-b 4'
      - 'position-bottom-c 4'
  /footer/:
    -
      - 'position-footer-a 3'
      - 'position-footer-b 3'
      - 'position-footer-c 3'
      - 'position-footer-d 3'
  /copyright/:
    -
      - 'branding-3018 4'
      - 'copyright-5323 4'
      - 'totop-8334 4'
  /offcanvas/:
    -
      - mobile-menu-8402

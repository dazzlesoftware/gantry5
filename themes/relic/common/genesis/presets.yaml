preset1:
  image: 'genesis-admin://images/preset1.png'
  description: 'Preset 1'
  colors:
    - '#58bd91'
    - '#14151e'
    - '#17a387'
  styles:
    base:
      background: '#14151e'
      background-image: 'genesis-media://backgrounds/base/img-01.jpg'
      text-color: '#4f5056'
    accent:
      color-1: '#58bd91'
      color-2: '#14151e'
      color-3: '#17a387'
    menustyle:
      text-color: '#ffffff'
      text-color-active: '#ffffff'
      active-background: '#14151e'
      sublevel-text-color: 'rgba(255, 255, 255, 0.5)'
      sublevel-text-color-active: '#ffffff'
      sublevel-background: '#14151e'
    font:
      family-default: 'sourcesanspro, Helvetica, Tahoma, Geneva, Arial, sans-serif'

      background: 'rgba(0,0,0, 0.0)'
      text-color: '#ffffff'
    slideshow:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#ffffff'
    header:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    above:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    showcase:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    utility:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    feature:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    main:
      background: '#ffffff'
      text-color: '#888888'
    expanded:
      background: '#ffffff'
      text-color: '#888888'
    extension:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    bottom:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    footer:
      background: 'rgba(0,0,0, 0.0)'
      text-color: '#4f5056'
    copyright:
      background: '#000000'
      text-color: '#87888e'
    offcanvas:
      background: '#000000'
      text-color: '#87888e'
      toggle-color: '#ffffff'
    breakpoints:
      large-desktop-container: 75rem
      desktop-container: 60rem
      tablet-container: 48rem
      large-mobile-container: 30rem
      mobile-menu-breakpoint: 48rem

name: Content Tabs
description: Display Content Tabs.
type: particle
icon: fa-table

configuration:
  caching:
    type: static

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particles.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    title:
      type: input.text
      label: Title
      description: Customize the title text.
      placeholder: Enter title

    animation:
      type: select.select
      label: Animation Type
      description: Set the animation type.
      default: slide
      options:
        slide: Slide
        fade: Fade

    items:
      type: collection.list
      array: true
      label: ContentTabs Items
      description: Create each ContentTabs item to display.
      value: name
      ajax: true

      fields:
        .tabname:
          type: input.text
          label: Tab Name
          description: Enter the Tab name (Each tab must have unique name)       
        .subtitle:
          type: input.text
          label: Subtitle
          description: Enter the Subtitle      
        .title:
          type: input.text
          label: Title
          description: Enter the title  
        .desc:
          type: textarea.textarea
          label: Description
          description: Customize the description.
          placeholder: Enter short description
        .tag:
          type: input.text
          label: Tag
          description: Enter the tag
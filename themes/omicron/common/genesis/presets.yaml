preset1:
  image: 'genesis-admin://images/preset1.png'
  description: 'Preset 1'
  colors:
    - '#fb6058'
    - '#fab561'
  styles:    
    base:
      background: '#ffffff'
      text-color: '#6e6e6e'
    accent:
      color-1: '#fb6058'
      color-2: '#fab561'
    font:
      family-light: 'sourcesanspro-light, Verdana, Helvetica, Arial, sans-serif'
      family-regular: 'sourcesanspro-regular, Verdana, Helvetica, Arial, sans-serif'
      family-semibold: 'sourcesanspro-semibold, Verdana, Helvetica, Arial, sans-serif'
      family-bold: 'sourcesanspro-bold, Verdana, Helvetica, Arial, sans-serif'
    navigation:
      background: '#eae6e5'
      text-color: '#898788'
    showcase:
      background: '#eae6e5'
      text-color: '#898788' 
    top:
      background: '#fb6058'
      text-color: '#efefef' 
      background-image: 'genesis-media://patterns/poly.png' 
    utility:
      background: '#eae6e5'
      text-color: '#898788'      
    feature:
      background: '#ffffff'
      text-color: '#aaa8a9'
    maintop:
      background: '#fb6058'
      text-color: '#efefef'
      background-image: 'genesis-media://patterns/poly.png'
    expandedtop:
      background: '#edeced'
      text-color: '#818181' 
    expandedbottom:
      background: '#edeced'
      text-color: '#818181'
    extension:
      background: '#ffffff'
      text-color: '#aaa8a9'
    bottom:
      background: '#eae6e5'
      text-color: '#898788'
    footer:
      background: '#323337'
      text-color: '#9f9fa1'
      background-image: 'genesis-media://patterns/poly.png'
    copyright:
      background: '#323337'
      text-color: '#9f9fa1'
    offcanvas:
      background: '#efefef'
      text-color: '#fb6058'
      toggle-color: '#fb6058'


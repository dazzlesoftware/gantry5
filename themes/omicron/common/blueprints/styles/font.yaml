name: Font Families
description: Font families for the Omicron theme
type: core

form:
  fields:

    family-light:
      type: input.fonts
      label: Light Font
      default: 'sourcesanspro-light, Verdana, Helvetica, Arial, sans-serif'
    family-regular:
      type: input.fonts
      label: Regular Font
      default: 'sourcesanspro-regular, Verdana, Helvetica, Arial, sans-serif'
    family-semibold:
      type: input.fonts
      label: Semibold Font
      default: 'sourcesanspro-semibold, Verdana, Helvetica, Arial, sans-serif'
    family-bold:
      type: input.fonts
      label: Bold Font
      default: 'sourcesanspro-bold, Verdana, Helvetica, Arial, sans-serif'
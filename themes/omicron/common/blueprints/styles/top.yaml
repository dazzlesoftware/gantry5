name: Top Colors
description: Top colors for the Omicron theme
type: section

form:
  fields:

    background:
      type: input.colorpicker
      label: Background
      default: "#fb6058"
    text-color:
      type: input.colorpicker
      label: Text
      default: "#efefef"
    background-image:
      type: input.imagepicker
      label: Background Image
      default: "genesis-media://patterns/poly.png"

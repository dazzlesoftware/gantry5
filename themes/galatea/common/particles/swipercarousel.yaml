name: Swiper Carousel
description: Display a responsive carousel powered by Swiper.
type: particle
category: slider
icon: fa-sliders

configuration:
  caching:
    type: static

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      default: true
    class:
      type: input.selectize
      label: CSS Classes
    title:
      type: input.text
      label: Title
      placeholder: Enter title
    width:
      type: select.select
      label: Width
      default: g-swipercarousel-fullwidth
      options:
        g-swipercarousel-fullwidth: Full Width
        g-swipercarousel-compact: Compact
    effect:
      type: select.select
      label: Transition Effect
      default: fade
      options:
        fade: Fade
        slide: Slide
    transitionSpeed:
      type: input.number
      label: Transition Speed
      description: Transition duration in milliseconds.
      default: 500
      min: 0
    nav:
      type: select.select
      label: Previous / Next
      default: 1
      options:
        1: Enable
        0: Disable
    prevText:
      type: input.text
      label: Previous Text
      placeholder: '&larr;'
    nextText:
      type: input.text
      label: Next Text
      placeholder: '&rarr;'
    dots:
      type: select.select
      label: Pagination
      default: 0
      options:
        1: Enable
        0: Disable
    loop:
      type: select.select
      label: Loop
      default: 1
      options:
        1: Enable
        0: Disable
    autoplay:
      type: select.select
      label: Autoplay
      default: 0
      options:
        1: Enable
        0: Disable
    autoplaySpeed:
      type: input.number
      label: Autoplay Delay
      description: Delay between slides in milliseconds.
      default: 5000
      min: 1000
    pauseOnHover:
      type: select.select
      label: Pause on Hover
      default: 1
      options:
        1: Enable
        0: Disable
    footerShadow:
      type: select.select
      label: Footer Shadow
      default: 1
      options:
        1: Enable
        0: Disable
    footerShadowColor:
      type: input.colorpicker
      label: Footer Shadow Color
      default: '#20232a'
    items:
      type: collection.list
      array: true
      label: Carousel Items
      description: Create each carousel slide.
      value: name
      ajax: true
      fields:
        .image:
          type: input.imagepicker
          label: Background Image
        .title:
          type: input.text
          label: Title
        .desc:
          type: textarea.textarea
          label: Description
        .link:
          type: input.text
          label: Link
        .linktext:
          type: input.text
          label: Link Text
        .buttontarget:
          type: select.selectize
          label: Target
          default: _self
          options:
            _self: Self
            _blank: New Window
        .buttonclass:
          type: input.text
          label: Button Class

  custom-9066:
    title: 'Left Sidebar'
    attributes:
      html: "<h3 class=\"g-title\">Left Sidebar</h3>\n<p>A left column layout example. The sidebar is independent from the Mainbody so can have multiple rows and columns, separate from the Mainbody area.</p>"
    block:
      class: 'nomargintop padding3x'
      variations: box3
  custom-9563:
    title: 'Flexible Layouts'
    attributes:
      html: " <h3 class=\"g-title\">Flexible Layouts</h3>\n\n<p>Gantry 5 benefits from a flexible and intuitive, drag &amp; drop layout manager. You can add as many rows and blocks to each section as you desire, and configure their distance to intervals of 1%.</p>\n\n<p>Each block has individual controls, such as an autocomplete select box for box variations, as well as individual CSS fields.</p>"
    block:
      variations: box2

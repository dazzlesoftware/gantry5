    title: 'Custom HTML'
    attributes:
      html: "<div class=\"page-header nomarginbottom nopaddingbottom\">\n  <h2 class=\"nomarginbottom nopaddingbottom\">\n    <a href=\"#\">Row &amp; Column Examples</a>\n  </h2>\n</div>\n<div class=\"entry-meta muted\">\n  <div class=\"meta-author\">Written by <a href-\"author\">Author</a></div>\n  <div class=\"meta-date\">Published: 01 January 2011</div>\n</div>\n<p class=\"g-lead nomarginbottom\"><span class=\"g-shadow-letter\">G</span>&nbsp;antry provides an intuitive, drag and drop interface for constructing layouts. Each section benefits from unlimited rows and up to 20 columns, although a maximum of 4-6 is recommended.</p>\n<h1 class=\"nomarginbottom\">Equal Width Examples</h1>"

atoms:
  -
    type: assets
    title: 'Custom CSS / JS'
    attributes:
      enabled: '1'
      css:
        - { location: 'gantry-assets://css/demo.css', inline: '', extra: {  }, name: 'Demo CSS' }
        - { location: 'gantry-assets://css/animate.css', inline: '', extra: {  }, name: 'Animate CSS' }
      javascript:
        - { location: 'gantry-assets://js/jui/jquery.min.js', inline: '', in_footer: '0', extra: {  }, name: jQuery }
  -
    type: frameworks
    title: 'JavaScript Frameworks'
    attributes:
      enabled: '1'
      jquery:
        enabled: '1'
        ui_core: '0'
        ui_sortable: '0'
      bootstrap:
        enabled: '1'
      mootools:
        enabled: '0'
        more: '0'

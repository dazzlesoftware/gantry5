name: JavaScript Frameworks
description: Loads selected frameworks for the page.
type: atom
icon: far fa-file-code

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable Frameworks atom.
      default: true

    _info:
      type: separator.note
      class: alert alert-info
      content: '<strong>TIP</strong>: Enable Bootstrap only when it is required by your own particles or content.'

    bootstrap:
      type: container.set
      label: Bootstrap
      fields:
        .enabled:
          type: enable.enable
          label: Framework
          default: 0

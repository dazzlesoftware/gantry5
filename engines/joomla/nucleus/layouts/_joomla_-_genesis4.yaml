version: 3

preset:
  image: genesis-admin://images/layouts/3-col.png

layout:
  /drawer/:
    - [position-drawer 12]

  /top/:
    - [position-top-a 4,position-top-b 4,position-top-c 4]

  /navigation/:
    - [position-header-a 4, menu 8]

  /showcase/:
    - [position-showcase-a 4,position-showcase-b 4,position-showcase-c 4]

  /feature/:
    - [position-feature-a 4,position-feature-b 4,position-feature-c 4]

  /utility/:
    - [position-utility-a 4,position-utility-b 4,position-utility-c 4]

  /breadcrumb/:
    - [position-breadcrumb 12]

  /maintop/:
    - [position-maintop-a 4,position-maintop-b 4,position-maintop-c 4]

  /container-main/:
    -
      - main-mainbody 10:
        - system-messages
        - [position-content-top-a 4,position-content-top-b 4,position-content-top-c 4]
        - system-content
        - [position-content-bottom-a 4,position-content-bottom-b 4,position-content-bottom-c 4]
      - sidebar 2:
        - position-sidebar-a
        - position-sidebar-b
        - position-sidebar-c

  /mainbottom/:
    - [position-mainbottom-a 4,position-mainbottom-b 4,position-mainbottom-c 4]

  /extension/:
    - [position-extension-a 4,position-extension-b 4,position-extension-c 4]

  /bottom/:
    - [position-bottom-a 4,position-bottom-b 4,position-bottom-c 4]

  /footer/:
    - [position-footer-a 4,position-footer-b 4,position-footer-c 4]

  /copyright/:
    - [position-copyright-a 4,position-copyright-b 4,position-copyright-c 4]
    - [copyright 5, spacer 4, branding 3]

  offcanvas:
    - mobile-menu

structure:
  sidebar:
    subtype: aside
    block:
      fixed: 1

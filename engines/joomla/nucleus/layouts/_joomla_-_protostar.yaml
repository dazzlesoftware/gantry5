version: 3

preset:
  image: genesis-admin://images/layouts/3-col.png

layout:
  /header/:
    - [logo 6, position-0 6]

  /navigation/:
    - menu

  /container-main/:
    -
      - sidebar 2:
        - position-8
      - main 8:
        - position-3
        - system-messages
        - system-content
        - position-2
      - aside 2:
        - position-7

  /footer/:
    - position-footer
    - [copyright 5, spacer 4, branding 3]

  offcanvas:
    - mobile-menu

structure:
  sidebar:
    subtype: aside
    block:
      fixed: 1
  aside:
    block:
      fixed: 1

name: Icon
description: Display a configurable linked icon.
type: particle
category: media
icon: fa-star
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    class: {type: input.selectize, label: CSS Classes}
    icon: {type: input.icon, label: Override Icon, default: 'fa fa-star'}
    link: {type: input.text, label: Link}
    target: {type: select.select, label: Link Target, default: _self, options: {_self: Same Window, _blank: New Window}}
    arialabel: {type: input.text, label: Aria Label, default: Icon link}
    alignment: {type: select.select, label: Override Alignment, default: center, options: {left: Left, center: Center, right: Right}}
    iconsize: {type: input.number, label: Override Icon Size, min: 1, default: 48}
    width: {type: input.number, label: Override Container Width, min: 1, default: 80}
    height: {type: input.number, label: Override Container Height, min: 1, default: 80}
    color: {type: input.colorpicker, label: Override Icon Color, default: '#3366ff'}
    background: {type: input.colorpicker, label: Override Background Color, default: 'rgba(0,0,0,0)'}
    borderwidth: {type: input.number, label: Override Border Width, min: 0, default: 0}
    bordercolor: {type: input.colorpicker, label: Override Border Color, default: '#3366ff'}
    radius: {type: input.number, label: Override Border Radius, min: 0, default: 0}
    rotate: {type: input.number, label: Rotation, description: Rotation in degrees., default: 0}
    hovercolor: {type: input.colorpicker, label: Override Hover Icon Color, default: '#ffffff'}
    hoverbackground: {type: input.colorpicker, label: Override Hover Background, default: '#3366ff'}
    hoverbordercolor: {type: input.colorpicker, label: Override Hover Border Color, default: '#3366ff'}
    hoverscale: {type: input.number, label: Hover Scale, min: 0.1, step: 0.1, default: 1}
    margin: {type: input.text, label: Override Margin, description: CSS margin value., default: '0'}

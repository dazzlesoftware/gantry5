name: Modal Popup
description: Open text, image, or video content from a button, image, or icon trigger.
type: particle
category: general
icon: fa-window-maximize
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    class: {type: input.selectize, label: CSS Classes}
    trigger: {type: select.select, label: Trigger Type, default: button, options: {button: Button, image: Image, icon: Icon}}
    label: {type: input.text, label: Trigger Label, default: 'Launch Modal'}
    alignment: {type: select.select, label: Trigger Alignment, default: left, options: {left: Left, center: Center, right: Right}}
    buttonstyle: {type: select.select, label: Bootstrap Button Style, default: custom, options: {primary: Primary, secondary: Secondary, success: Success, info: Info, warning: Warning, danger: Danger, dark: Dark, light: Light, link: Link, custom: Custom}}
    buttonappearance: {type: select.select, label: Button Appearance, default: flat, options: {flat: Flat, outline: Outline}}
    buttonsize: {type: select.select, label: Button Size, default: default, options: {default: Default, sm: Small, lg: Large, custom: Custom}}
    buttonfullwidth: {type: select.select, label: Full Width Button, default: disable, options: {enable: Enable, disable: Disable}}
    buttonfont: {type: input.fonts, label: Button Font}
    buttonfontsize: {type: input.number, label: Button Font Size, min: 1, default: 16}
    buttonweight: {type: select.select, label: Button Font Weight, default: '400', options: {'300': Light, '400': Normal, '500': Medium, '600': Semi Bold, '700': Bold, '800': Extra Bold}}
    buttonpadding: {type: input.text, label: Custom Button Padding, default: '8px 22px'}
    buttonradius: {type: input.number, label: Button Border Radius, min: 0, default: 4}
    buttoncolor: {type: input.colorpicker, label: Custom Button Text Color, default: '#ffffff'}
    buttonbackground: {type: input.colorpicker, label: Custom Button Background, default: '#3366ff'}
    buttonbordercolor: {type: input.colorpicker, label: Custom Button Border Color, default: '#3366ff'}
    buttonhovercolor: {type: input.colorpicker, label: Custom Button Hover Text Color, default: '#ffffff'}
    buttonhoverbackground: {type: input.colorpicker, label: Custom Button Hover Background, default: '#0037dd'}
    buttonhoverbordercolor: {type: input.colorpicker, label: Custom Button Hover Border Color, default: '#0037dd'}
    buttonicon: {type: input.icon, label: Button Icon}
    buttoniconposition: {type: select.select, label: Button Icon Position, default: left, options: {left: Left, right: Right}}
    buttonicongap: {type: input.number, label: Button Icon Gap, min: 0, default: 8}
    triggerimage: {type: input.imagepicker, label: Trigger Image}
    triggerimagealt: {type: input.text, label: Trigger Image Alternative Text}
    triggerimagewidth: {type: input.number, label: Trigger Image Width, min: 1, default: 320}
    triggerimageheight: {type: input.number, label: Trigger Image Height, min: 1, default: 180}
    triggericon: {type: input.icon, label: Trigger Icon, default: 'fa fa-play'}
    triggericonsize: {type: input.number, label: Trigger Icon Size, min: 1, default: 32}
    triggericoncolor: {type: input.colorpicker, label: Trigger Icon Color, default: '#ffffff'}
    triggericonbackground: {type: input.colorpicker, label: Trigger Icon Background, default: '#3366ff'}
    triggericonpadding: {type: input.number, label: Trigger Icon Padding, min: 0, default: 20}
    triggericonradius: {type: input.number, label: Trigger Icon Border Radius, min: 0, default: 50}
    triggericonborderwidth: {type: input.number, label: Trigger Icon Border Width, min: 0, default: 0}
    triggericonbordercolor: {type: input.colorpicker, label: Trigger Icon Border Color, default: '#3366ff'}
    triggertextsize: {type: input.number, label: Image/Icon Label Size, min: 1, default: 16}
    triggertextcolor: {type: input.colorpicker, label: Image/Icon Label Color, default: '#222222'}
    triggertextgap: {type: input.number, label: Image/Icon Label Gap, min: 0, default: 10}
    ripple: {type: select.select, label: Ripple Effect, default: disable, options: {enable: Enable, disable: Disable}}
    contenttype: {type: select.select, label: Popup Content Type, default: text, options: {text: Text or HTML, image: Image, video: Video}}
    content: {type: textarea.textarea, label: Text or HTML Content, default: '<h3>Modal title</h3><p>Add your modal content here.</p>'}
    image: {type: input.imagepicker, label: Popup Image}
    imagealt: {type: input.text, label: Popup Image Alternative Text}
    videourl: {type: input.text, label: Video URL}
    videotitle: {type: input.text, label: Video Title, default: 'Video'}
    verticalvideo: {type: select.select, label: Vertical Video, default: disable, options: {enable: Enable, disable: Disable}}
    width: {type: input.number, label: Popup Maximum Width, min: 200, default: 900}
    height: {type: input.number, label: Popup Height, min: 0, default: 0}
    overflow: {type: select.select, label: Popup Overflow, default: auto, options: {auto: Auto, visible: Visible, hidden: Hidden, scroll: Scroll}}
    padding: {type: input.number, label: Popup Padding, min: 0, default: 30}
    background: {type: input.colorpicker, label: Popup Background, default: '#ffffff'}
    color: {type: input.colorpicker, label: Popup Text Color, default: '#222222'}
    radius: {type: input.number, label: Popup Border Radius, min: 0, default: 4}
    overlay: {type: input.colorpicker, label: Overlay Color, default: 'rgba(0,0,0,0.8)'}
    closecolor: {type: input.colorpicker, label: Close Icon Color, default: '#333333'}
    closesize: {type: input.number, label: Close Icon Size, min: 1, default: 30}

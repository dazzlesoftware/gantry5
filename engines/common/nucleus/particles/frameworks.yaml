name: JavaScript Frameworks
description: Loads selected frameworks for the page.
type: atom
icon: far fa-file-code

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: 'Globally enable Frameworks atom.'
      default: true

    _info:
      type: separator.note
      class: alert alert-info
      content: 'Bootstrap 5 is enabled by default for core particles and the planned full-Bootstrap theme migration.'

    bootstrap5:
      type: container.set
      label: Bootstrap 5
      fields:
        .enabled:
          type: enable.enable
          label: Framework
          default: 1

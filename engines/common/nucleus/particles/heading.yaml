name: Heading
description: Display a styled, linked heading with an optional icon.
type: particle
category: general
icon: fa-header
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    class: {type: input.selectize, label: CSS Classes}
    text: {type: textarea.textarea, label: Heading Text, default: 'This is a heading'}
    element: {type: select.select, label: HTML Element, default: h3, options: {h1: H1, h2: H2, h3: H3, h4: H4, h5: H5, h6: H6, div: DIV}}
    link: {type: input.text, label: Link}
    target: {type: select.select, label: Link Target, default: _self, options: {_self: Current Window, _blank: New Window}}
    nofollow: {type: input.checkbox, label: No Follow, default: false}
    font: {type: input.fonts, label: Font}
    fontsize: {type: input.number, label: Desktop Font Size, min: 1, default: 32}
    tabletsize: {type: input.number, label: Tablet Font Size, min: 1, default: 30}
    mobilesize: {type: input.number, label: Mobile Font Size, min: 1, default: 26}
    lineheight: {type: input.number, label: Line Height, min: 0.1, step: 0.1, default: 1.2}
    letterspacing: {type: input.number, label: Letter Spacing, default: 0}
    weight: {type: select.select, label: Font Weight, default: '700', options: {'300': Light, '400': Normal, '500': Medium, '600': Semi Bold, '700': Bold, '800': Extra Bold, '900': Black}}
    transform: {type: select.select, label: Text Transform, default: none, options: {none: None, uppercase: Uppercase, lowercase: Lowercase, capitalize: Capitalize}}
    italic: {type: select.select, label: Italic, default: normal, options: {normal: Normal, italic: Italic}}
    decoration: {type: select.select, label: Text Decoration, default: none, options: {none: None, underline: Underline, line-through: Line Through}}
    colortype: {type: select.select, label: Color Type, default: solid, options: {solid: Solid, gradient: Gradient}}
    color: {type: input.colorpicker, label: Text Color, default: '#222222'}
    gradientcolor: {type: input.colorpicker, label: Gradient End Color, default: '#3366ff'}
    gradientangle: {type: input.number, label: Gradient Angle, min: 0, max: 360, default: 90}
    textshadow: {type: input.text, label: Text Shadow, default: 'none'}
    alignment: {type: select.select, label: Alignment, default: left, options: {left: Left, center: Center, right: Right}}
    icon: {type: input.icon, label: Icon}
    iconposition: {type: select.select, label: Icon Position, default: before, options: {before: Before, after: After}}
    iconcolor: {type: input.colorpicker, label: Icon Color, default: '#222222'}
    iconsize: {type: input.number, label: Icon Size, min: 1, default: 28}
    icongap: {type: input.number, label: Icon Gap, min: 0, default: 10}
    margin: {type: input.text, label: Margin, default: '0'}
    padding: {type: input.text, label: Padding, default: '0'}

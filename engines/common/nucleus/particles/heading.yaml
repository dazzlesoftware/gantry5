name: Heading
description: Display a styled, linked heading with an optional icon.
type: particle
category: general
icon: fa-header
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    class: {type: input.selectize, label: CSS Classes}
    text: {type: textarea.textarea, label: Heading Text, default: 'This is a heading'}
    subtitle: {type: textarea.textarea, label: Subtitle, description: Optional secondary line shown below the heading. Leave empty to omit.}
    element: {type: select.select, label: Override HTML Element, default: h3, options: {h1: H1, h2: H2, h3: H3, h4: H4, h5: H5, h6: H6, div: DIV}}
    link: {type: input.text, label: Link}
    target: {type: select.select, label: Link Target, default: _self, options: {_self: Current Window, _blank: New Window}}
    nofollow: {type: input.checkbox, label: No Follow, default: false}
    font: {type: input.fonts, label: Override Font}
    fontsize: {type: input.number, label: Override Desktop Font Size, min: 1, default: 32}
    tabletsize: {type: input.number, label: Override Tablet Font Size, min: 1, default: 30}
    mobilesize: {type: input.number, label: Override Mobile Font Size, min: 1, default: 26}
    lineheight: {type: input.number, label: Override Line Height, min: 0.1, step: 0.1, default: 1.2}
    letterspacing: {type: input.number, label: Override Letter Spacing, default: 0}
    weight: {type: select.select, label: Override Font Weight, default: '700', options: {'300': Light, '400': Normal, '500': Medium, '600': Semi Bold, '700': Bold, '800': Extra Bold, '900': Black}}
    transform: {type: select.select, label: Text Transform, default: none, options: {none: None, uppercase: Uppercase, lowercase: Lowercase, capitalize: Capitalize}}
    italic: {type: select.select, label: Italic, default: normal, options: {normal: Normal, italic: Italic}}
    decoration: {type: select.select, label: Text Decoration, default: none, options: {none: None, underline: Underline, line-through: Line Through}}
    colortype: {type: select.select, label: Override Color Type, default: solid, options: {solid: Solid, gradient: Gradient}}
    color: {type: input.colorpicker, label: Override Text Color, default: '#222222'}
    gradientcolor: {type: input.colorpicker, label: Override Gradient End Color, default: '#3366ff'}
    gradientangle: {type: input.number, label: Gradient Angle, min: 0, max: 360, default: 90}
    textshadow: {type: input.text, label: Override Text Shadow, default: 'none'}
    alignment: {type: select.select, label: Override Alignment, default: left, options: {left: Left, center: Center, right: Right}}
    icon: {type: input.icon, label: Override Icon}
    iconposition: {type: select.select, label: Override Icon Position, default: before, options: {before: Before, after: After}}
    iconcolor: {type: input.colorpicker, label: Override Icon Color, default: '#222222'}
    iconsize: {type: input.number, label: Override Icon Size, min: 1, default: 28}
    icongap: {type: input.number, label: Override Icon Gap, min: 0, default: 10}
    margin: {type: input.text, label: Override Margin, default: '0'}
    padding: {type: input.text, label: Override Padding, default: '0'}

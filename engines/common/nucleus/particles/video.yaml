name: Video
description: Embed videos from YouTube, Vimeo, a local file, or an external URL.
type: particle
category: media
icon: fa-video

configuration:
  caching:
    type: static

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable the particle.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    headertext:
      type: input.text
      label: Header Text
      description: Customize the optional header text.
      placeholder: Enter header text

    title:
      type: input.text
      label: Title
      description: Customize the title text.
      placeholder: Enter title

    description:
      type: textarea.textarea
      label: Description
      description: Customize the optional description text.
      placeholder: Enter description text

    columns:
      type: select.selectize
      label: Columns
      description: Select the number of columns.
      default: 1
      options:
        1: 1 column
        2: 2 columns
        3: 3 columns
        4: 4 columns

    items:
      type: collection.list
      array: true
      label: Videos
      description: Add each video to display.
      value: title
      ajax: true
      fields:
        .caption:
          type: input.text
          label: Caption
          description: Enter the video caption.

        .caption2:
          type: input.text
          label: Secondary Caption
          description: Enter an optional secondary video caption.

        .source:
          type: select.selectize
          label: Source
          description: Select the video source.
          placeholder: Select...
          default: local
          options:
            preset: Slideshow Preset
            vimeo: Vimeo URL
            youtube: YouTube URL
            local: Local Video
            external: External URL

        .video:
          type: input.text
          label: URL
          description: Enter a YouTube, Vimeo, or external video URL.

        .local:
          type: collection.list
          array: true
          label: Local Video Sources
          description: Serve the local video in multiple formats.
          value: title
          ajax: true
          fields:
            .file:
              type: input.videopicker
              label: Local Video
              description: Select the video file.

        .posterimage:
          type: input.imagepicker
          label: Poster Image
          description: Select the poster image for a local or external video.

        .loop:
          type: select.select
          label: Loop
          description: Enable or disable video looping.
          default: enabled
          options:
            enabled: Enable
            disabled: Disable

        .autoplay:
          type: select.select
          label: Autoplay
          description: Enable or disable video autoplay.
          default: enabled
          options:
            enabled: Enable
            disabled: Disable

        .controls:
          type: select.select
          label: Show Controls
          description: Show controls for YouTube, local, and external videos.
          default: disabled
          options:
            enabled: Enable
            disabled: Disable

        .info:
          type: select.select
          label: Show Info (YouTube)
          description: Show the YouTube information bar when supported.
          default: disabled
          options:
            enabled: Enable
            disabled: Disable

        .related:
          type: select.select
          label: Related Videos (YouTube)
          description: Display related videos when a YouTube video is paused or ends.
          default: disabled
          options:
            enabled: Enable
            disabled: Disable

        .muted:
          type: select.select
          label: Muted
          description: Autoplay generally requires the video to be muted.
          default: enabled
          options:
            enabled: Enable
            disabled: Disable

        .start:
          type: input.number
          label: Start Time (YouTube)
          description: Set the YouTube start time in seconds.
          min: 0

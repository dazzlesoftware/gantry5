name: Block Number
description: Display a numbered content block with configurable layout and typography.
type: particle
category: content
icon: fa-list-ol
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    class: {type: input.selectize, label: CSS Classes}
    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    title: {type: input.text, label: Particle Title}
    titleelement: {type: select.select, label: Override Particle Title Element, default: h3, options: {h2: H2, h3: H3, h4: H4, h5: H5, h6: H6}}
    number: {type: input.text, label: Number, default: '01'}
    heading: {type: input.text, label: Heading, default: 'Block heading'}
    text: {type: textarea.textarea, label: Content, default: 'Add your block content here.'}
    layout: {type: select.select, label: Override Layout, default: left, options: {left: Number Left, center: Number Above, right: Number Right}}
    alignment: {type: select.select, label: Override Content Alignment, default: left, options: {left: Left, center: Center, right: Right}}
    numberfont: {type: input.fonts, label: Override Number Font}
    numbersize: {type: input.number, label: Override Number Font Size, min: 1, default: 24}
    numberboxsize: {type: input.number, label: Override Number Box Size, min: 1, default: 70}
    numbercolor: {type: input.colorpicker, label: Override Number Color, default: '#ffffff'}
    numberbackground: {type: input.colorpicker, label: Override Number Background, default: '#3366ff'}
    numberborderwidth: {type: input.number, label: Override Number Border Width, min: 0, default: 0}
    numberborderstyle: {type: select.select, label: Override Number Border Style, default: solid, options: {solid: Solid, dashed: Dashed, dotted: Dotted, double: Double}}
    numberbordercolor: {type: input.colorpicker, label: Override Number Border Color, default: '#3366ff'}
    numberradius: {type: input.number, label: Override Number Border Radius, min: 0, default: 50}
    gap: {type: input.number, label: Override Number and Content Gap, min: 0, default: 20}
    headingfont: {type: input.fonts, label: Override Heading Font}
    headingsize: {type: input.number, label: Override Heading Font Size, min: 1, default: 24}
    headingcolor: {type: input.colorpicker, label: Override Heading Color, default: '#222222'}
    headingmargin: {type: input.text, label: Override Heading Margin, default: '0 0 10px'}
    textfont: {type: input.fonts, label: Override Content Font}
    textsize: {type: input.number, label: Override Content Font Size, min: 1, default: 16}
    textcolor: {type: input.colorpicker, label: Override Content Color, default: '#555555'}

name: Button
description: Display a Bootstrap or fully custom styled button.
type: particle
category: content
icon: fa-hand-pointer-o
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    class: {type: input.selectize, label: CSS Classes}
    text: {type: input.text, label: Button Text, default: 'Button'}
    link: {type: input.text, label: Link, default: '#'}
    target: {type: select.select, label: Link Target, default: _self, options: {_self: Current Window, _blank: New Window}}
    nofollow: {type: input.checkbox, label: No Follow, default: false}
    download: {type: select.select, label: Download Link, default: disable, options: {enable: Enable, disable: Disable}}
    filename: {type: input.text, label: Download Filename}
    arialabel: {type: input.text, label: Aria Label}
    style: {type: select.select, label: Override Bootstrap Button Style, default: primary, options: {primary: Primary, secondary: Secondary, success: Success, info: Info, warning: Warning, danger: Danger, dark: Dark, light: Light, link: Link, custom: Custom}}
    appearance: {type: select.select, label: Appearance, default: flat, options: {flat: Flat, outline: Outline}}
    size: {type: select.select, label: Override Size, default: default, options: {default: Default, sm: Small, lg: Large, custom: Custom}}
    shape: {type: select.select, label: Override Shape, default: rounded, options: {rounded: Rounded, square: Square, pill: Pill}}
    fullwidth: {type: select.select, label: Override Full Width, default: disable, options: {enable: Enable, disable: Disable}}
    alignment: {type: select.select, label: Override Alignment, default: left, options: {left: Left, center: Center, right: Right}}
    font: {type: input.fonts, label: Override Font}
    fontsize: {type: input.number, label: Override Font Size, min: 1, default: 16}
    weight: {type: select.select, label: Override Font Weight, default: '400', options: {'300': Light, '400': Normal, '500': Medium, '600': Semi Bold, '700': Bold, '800': Extra Bold}}
    padding: {type: input.text, label: Override Custom Padding, default: '8px 22px'}
    icon: {type: input.icon, label: Override Icon}
    iconposition: {type: select.select, label: Override Icon Position, default: left, options: {left: Left, right: Right}}
    icongap: {type: input.number, label: Override Icon Gap, min: 0, default: 8}
    color: {type: input.colorpicker, label: Override Custom Text Color, default: '#ffffff'}
    background: {type: input.colorpicker, label: Override Custom Background, default: '#3366ff'}
    bordercolor: {type: input.colorpicker, label: Override Custom Border Color, default: '#3366ff'}
    hovercolor: {type: input.colorpicker, label: Override Hover Text Color, default: '#ffffff'}
    hoverbackground: {type: input.colorpicker, label: Override Hover Background, default: '#0037dd'}
    hoverbordercolor: {type: input.colorpicker, label: Override Hover Border Color, default: '#0037dd'}

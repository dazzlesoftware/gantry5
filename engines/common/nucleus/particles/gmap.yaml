name: Google Map
description: Display a responsive Google Map with one or more markers and information windows.
type: particle
category: content
icon: fa-map-marker

configuration:
  caching:
    type: static

form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    class: {type: input.selectize, label: CSS Classes}
    title: {type: input.text, label: Particle Title}
    heading: {type: select.select, label: Title Element, default: h3, options: {h2: H2, h3: H3, h4: H4, h5: H5, h6: H6}}
    titlefont: {type: input.fonts, label: Title Font}
    titlesize: {type: input.number, label: Title Font Size, min: 1, default: 28}
    titlecolor: {type: input.colorpicker, label: Title Color, default: '#222222'}
    titlemarginbottom: {type: input.number, label: Title Bottom Margin, min: 0, default: 20}
    titlealignment: {type: select.select, label: Title Alignment, default: left, options: {left: Left, center: Center, right: Right}}
    apikey: {type: input.text, label: Google Maps API Key}
    latitude: {type: input.text, label: Latitude, default: '53.251469'}
    longitude: {type: input.text, label: Longitude, default: '-113.558581'}
    infowindow: {type: textarea.textarea, label: Primary Marker Information}
    markericon: {type: input.imagepicker, label: Primary Marker Icon}
    maptype: {type: select.select, label: Map Type, default: ROADMAP, options: {ROADMAP: Roadmap, SATELLITE: Satellite, HYBRID: Hybrid, TERRAIN: Terrain}}
    zoom: {type: input.number, label: Zoom, min: 0, max: 25, default: 14}
    height: {type: input.number, label: Desktop Height, min: 100, max: 2000, default: 300}
    tabletheight: {type: input.number, label: Tablet Height, min: 100, max: 2000, default: 300}
    mobileheight: {type: input.number, label: Mobile Height, min: 100, max: 2000, default: 300}
    mousescroll: {type: select.select, label: Mouse-Wheel Zoom, default: enable, options: {enable: Enable, disable: Disable}}
    controls: {type: select.select, label: Map Controls, default: enable, options: {enable: Show, disable: Hide}}
    draggable: {type: select.select, label: Dragging, default: enable, options: {enable: Enable, disable: Disable}}
    keyboard: {type: select.select, label: Keyboard Shortcuts, default: enable, options: {enable: Enable, disable: Disable}}
    fitbounds: {type: select.select, label: Fit All Markers, default: disable, options: {enable: Enable, disable: Disable}}
    styles: {type: textarea.textarea, label: Google Map Styles JSON}
    loadingtext: {type: input.text, label: Loading Text, default: 'Loading map…'}
    errortext: {type: input.text, label: Error Text, default: 'The map could not be loaded. Check the Google Maps API key and browser console.'}
    border: {type: select.select, label: Map Border, default: hide, options: {hide: Hide, show: Show}}
    borderwidth: {type: input.number, label: Map Border Width, min: 0, default: 1}
    bordercolor: {type: input.colorpicker, label: Map Border Color, default: '#dddddd'}
    radius: {type: input.number, label: Map Border Radius, min: 0, default: 0}
    locations:
      type: collection.list
      array: true
      label: Additional Locations
      value: title
      ajax: true
      fields:
        .title: {type: input.text, label: Location Name}
        .latitude: {type: input.text, label: Latitude}
        .longitude: {type: input.text, label: Longitude}
        .content: {type: textarea.textarea, label: Information Window}
        .icon: {type: input.imagepicker, label: Marker Icon}
        .disable: {type: input.checkbox, label: Disable, default: false}

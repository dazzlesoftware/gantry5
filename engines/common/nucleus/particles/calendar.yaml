name: Calendar
description: Calendar particles for displaying dates.
type: particle
category: dynamic-content
icon: fa-calendar

configuration:
  caching:
    type: static

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable particle.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    title:
      type: input.text
      label: Title
      description: Customize the title text.
      placeholder: Enter title

    eventsheader:
      type: input.text
      label: Events Header
      description: Customize the events header.
      placeholder: Events

    titlefontsize:
      type: input.number
      label: Title Font Size
      description: Pixels; size of the month/year title. Leave empty to inherit the theme's responsive default.
      min: 1

    numbersfontsize:
      type: input.number
      label: Day Numbers Font Size
      description: Pixels; size of the day numbers in the grid. Leave empty to inherit the theme's responsive default.
      min: 1

    iconprev:
      type: input.icon
      label: Previous Arrow Icon
      default: 'fa fa-arrow-circle-left'

    iconnext:
      type: input.icon
      label: Next Arrow Icon
      default: 'fa fa-arrow-circle-right'

    iconsize:
      type: input.number
      label: Arrow Icon Size
      description: Pixels. Leave empty to inherit the theme's responsive default.
      min: 1

    iconcolor:
      type: input.colorpicker
      label: Arrow Icon Color
      description: Leave empty to inherit the theme's color.

    closeicon:
      type: input.icon
      label: Close Event Icon
      default: 'fa fa-close'

    closeiconsize:
      type: input.number
      label: Close Icon Size
      description: Pixels. Leave empty to inherit the theme's responsive default.
      min: 1

    closeiconcolor:
      type: input.colorpicker
      label: Close Icon Color
      description: Leave empty to inherit the theme's color.

    closebuttoncolor:
      type: input.colorpicker
      label: Close Button Color
      description: Background of the close button. Leave empty to inherit the theme's color.

    closebuttonhovercolor:
      type: input.colorpicker
      label: Close Button Hover Color
      description: Background of the close button on hover. Leave empty to inherit the theme's color.

    eventtitlefontsize:
      type: input.number
      label: Event Title Font Size
      description: Pixels; size of each event's title in the events list. Leave empty to inherit the theme's responsive default.
      min: 1

    eventdescfontsize:
      type: input.number
      label: Event Description Font Size
      description: Pixels; size of each event's description in the events list. Leave empty to inherit the theme's responsive default.
      min: 1

    events:
      type: collection.list
      array: true
      label: Events
      description: Create each set of images to appear in column.
      value: title
      ajax: true
      fields:

        .title:
          type: input.text
          label: Event Title

        .begin:
          type: input.date
          label: Begin Date

        .end:
          type: input.date
          label: End Date

        .description:
          type: textarea.textarea
          label: Description

        .link:
          type: input.text
          label: Event Link

        .target:
          type: select.select
          label: Target
          description: Target browser window when item is clicked.
          placeholder: 'Select...'
          default: _blank
          options:
              _self: Self
              _blank: New Window

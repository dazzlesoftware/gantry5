name: Image Overlay
description: Display an image with animated overlay content, links, and lightbox support.
type: particle
category: media
icon: fa-clone
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    class: {type: input.selectize, label: CSS Classes}
    image: {type: input.imagepicker, label: Image}
    alt: {type: input.text, label: Image Alternative Text}
    height: {type: input.number, label: Override Image Height, min: 1, default: 420}
    animation: {type: select.select, label: Override Background Animation, default: zoom, options: {none: None, zoom: Zoom, panleft: Pan Left, panright: Pan Right}}
    contentposition: {type: select.select, label: Override Content Position, default: center, options: {topleft: Top Left, topcenter: Top Center, topright: Top Right, centerleft: Center Left, center: Center, centerright: Center Right, bottomleft: Bottom Left, bottomcenter: Bottom Center, bottomright: Bottom Right}}
    showonhover: {type: select.select, label: Show Content on Hover Only, default: disable, options: {enable: Enable, disable: Disable}}
    padding: {type: input.text, label: Override Content Padding, default: '2rem'}
    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    title: {type: input.text, label: Title, default: Image Overlay}
    titleicon: {type: input.icon, label: Override Title Icon}
    heading: {type: select.select, label: Override Title Element, default: h2, options: {h2: H2, h3: H3, h4: H4, h5: H5, h6: H6}}
    titlecolor: {type: input.colorpicker, label: Override Title Color, default: '#ffffff'}
    subtitle: {type: input.text, label: Subtitle}
    subtitleicon: {type: input.icon, label: Override Subtitle Icon}
    subtitlecolor: {type: input.colorpicker, label: Override Subtitle Color, default: '#ffffff'}
    overlay: {type: input.colorpicker, label: Override Overlay Color, default: 'rgba(0,0,0,0.35)'}
    hoveroverlay: {type: input.colorpicker, label: Override Hover Overlay Color, default: 'rgba(0,0,0,0.6)'}
    tag: {type: input.text, label: Tag, description: 'Optional small badge shown over the top corner of the image (e.g. "New", "Featured"). Leave empty to omit.'}
    tagcolor: {type: input.colorpicker, label: Override Tag Text Color, default: '#ffffff'}
    tagbackground: {type: input.colorpicker, label: Override Tag Background Color, default: '#3366ff'}
    link: {type: input.text, label: Container Link}
    lightbox: {type: select.select, label: Open Image in Lightbox, default: disable, options: {enable: Enable, disable: Disable}}
    buttontext: {type: input.text, label: Button Text}
    buttonlink: {type: input.text, label: Button Link}
    buttonstyle: {type: select.select, label: Override Bootstrap Button Style, default: light, options: {primary: Primary, secondary: Secondary, success: Success, danger: Danger, warning: Warning, info: Info, light: Light, dark: Dark}}
    radius: {type: input.number, label: Override Border Radius, min: 0, default: 0}
    desc: {type: textarea.textarea, label: Description, description: 'Optional text shown below the image, outside the overlay. Leave empty to omit.'}

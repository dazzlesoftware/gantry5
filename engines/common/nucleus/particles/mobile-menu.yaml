name: Mobile Menu
description: Optional compatibility mount point for saved outlines using Bootstrap Offcanvas.
type: particle
category: general
icon: fa-ellipsis-v
hidden: false

configuration:
  caching:
    type: static

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Enable the compatibility mount point. Bootstrap supplies it automatically when disabled.
      default: true

    _note:
      type: separator.note
      class: alert alert-info
      content: '<p>This particle is optional. Bootstrap Offcanvas creates the mobile-menu container automatically when the particle is disabled or absent.</p>'

name: Image Layouts
description: Display an image, content, caption, and action using flexible presets.
type: particle
category: media
icon: fa-object-group
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    class: {type: input.selectize, label: CSS Classes}
    preset: {type: select.select, label: Override Layout Preset, default: card, options: {inline: Inline, stack: Stack, poster: Poster, card: Card, overlap: Overlap}}
    image: {type: input.imagepicker, label: Image}
    alt: {type: input.text, label: Image Alternative Text}
    imageposition: {type: select.select, label: Override Image Position, default: left, options: {left: Left, right: Right}}
    imagecolumns: {type: input.number, label: Override Image Width, description: Bootstrap columns out of 12 for Inline and Overlap., min: 1, max: 11, default: 6}
    imageheight: {type: input.number, label: Override Image Height, min: 1, default: 420}
    imagefit: {type: select.select, label: Image Fit, default: cover, options: {cover: Cover, contain: Contain}}
    imageradius: {type: input.number, label: Override Image Border Radius, min: 0, default: 0}
    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    title: {type: input.text, label: Title, default: Image Layout}
    heading: {type: select.select, label: Override Title Element, default: h2, options: {h2: H2, h3: H3, h4: H4, h5: H5, h6: H6}}
    content: {type: textarea.textarea, label: Content, default: Add your content here.}
    alignment: {type: select.select, label: Override Content Alignment, default: left, options: {left: Left, center: Center, right: Right}}
    contentpadding: {type: input.text, label: Override Content Padding, default: '2rem'}
    contentcolor: {type: input.colorpicker, label: Override Content Color, default: '#222222'}
    contentbackground: {type: input.colorpicker, label: Override Content Background, default: '#ffffff'}
    caption: {type: input.text, label: Caption}
    captionposition: {type: select.select, label: Override Caption Position, default: bottom, options: {top: Top, bottom: Bottom, overlay: Image Overlay}}
    lightbox: {type: select.select, label: Image Lightbox, default: disable, options: {enable: Enable, disable: Disable}}
    popupvideo: {type: input.text, label: Popup Video URL, description: 'YouTube, Vimeo, or direct video URL. Overrides image lightbox when provided.'}
    buttontext: {type: input.text, label: Button Text}
    buttonlink: {type: input.text, label: Button Link}
    buttonstyle: {type: select.select, label: Override Bootstrap Button Style, default: primary, options: {primary: Primary, secondary: Secondary, success: Success, danger: Danger, warning: Warning, info: Info, light: Light, dark: Dark}}
    wrapperborder: {type: input.number, label: Override Wrapper Border Width, min: 0, default: 0}
    wrapperbordercolor: {type: input.colorpicker, label: Override Wrapper Border Color, default: '#dddddd'}
    wrapperradius: {type: input.number, label: Override Wrapper Border Radius, min: 0, default: 0}
    shadow: {type: select.select, label: Override Box Shadow, default: disable, options: {enable: Enable, disable: Disable}}

name: Audio Player
description: Play local or externally hosted audio in an accessible playlist.
type: particle
category: media
icon: fa-music

configuration:
  caching:
    type: static

form:
  overrideable: false
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      description: Globally enable the particle.
      default: true

    class:
      type: input.selectize
      label: CSS Classes
      description: CSS class name for the particle.

    title:
      type: input.text
      label: Title
      description: Customize the title text.
      placeholder: Enter title

    nowplaying:
      type: input.text
      label: Now Playing Label
      description: Customize the now playing text.
      placeholder: Now Playing
      default: Now Playing

    scrollbar:
      type: select.selectize
      label: Playlist Layout
      description: Display the complete playlist or constrain it to a scrolling region.
      placeholder: Select...
      default: noscrollbar
      options:
        scrollbar: With Scrollbar
        noscrollbar: Without Scrollbar

    overflow:
      type: input.number
      label: Overflow Height
      description: Set the playlist height in pixels when using the scrolling layout.
      placeholder: 350
      default: 350
      min: 1

    items:
      type: collection.list
      array: true
      label: Files
      description: Add audio tracks to the playlist.
      value: title
      ajax: true
      fields:
        .title:
          type: input.text
          label: Item Title
          description: Customize the item title.
          placeholder: Enter item title

        .artist:
          type: input.text
          label: Artist
          description: Customize the artist name.
          placeholder: Enter artist name

        .tracktitle:
          type: input.text
          label: Track Title
          description: Customize the track title.
          placeholder: Enter track title

        .cover:
          type: input.imagepicker
          label: Album Cover
          description: Select the album cover.

        .source:
          type: select.selectize
          label: Audio Source
          description: Select a local audio file or enter an external URL.
          placeholder: Select...
          default: local
          options:
            local: Local File
            external: External URL

        .externalurl:
          type: input.text
          label: External URL
          description: Enter the URL for an externally hosted audio file.

        .localurl:
          type: input.filepicker
          label: Local Audio
          description: Select the local audio file.

        .link:
          type: input.text
          label: Link
          description: Enter an optional related link.

        .linktext:
          type: input.text
          label: Link Text
          description: Enter the text for the related link.

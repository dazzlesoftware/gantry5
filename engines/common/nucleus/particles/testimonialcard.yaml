name: Testimonial
description: Display a customer testimonial with avatar, attribution, quote, and rating.
type: particle
category: content
icon: fa-quote-left

configuration:
  caching:
    type: static

form:
  fields:
    enabled:
      type: input.checkbox
      label: Enabled
      default: true

    class:
      type: input.selectize
      label: CSS Classes

    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    title:
      type: input.text
      label: Title

    heading:
      type: select.select
      label: Override Title Element
      default: h3
      options:
        h1: H1
        h2: H2
        h3: H3
        h4: H4
        h5: H5
        h6: H6

    review:
      type: textarea.textarea
      label: Testimonial
      default: 'Anim pariatur cliche reprehenderit, enim eiusmod high life accusamus terry richardson ad squid.'

    name:
      type: input.text
      label: Name
      default: John Doe

    designation:
      type: input.text
      label: Designation
      default: 'CEO, Company'

    link:
      type: input.text
      label: Author Link

    target:
      type: select.select
      label: Link Target
      default: _self
      options:
        _self: Current Window
        _blank: New Window

    avatar:
      type: input.imagepicker
      label: Avatar

    avataralt:
      type: input.text
      label: Avatar Alternative Text

    avatarsize:
      type: input.number
      label: Override Avatar Size
      description: Avatar width and height in pixels.
      min: 16
      max: 400
      default: 64

    avatarshape:
      type: select.select
      label: Override Avatar Shape
      default: circle
      options:
        circle: Circle
        rounded: Rounded
        square: Square

    authorposition:
      type: select.select
      label: Override Author Position
      default: bottom
      options:
        top: Above Testimonial
        bottom: Below Testimonial

    authorlayout:
      type: select.select
      label: Override Author Layout
      default: inline
      options:
        inline: Inline
        stacked: Stacked

    alignment:
      type: select.select
      label: Override Alignment
      default: left
      options:
        left: Left
        center: Center
        right: Right

    showquote:
      type: select.select
      label: Override Quote Icon
      default: enable
      options:
        enable: Show
        disable: Hide

    quotesize:
      type: input.number
      label: Override Quote Size
      min: 12
      max: 200
      default: 48

    quotecolor:
      type: input.colorpicker
      label: Override Quote Color
      default: '#edeef2'

    ratingenabled:
      type: select.select
      label: Override Rating
      default: disable
      options:
        enable: Show
        disable: Hide

    rating:
      type: input.number
      label: Stars
      min: 0
      max: 5
      default: 5

    ratingcolor:
      type: input.colorpicker
      label: Override Rated Star Color
      default: '#f5a623'

    unratedcolor:
      type: input.colorpicker
      label: Override Unrated Star Color
      default: '#d5d5d5'

    reviewcolor:
      type: input.colorpicker
      label: Override Testimonial Color

    namecolor:
      type: input.colorpicker
      label: Override Name Color

    designationcolor:
      type: input.colorpicker
      label: Override Designation Color

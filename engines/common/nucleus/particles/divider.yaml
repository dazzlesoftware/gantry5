name: Divider
description: Add a responsive horizontal or vertical border or image divider.
type: particle
category: general
icon: fa-minus
configuration: {caching: {type: static}}
form:
  fields:
    enabled: {type: input.checkbox, label: Enabled, default: true}
    stylesource: {type: select.select, label: Style Source, default: inherit, description: Inherit the outline defaults from Particle Styles or use the values below., options: {inherit: Inherit from Particle Styles, override: Override in This Particle}}
    class: {type: input.selectize, label: CSS Classes}
    type: {type: select.select, label: Divider Type, default: border, options: {border: Border, image: Image}}
    orientation: {type: select.select, label: Orientation, default: horizontal, options: {horizontal: Horizontal, vertical: Vertical}}
    borderwidth: {type: input.number, label: Override Border Width, min: 1, default: 1}
    borderstyle: {type: select.select, label: Override Border Style, default: solid, options: {solid: Solid, dashed: Dashed, dotted: Dotted, double: Double}}
    bordercolor: {type: input.colorpicker, label: Override Border Color, default: '#cccccc'}
    borderradius: {type: input.number, label: Override Border Radius, min: 0, default: 0}
    image: {type: input.imagepicker, label: Divider Image}
    repeat: {type: select.select, label: Image Repeat, default: no-repeat, options: {no-repeat: No Repeat, repeat: Repeat, repeat-x: Repeat Horizontally, repeat-y: Repeat Vertically}}
    imagesize: {type: select.select, label: Override Image Size, default: auto, options: {auto: Auto, cover: Cover, contain: Contain}}
    width: {type: input.number, label: Override Desktop Width, min: 1, default: 100}
    tabletwidth: {type: input.number, label: Override Tablet Width, min: 1, default: 100}
    mobilewidth: {type: input.number, label: Override Mobile Width, min: 1, default: 100}
    widthunit: {type: select.select, label: Override Width Unit, default: percent, options: {percent: Percent, pixel: Pixels}}
    height: {type: input.number, label: Override Desktop Height, min: 1, default: 10}
    tabletheight: {type: input.number, label: Override Tablet Height, min: 1, default: 10}
    mobileheight: {type: input.number, label: Override Mobile Height, min: 1, default: 10}
    verticalheight: {type: input.number, label: Override Vertical Divider Height, min: 1, default: 100}
    alignment: {type: select.select, label: Override Alignment, default: center, options: {left: Left, center: Center, right: Right}}
    margintop: {type: input.number, label: Override Margin Top, default: 30}
    marginbottom: {type: input.number, label: Override Margin Bottom, default: 30}

name: Font Awesome Settings
description: Configuration for Font Awesome icon set and toolkit.
type: global

form:
  fields:

    _info:
      type: separator.note
      condition: override
      content: Set your Font Awesome settings in the <strong>Base Outline</strong>. These settings should not be overridden <strong>here</strong>.

    enable:
      type: enable.enable
      label: Enable
      description: Enable or disable the loading of the Font Awesome icon library on the frontend. This is useful if you want to manually add a different version of the library (e.g. paid version).
      default: 1

    version:
      type: select.select
      label: Version
      description: Specify which version of the Font Awesome icon library should be loaded on the frontend. You can also completely disable Font Awesome or specify the import tags yourself in the textfield below.
      default: fa7css
      options:
        fa5css: Font Awesome 5 Free (Webfont / CSS)
        fa5js: Font Awesome 5 Free (SVG / JS)
        fa6css: Font Awesome 6 Free (Webfont / CSS)
        fa6js: Font Awesome 6 Free (SVG / JS)
        fa7css: Font Awesome 7 Free (Webfont / CSS)
        fa7js: Font Awesome 7 Free (SVG / JS)

    fa4_compatibility:
      type: enable.enable
      label: V4 Compatibility
      description: Enable or disable backwards compatibility for Font Awesome 4 icons when using a newer Font Awesome library.
      default: 1

    content_compatibility:
      type: enable.enable
      label: Content Compatibility
      description: Enable or disable content (pseudo-element) compatibility when using an SVG / JS version of Font Awesome. This also applies when loading the library manually.
      default: 1

    html_css_import:
      type: textarea.textarea
      label: CSS Link HTML (Manual Override)
      description: Enter your HTML to manually load the CSS files of the Font Awesome library. This option replaces the Genesis version of the library.

    html_js_import:
      type: textarea.textarea
      label: JS Script HTML (Manual Override)
      description: Enter your HTML to manually load the JS files of the Font Awesome library. This option replaces the Genesis version of the library.

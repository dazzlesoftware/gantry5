name: Tabler Icons Settings
description: Configuration for the bundled Tabler Icons library.
type: global

form:
  fields:

    _info:
      type: separator.note
      condition: override
      content: Set your Tabler Icons settings in the <strong>Base Outline</strong>. These settings should not be overridden <strong>here</strong>.

    enable:
      type: enable.enable
      label: Enable
      description: Enable or disable Tabler Icons in the icon picker and on the frontend.
      default: 1
